options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: europe-central2
  _AR_REPO: api
  _API_SERVICE: brevierp-api
  _SEED_JOB: brevierp-seed
  _TELEGRAM_TOKEN_SECRET: telegram-reminders-bot-token
  _TELEGRAM_WEBHOOK_SECRET: telegram-reminders-webhook-secret

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build Host.Api image
    args:
      - build
      - -f
      - src/Bootstrapper/Host.Api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-api:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push Host.Api image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-api:$COMMIT_SHA

  - name: gcr.io/cloud-builders/docker
    id: Build Host.Seed image
    args:
      - build
      - -f
      - src/Bootstrapper/Host.Seed/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-seed:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push Host.Seed image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-seed:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Create or update Host.Seed Cloud Run Job
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-seed:$COMMIT_SHA"
        # The same job runs the daily reminders (--reminders-dispatch=true from Cloud Scheduler).
        # The bot token is attached once the secret exists, so deploys keep working before Telegram is set up.
        SECRETS=()
        if gcloud secrets describe "${_TELEGRAM_TOKEN_SECRET}" >/dev/null 2>&1; then
          SECRETS=(--update-secrets "Reminders__Telegram__BotToken=${_TELEGRAM_TOKEN_SECRET}:latest")
        fi
        if gcloud run jobs describe "${_SEED_JOB}" --region "${_REGION}" >/dev/null 2>&1; then
          gcloud run jobs update "${_SEED_JOB}" \
            --image "$${IMAGE}" \
            --region "${_REGION}" \
            --max-retries 1 \
            --tasks 1 \
            --parallelism 1 \
            "$${SECRETS[@]}" \
            --quiet
        else
          gcloud run jobs create "${_SEED_JOB}" \
            --image "$${IMAGE}" \
            --region "${_REGION}" \
            --max-retries 1 \
            --tasks 1 \
            --parallelism 1 \
            "$${SECRETS[@]}" \
            --quiet
        fi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Run database migrations and seed data
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_SEED_JOB}
      - --region=${_REGION}
      - --wait
      - --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy Host.Api to Cloud Run
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SECRETS="AdmToolsStorage__Login=storage-login:latest,AdmToolsStorage__Password=storage-password:latest"
        # Telegram reminders: token and webhook secret are added only after they are created in Secret Manager.
        if gcloud secrets describe "${_TELEGRAM_TOKEN_SECRET}" >/dev/null 2>&1 \
          && gcloud secrets describe "${_TELEGRAM_WEBHOOK_SECRET}" >/dev/null 2>&1; then
          SECRETS="$${SECRETS},Reminders__Telegram__BotToken=${_TELEGRAM_TOKEN_SECRET}:latest,Reminders__Telegram__WebhookSecret=${_TELEGRAM_WEBHOOK_SECRET}:latest"
        fi
        gcloud run deploy "${_API_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-api:$COMMIT_SHA" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --update-secrets="$${SECRETS}" \
          --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-api:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-seed:$COMMIT_SHA
