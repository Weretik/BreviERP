options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: europe-central2
  _AR_REPO: api
  _API_SERVICE: brevierp-api
  _SEED_JOB: brevierp-seed
  _REMINDERS_JOB: brevierp-reminders
  # Gmail activation is a separate release decision; preserve a send-disabled deployment by default.
  _CRM_DELIVERY_ENABLED: 'false'
  _TELEGRAM_TOKEN_SECRET: telegram-reminders-bot-token
  _TELEGRAM_WEBHOOK_SECRET: telegram-reminders-webhook-secret

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build Host.Api image
    args:
      - build
      - -f
      - src/Bootstrapper/Host.Api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-api:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push Host.Api image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-api:$COMMIT_SHA

  - name: gcr.io/cloud-builders/docker
    id: Build Host.Seed image
    args:
      - build
      - -f
      - src/Bootstrapper/Host.Seed/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-seed:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push Host.Seed image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-seed:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Create or update Host.Seed Cloud Run Job
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-seed:$COMMIT_SHA"
        if gcloud run jobs describe "${_SEED_JOB}" --region "${_REGION}" >/dev/null 2>&1; then
          gcloud run jobs update "${_SEED_JOB}" \
            --image "$${IMAGE}" \
            --region "${_REGION}" \
            --max-retries 1 \
            --tasks 1 \
            --parallelism 1 \
            --quiet
        else
          gcloud run jobs create "${_SEED_JOB}" \
            --image "$${IMAGE}" \
            --region "${_REGION}" \
            --max-retries 1 \
            --tasks 1 \
            --parallelism 1 \
            --quiet
        fi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Create or update Telegram reminders Cloud Run Job
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-seed:$COMMIT_SHA"
        # Daily reminders run (Cloud Scheduler, weekdays 09:00 Kyiv). Same image as the seed job, but it only
        # dispatches reminders: no migrations or seed. The first build copies the seed job, so the reminders job
        # gets the same database connection, service account and Cloud SQL settings.
        if ! gcloud run jobs describe "${_REMINDERS_JOB}" --region "${_REGION}" >/dev/null 2>&1; then
          gcloud run jobs describe "${_SEED_JOB}" --region "${_REGION}" --format export > /workspace/reminders-job.yaml
          sed -i "0,/^  name: ${_SEED_JOB}$$/s//  name: ${_REMINDERS_JOB}/" /workspace/reminders-job.yaml
          # Drop who/when annotations of the seed job; they belong to that job only.
          sed -i -E '/run\.googleapis\.com\/(creator|lastModifier|operation-id):/d' /workspace/reminders-job.yaml
          gcloud run jobs replace /workspace/reminders-job.yaml --region "${_REGION}" --quiet
        fi
        gcloud run jobs update "${_REMINDERS_JOB}" \
          --image "$${IMAGE}" \
          --region "${_REGION}" \
          --args=--reminders-dispatch=true \
          --max-retries 1 \
          --tasks 1 \
          --parallelism 1 \
          --update-secrets "Reminders__Telegram__BotToken=${_TELEGRAM_TOKEN_SECRET}:latest" \
          --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Run database migrations and seed data
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_SEED_JOB}
      - --region=${_REGION}
      - --wait
      - --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy Host.Api to Cloud Run
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Telegram reminders secrets are always attached: they exist in production, and a missing secret should
        # fail the deploy loudly instead of being skipped silently.
        SECRETS="AdmToolsStorage__Login=storage-login:latest,AdmToolsStorage__Password=storage-password:latest"
        SECRETS="$${SECRETS},Reminders__Telegram__BotToken=${_TELEGRAM_TOKEN_SECRET}:latest"
        SECRETS="$${SECRETS},Reminders__Telegram__WebhookSecret=${_TELEGRAM_WEBHOOK_SECRET}:latest"
        gcloud run deploy "${_API_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-api:$COMMIT_SHA" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --update-env-vars="Crm__Delivery__Enabled=${_CRM_DELIVERY_ENABLED}" \
          --update-secrets="$${SECRETS}" \
          --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-api:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/host-seed:$COMMIT_SHA
