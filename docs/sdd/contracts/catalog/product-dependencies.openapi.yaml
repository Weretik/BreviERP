openapi: 3.1.0
info:
  title: BreviERP Product Form Dependencies
  version: 1.0.0
  description: Existing category lookup used by Product forms. Photos moved to the Media library contract (../media/media-library.openapi.yaml).
servers:
  - url: /
paths:
  /api/reference/product-categories/admin:
    get:
      operationId: getAdminProductCategories
      summary: List admin product categories
      security: []
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminProductCategoryRow' }
        '401': { description: Unauthorized. }
        '404': { description: No categories found. }
components:
  schemas:
    AdminProductCategoryRow:
      type: object
      required: [id, name, ruName, slug, path, level, sortOrder, isActive]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        ruName: { type: string }
        slug: { type: string }
        parentId: { type: [integer, 'null'] }
        path: { type: string }
        level: { type: integer }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        description: { type: [string, 'null'] }
