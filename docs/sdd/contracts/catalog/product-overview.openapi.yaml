openapi: 3.1.0
info:
  title: BreviERP Product Overview API
  version: 1.0.0
  description: >-
    The «Товари» page (CAT-006): one row per sewing model or PPE site article with its working fields from the
    Calculator sheet tabs «Товари» and «ЗІЗ». The fields live in the product catalog profile. Site texts, SEO and
    photos are not here; they move to the future Content module.
servers:
  - url: /
paths:
  /api/v1/products/overview:
    get:
      operationId: getProductOverview
      summary: One page of a «Товари» tab (CAT-013)
      description: >-
        CatalogRead. The server searches, filters, sorts and pages the rows of one type and returns them with their
        prices, so the list needs this single request. Prices are read, never recalculated: sewing prices are the
        stored published prices of each fabric variant (automatic publication keeps them current, CAT-012); PPE
        prices come from the current offer and rule. prices is the lowest price of each tier among the active
        variants. problems lists the reasons a price is missing (of the row or of an active variant) and is empty
        when everything is priced. sections and withoutPrice count every row of the type, for the filter chips.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [Sewing, Ppe] }
        - name: search
          in: query
          required: false
          description: Code, name, quote description, variant SKU or fabric name; case-insensitive.
          schema: { type: string, maxLength: 200 }
        - name: section
          in: query
          required: false
          description: A section ID from /api/reference/product-sections, or none for rows without a section.
          schema: { type: string }
        - name: withoutPrice
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          required: false
          description: code is natural (MOD-2 before MOD-10, article 9 before 17; rows without a code last); price is the 1–9 pcs price, rows without a price last in both directions. Ties go by name.
          schema: { type: string, enum: [code, name, price, updated], default: code }
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductOverviewPage' }
        '400': { description: 'Unknown type, section, sort or direction, or an invalid page.' }
        '401': { description: Unauthorized. }
        '403': { description: CatalogRead required. }
    post:
      operationId: createCatalogProduct
      summary: Create a product from the page «Новий ЗІЗ» or «Нова модель»
      description: >-
        Requires CanManageProducts and an actor (CAT-009). The server picks the ID (largest + 1) and the slug (from the
        Ukrainian name; the code and then a number are added when it is taken). The name is Ukrainian only. An empty
        sewing code takes the next free MOD-XXX. The section must belong to the type. A PPE product needs the ppe
        block; the first price version is appended with source «Створення ЗІЗ». priceSaved is false when the product was
        saved but its price was not; the card then asks to save the price again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCatalogProductRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedCatalogProduct' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission or actor claim missing. }
        '409': { description: The code or the name is already used by another product. }
  /api/v1/products/overview/code-check:
    get:
      operationId: getProductCodeCheck
      summary: Check a new product code and suggest the next sewing code
      description: >-
        CatalogRead. Whether the code is free for a new product of the type. For sewing, suggestedCode is the next free
        MOD-XXX. Without code only the suggestion is returned and isAvailable is null.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [Sewing, Ppe] }
        - name: code
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCodeCheck' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/products/{id}/overview:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
    get:
      operationId: getProductOverviewItem
      summary: One «Товари» row with prices and fabric variants (CAT-013)
      description: CatalogRead. The same item as in the list page, for the product card.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductOverviewItem' }
        '400': { description: Invalid ID. }
        '401': { description: Unauthorized. }
        '403': { description: CatalogRead required. }
        '404': { description: No such product. }
    put:
      operationId: updateProductOverview
      summary: Replace the «Товари» page fields of a product
      description: >-
        Requires CanManageProducts (open while temporary anonymous access is on). Every field is replaced. A PPE
        product needs a code (site article). The section must exist in Reference «Типи і розділи» and belong to the
        product type. Season is for sewing only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductOverviewRequest' }
      responses:
        '200': { description: Saved. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
        '404': { description: Product not found. }
        '409': { description: Another product of the same type has this code. }
  /api/v1/products/sheet-import:
    post:
      operationId: importSheetProducts
      summary: Import all products from the Calculator sheet (preview or apply)
      description: >-
        Requires CanManageProducts and an actor (CAT-010). One-time transfer of the tabs «Товари» (with «Прайс на
        сайт», «Комплектація виробів», «Трудовитрати виробів») and «ЗІЗ». A row matches a stored product by type and
        code (sewing model ID, PPE site article), else by the exact name of the same type; a matched product keeps
        its ID and slug, the rest are created (ID largest + 1, slug as in createCatalogProduct). Names are Ukrainian
        only; the Russian name column gets a copy. A matched sewing model gets its article list and whole composition
        replaced; the note «Спільна складова для всіх артикулів моделі» that the sheet repeats on shared lines is
        dropped. A PPE product gets a new offer version (source «Імпорт з таблиці», dated the import day) only when the supplier price, the rule or a
        given Insight price differs; no supplier price means no version. With deleteMissing, every product of either
        type that no row matches is deleted. dryRun (default true) never writes. Any problem means nothing is
        written; warnings (unknown rule imported as none, no supplier price or link) do not stop the import. All
        writes run in one database transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportSheetProductsRequest' }
      responses:
        '200':
          description: Report. applied is false for a preview and whenever problems is not empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SheetImportReport' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission or actor claim missing. }
        '409': { description: The database rejected the write (changed meanwhile); nothing is saved. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    ValidationError:
      description: Validation failures including field identifiers.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/ValidationError' }
  schemas:
    ValidationError:
      type: object
      required: [identifier, errorMessage]
      properties:
        identifier: { type: string }
        errorMessage: { type: string }
        errorCode: { type: [string, 'null'] }
        severity: { type: integer }
    ProductOverviewPage:
      type: object
      required: [items, page, pageSize, total, all, sections, withoutPrice]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductOverviewItem' }
        page: { type: integer, format: int32 }
        pageSize: { type: integer, format: int32 }
        total: { type: integer, format: int32, description: Rows that match the search and filters. }
        all: { type: integer, format: int32, description: Every row of the type. }
        sections:
          type: array
          description: Rows of the type per section; sectionId null counts rows without a section.
          items: { $ref: '#/components/schemas/ProductSectionCount' }
        withoutPrice: { type: integer, format: int32, description: Rows of the type without a price. }
    ProductSectionCount:
      type: object
      required: [sectionId, count]
      properties:
        sectionId: { type: [integer, 'null'], format: int32 }
        count: { type: integer, format: int32 }
    ProductOverviewItem:
      type: object
      required: [id, type, code, name, sectionId, season, isActive, currentSiteUrl, quoteDescription, updatedAtUtc, prices, pricesUpdatedAt, problems, variants]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        type: { type: string, enum: [Sewing, Ppe] }
        code: { type: [string, 'null'], description: Model ID (MOD-…) for sewing, site article for PPE. }
        name: { type: string }
        sectionId: { type: [integer, 'null'], format: int32, description: ID from /api/reference/product-sections. }
        season: { type: [string, 'null'], enum: ['Літо', 'Зима', null] }
        isActive: { type: boolean }
        currentSiteUrl: { type: [string, 'null'], description: Product page on the current public site; quotes take photos from it (temporary). }
        quoteDescription: { type: [string, 'null'], description: Short description for a quote (КП). }
        updatedAtUtc: { type: string, format: date-time }
        prices:
          description: Lowest price of each tier among the active variants (sewing) or the rule price (PPE).
          oneOf: [{ $ref: '#/components/schemas/ProductPriceTiers' }, { type: 'null' }]
        pricesUpdatedAt: { type: [string, 'null'], format: date-time, description: Latest publication (sewing) or offer date (PPE). }
        problems:
          type: array
          description: >-
            Calculation codes that explain a missing price (for example MissingOperations, MissingFabric,
            MissingOffer, NoActiveArticle, Unpublished); empty when everything is priced.
          items: { type: string }
        variants:
          type: array
          description: Fabric variants of a sewing model; empty for PPE.
          items: { $ref: '#/components/schemas/ProductOverviewVariant' }
    ProductOverviewVariant:
      type: object
      required: [articleId, saleSku, active, fabricId, fabricName, prices, publishedAt, problems]
      properties:
        articleId: { type: integer, format: int64 }
        saleSku: { type: string }
        active: { type: boolean }
        fabricId: { type: [integer, 'null'], format: int32, description: The variant's own fabric, else the model's shared fabric. }
        fabricName: { type: [string, 'null'] }
        prices: { oneOf: [{ $ref: '#/components/schemas/ProductPriceTiers' }, { type: 'null' }] }
        publishedAt: { type: [string, 'null'], format: date-time }
        problems: { type: array, items: { type: string } }
    UpdateProductOverviewRequest:
      type: object
      required: [isActive]
      properties:
        code: { type: [string, 'null'], maxLength: 80 }
        sectionId: { type: [integer, 'null'], format: int32, minimum: 1 }
        season: { type: [string, 'null'], enum: ['Літо', 'Зима', null] }
        isActive: { type: boolean }
        currentSiteUrl: { type: [string, 'null'], maxLength: 500, format: uri }
        quoteDescription: { type: [string, 'null'], maxLength: 2000 }
    CreateCatalogProductRequest:
      type: object
      required: [type, name, sectionId, isActive]
      properties:
        type: { type: string, enum: [Sewing, Ppe] }
        code: { type: [string, 'null'], maxLength: 80, description: Required for PPE; empty sewing code takes the next MOD-XXX. }
        name: { type: string, minLength: 1, maxLength: 200 }
        sectionId: { type: integer, format: int32, minimum: 1 }
        season: { type: [string, 'null'], enum: ['Літо', 'Зима', null] }
        isActive: { type: boolean }
        currentSiteUrl: { type: [string, 'null'], maxLength: 500, format: uri }
        quoteDescription: { type: [string, 'null'], maxLength: 2000 }
        ppe:
          anyOf:
            - { $ref: '#/components/schemas/CreatePpeSupplierRequest' }
            - { type: 'null' }
    CreatePpeSupplierRequest:
      type: object
      required: [supplierId, supplierUrl, supplierPrice, allowManualPrice, ruleCode, unit]
      properties:
        supplierId: { type: integer, format: int32, minimum: 1 }
        supplierSku: { type: [string, 'null'], maxLength: 200 }
        supplierUrl: { type: string, maxLength: 2048, format: uri }
        supplierPrice: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 10000000 }
        allowManualPrice: { type: boolean }
        ruleCode: { type: string, minLength: 1, maxLength: 200 }
        unit: { type: string, minLength: 1, maxLength: 40 }
    CreatedCatalogProduct:
      type: object
      required: [id, type, code, priceSaved]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        type: { type: string, enum: [Sewing, Ppe] }
        code: { type: [string, 'null'] }
        priceSaved: { type: boolean }
    ProductCodeCheck:
      type: object
      required: [code, isAvailable, takenByProductId, takenByProductName, suggestedCode]
      properties:
        code: { type: [string, 'null'] }
        isAvailable: { type: [boolean, 'null'] }
        takenByProductId: { type: [integer, 'null'], format: int32 }
        takenByProductName: { type: [string, 'null'] }
        suggestedCode: { type: [string, 'null'], description: Next free MOD-XXX for sewing; null for PPE. }
    ImportSheetProductsRequest:
      type: object
      required: [sewing, ppe]
      properties:
        sewing:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/SheetSewingRow' }
        ppe:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/SheetPpeRow' }
        dryRun: { type: boolean, default: true, description: Only compute the report; nothing is saved. }
        deleteMissing: { type: boolean, default: false, description: Delete stored products that no row matches. }
    SheetSewingRow:
      type: object
      required: [rowNumber, code, name, isActive, articles, materials, operations]
      properties:
        rowNumber: { type: integer, format: int32 }
        code: { type: string, description: Model ID MOD-…. }
        name: { type: string, maxLength: 200 }
        section: { type: [string, 'null'], description: Sewing section name in Reference «Типи і розділи». }
        season: { type: [string, 'null'], enum: ['Літо', 'Зима', null] }
        isActive: { type: boolean }
        currentSiteUrl: { type: [string, 'null'], format: uri }
        quoteDescription: { type: [string, 'null'], maxLength: 2000 }
        articles:
          type: array
          items: { $ref: '#/components/schemas/SheetSewingArticleRow' }
        materials:
          type: array
          items: { $ref: '#/components/schemas/SheetSewingMaterialRow' }
        operations:
          type: array
          items: { $ref: '#/components/schemas/SheetSewingOperationRow' }
    SheetSewingArticleRow:
      type: object
      required: [saleSku, isActive]
      properties:
        saleSku: { type: string, maxLength: 80 }
        isActive: { type: boolean }
    SheetSewingMaterialRow:
      type: object
      required: [rowNumber, kind, code, quantity, unit]
      properties:
        rowNumber: { type: integer, format: int32 }
        article: { type: [string, 'null'], description: Sale SKU of the article; null for a line shared by all articles. }
        kind: { type: string, enum: [Fabric, Accessory] }
        code: { type: string, description: FAB-… or FUR-…. }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, enum: [Metre, Piece], description: A fabric is in metres. }
        comment: { type: [string, 'null'], maxLength: 500 }
    SheetSewingOperationRow:
      type: object
      required: [rowNumber, code, quantity]
      properties:
        rowNumber: { type: integer, format: int32 }
        article: { type: 'null', description: Operations are shared by all articles; a value is a problem. }
        code: { type: string, description: OP-…; the same operation may appear more than once. }
        quantity: { type: number, exclusiveMinimum: 0 }
        manualMinutes: { type: [number, 'null'], exclusiveMinimum: 0 }
        comment: { type: [string, 'null'], maxLength: 500 }
    SheetPpeRow:
      type: object
      required: [rowNumber, code, name, isActive, allowManualPrice]
      properties:
        rowNumber: { type: integer, format: int32 }
        code: { type: string, maxLength: 80, description: Site article. }
        name: { type: string, maxLength: 200 }
        section: { type: [string, 'null'], description: PPE section name in Reference «Типи і розділи». }
        unit: { type: [string, 'null'], maxLength: 40 }
        currentSiteUrl: { type: [string, 'null'], format: uri }
        supplierName: { type: [string, 'null'], description: 'Reference supplier name, trimmed, ignoring case; the sheet typo «3C-Макркет» means «3C-Маркет».' }
        supplierUrl: { type: [string, 'null'], format: uri }
        supplierSku: { type: [string, 'null'], maxLength: 200 }
        supplierPrice: { type: [number, 'null'], exclusiveMinimum: 0, description: Null means no price version (warning). }
        isActive: { type: boolean }
        allowManualPrice: { type: boolean }
        ruleCode: { type: [string, 'null'], maxLength: 200, description: PPE rule code (the rule name); an unknown one is imported as none (warning). }
        quoteDescription: { type: [string, 'null'], maxLength: 2000 }
        insightWholesale: { type: [number, 'null'], minimum: 0 }
        insightRetail: { type: [number, 'null'], minimum: 0 }
    SheetImportReport:
      type: object
      required: [applied, sewing, ppe, toDelete, problems, warnings]
      properties:
        applied: { type: boolean }
        sewing: { $ref: '#/components/schemas/SheetImportCounts' }
        ppe: { $ref: '#/components/schemas/SheetImportCounts' }
        toDelete:
          type: array
          items: { $ref: '#/components/schemas/SheetImportDeletion' }
        problems:
          type: array
          description: Blocking; nothing is written while there is any.
          items: { $ref: '#/components/schemas/SheetImportIssue' }
        warnings:
          type: array
          description: Not blocking.
          items: { $ref: '#/components/schemas/SheetImportIssue' }
    SheetImportCounts:
      type: object
      required: [created, updated, unchanged]
      properties:
        created: { type: integer, format: int32 }
        updated: { type: integer, format: int32 }
        unchanged: { type: integer, format: int32 }
    SheetImportDeletion:
      type: object
      required: [id, type, code, name]
      properties:
        id: { type: integer, format: int32 }
        type: { type: string, enum: [Sewing, Ppe] }
        code: { type: [string, 'null'] }
        name: { type: string }
    SheetImportIssue:
      type: object
      required: [scope, rowNumber, code, message]
      properties:
        scope: { type: string, enum: [sewing, ppe] }
        rowNumber: { type: [integer, 'null'], format: int32, description: Null for a stored product that is not in the sheet. }
        code: { type: [string, 'null'] }
        message: { type: string, description: Ukrainian. }
    ProductPriceTiers:
      type: object
      required: [retail, wholesale, largeWholesale]
      properties:
        retail: { type: number }
        wholesale: { type: number }
        largeWholesale: { type: number }
