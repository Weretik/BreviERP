openapi: 3.1.0
info:
  title: 'Warehouse: fabric stock'
  version: 1.0.0
  description: 'Warehouse module (WH-001, WH-002): «Склад тканин». A stock line is one offer of «Тканини» (FAB- code) in one colour;
    lines of a reviewed alias group (FAB-023/067, FAB-078/077) and a normalised colour form one pair, which «Залишки», openings, issues
    without an order and «Уточнити» work on. Balances change only through movements (opening, receipt, issue, correction, reversal);
    each line''s chain runs by operation date, record time and id. Every stock form sends an operation id, so a repeat never moves the
    fabric twice. Everyone with access reads the stock; WorkshopChief and Admin move it; Admin alone moves the old stock.'
servers:
- url: /
security:
- Bearer: []
paths:
  /api/warehouse/fabric-stock:
    get:
      tags:
      - Production
      operationId: getFabricStock
      summary: '«Залишки»: fabrics by canonical code with every colour the stock holds; alias groups and colours summed'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockListResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
  /api/warehouse/fabric-stock/{id}:
    delete:
      tags:
      - Production
      operationId: deleteFabricStock
      summary: 'Always 410: stock lines keep their history; «Уточнити» brings a balance to zero'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '410':
          description: Stock lines are never deleted
          content:
            application/problem+json:
              schema:
                type: object
        '401':
          description: Not signed in
        '403':
          description: Not allowed
  /api/warehouse/fabric-stock/choices:
    get:
      tags:
      - Production
      operationId: getFabricStockChoices
      summary: Active offers of «Тканини» with a FAB- code, supplier names and colours for the stock forms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockChoicesResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
  /api/warehouse/fabric-stock/movements:
    get:
      tags:
      - Production
      operationId: getFabricMovements
      summary: '«Рух тканини»: 50 per page, newest operation date first (then record time and id)'
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - All
          - Receipt
          - Issue
          - Opening
          default: All
        description: Opening lists openings not taken back («Внесені початкові залишки»).
      - in: query
        name: fabricCode
        required: false
        schema:
          type: string
          maxLength: 32
        description: Any code of an alias group selects the whole group.
      - in: query
        name: color
        required: false
        schema:
          type: string
          maxLength: 80
        description: Matched by the normalised colour key.
      - in: query
        name: itemId
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricMovementPageResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid
  /api/warehouse/fabric-stock/openings:
    post:
      tags:
      - Production
      operationId: openFabricStock
      summary: '«Початковий залишок»: once per fabric and colour (any code of its group), zero allowed'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenFabricStockInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid, inactive fabric, colour not in «Кольори» or changed alias offer
        '404':
          description: No such fabric
        '409':
          description: The pair is already on the stock, or the operation id was used for other data
  /api/warehouse/fabric-stock/receipts:
    post:
      tags:
      - Production
      operationId: receiveFabric
      summary: «Прихід» of the offer picked; the supplier is a name, not a required counterparty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveFabricInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid, inactive fabric, colour not in «Кольори» or changed alias offer
        '404':
          description: No such fabric
        '409':
          description: Stale, or the operation id was used for other data
  /api/warehouse/fabric-stock/issues:
    post:
      tags:
      - Production
      operationId: issueFabric
      summary: '«Разова витрата / без замовлення»: lines spent in order, the balance may go below zero'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueFabricInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid
        '404':
          description: The stock never held this fabric and colour
        '409':
          description: Stale version, or the operation id was used for other data
  /api/warehouse/fabric-stock/adjustments:
    post:
      tags:
      - Production
      operationId: adjustFabricStock
      summary: '«Уточнити»: the counted total of a pair with a reason; it may not end below min(0, current total)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustFabricStockInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid, nothing to adjust, or it would create or deepen a negative balance
        '404':
          description: The stock never held this fabric and colour
        '409':
          description: Stale version, or the operation id was used for other data
  /api/warehouse/fabric-stock/movements/{movementId}/reverse:
    post:
      tags:
      - Production
      operationId: reverseFabricMovement
      summary: «Сторно» of an opening, receipt, correction or issue without an order
      parameters:
      - in: path
        name: movementId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseFabricMovementInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid
        '404':
          description: No such movement
        '409':
          description: Stale, already reversed, or an issue to an order
  /api/warehouse/fabric-stock/consumption:
    get:
      tags:
      - Production
      operationId: getFabricConsumption
      summary: '«Зведення витрати»: received, issued and corrected per line by operation date'
      parameters:
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricConsumptionResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid period
  /api/warehouse/fabric-stock/import:
    post:
      tags:
      - Production
      operationId: importFabricStock
      summary: Moves the stock of the old «Цех» (Admin); nothing is saved unless every row is fine
      parameters:
      - in: query
        name: dryRun
        required: false
        schema:
          type: boolean
        description: Only check and show.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FabricStockImportInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockImportResult'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid file
  /api/warehouse/orders/{id}/items/{itemId}/fabric:
    get:
      tags:
      - Production
      operationId: getProductionItemFabric
      summary: 'Tab «Тканина»: plan by colour, issues and whether the person may issue'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionItemFabricResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '404':
          description: No such order or item
  /api/warehouse/orders/{id}/items/{itemId}/fabric-issues:
    post:
      tags:
      - Production
      operationId: createFabricIssue
      summary: '«Видати»: one package of planned, replacement and additional lines'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFabricIssueInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionItemFabricResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid line
        '404':
          description: No such order, item or fabric
        '409':
          description: Stale order or stock
  /api/warehouse/orders/{id}/fabric-issues/{issueId}/reverse:
    post:
      tags:
      - Production
      operationId: reverseFabricIssue
      summary: '«Сторно видачі»: every line returns to the stock and the plan is reserved again'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: issueId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseFabricIssueInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionItemFabricResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid
        '404':
          description: No such issue
        '409':
          description: Stale or already reversed
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
  schemas:
    FabricStockPermissions:
      type: object
      required:
      - canMove
      - seesValue
      properties:
        canMove:
          type: boolean
          description: 'Openings, receipts, issues and «Уточнити»: WorkshopChief and Admin.'
        seesValue:
          type: boolean
          description: 'Prices of «Тканини» on the forms: WorkshopChief and Admin.'
    FabricStockSourceResponse:
      type: object
      required:
      - id
      - fabricCode
      - meters
      properties:
        id:
          type: integer
        fabricCode:
          type: string
        meters:
          type: number
          format: double
      description: 'A stock line inside a pair: its own code and balance.'
    FabricStockColorResponse:
      type: object
      required:
      - color
      - colorKey
      - meters
      - version
      - sources
      properties:
        color:
          type: string
        colorKey:
          type: string
          description: NFC, trimmed, spaces collapsed, lower case (uk-UA).
        meters:
          type: number
          format: double
        version:
          type: string
          description: Changes whenever any line of the pair changes; goes back with «Уточнити» and a «Разова витрата».
        sources:
          type: array
          items:
            $ref: '#/components/schemas/FabricStockSourceResponse'
      description: 'A fabric and colour on the shelf: every line of the alias group with that colour summed.'
    FabricStockFabricResponse:
      type: object
      required:
      - fabricCode
      - codes
      - fabricName
      - composition
      - density
      - meters
      - colors
      properties:
        fabricCode:
          type: string
          description: The canonical code (FAB-067 → FAB-023, FAB-077 → FAB-078).
        codes:
          type: array
          items:
            type: string
          description: Codes of «Тканини» that are this fabric, the canonical first.
        fabricName:
          type: string
        composition:
          type:
          - string
          - 'null'
        density:
          type:
          - string
          - 'null'
        meters:
          type: number
          format: double
        colors:
          type: array
          items:
            $ref: '#/components/schemas/FabricStockColorResponse'
    FabricStockListResponse:
      type: object
      required:
      - fabrics
      - meters
      - pairs
      - negative
      - permissions
      properties:
        fabrics:
          type: array
          items:
            $ref: '#/components/schemas/FabricStockFabricResponse'
        meters:
          type: number
          format: double
        pairs:
          type: integer
        negative:
          type: integer
          description: Pairs below zero.
        permissions:
          $ref: '#/components/schemas/FabricStockPermissions'
      description: '«Залишки»: only fabrics and colours that have stock lines, zero and negative included.'
    FabricMovementRowResponse:
      type: object
      required:
      - id
      - stockId
      - kind
      - operationDate
      - createdAt
      - fabricCode
      - groupCode
      - fabricName
      - color
      - supplierName
      - document
      - orderId
      - itemId
      - orderNumber
      - modelName
      - destination
      - delta
      - metersAfter
      - note
      - createdByName
      - isReversed
      - reversesMovementId
      - canReverse
      properties:
        id:
          type: integer
        stockId:
          type: integer
        kind:
          type: string
          enum:
          - Opening
          - Receipt
          - Issue
          - Adjustment
          - Reversal
        operationDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        fabricCode:
          type: string
          description: Code of the line moved.
        groupCode:
          type: string
          description: The fabric the stock shows.
        fabricName:
          type: string
        color:
          type: string
        supplierName:
          type:
          - string
          - 'null'
        document:
          type:
          - string
          - 'null'
        orderId:
          type:
          - integer
          - 'null'
        itemId:
          type:
          - integer
          - 'null'
        orderNumber:
          type:
          - integer
          - 'null'
        modelName:
          type:
          - string
          - 'null'
        destination:
          type:
          - string
          - 'null'
          description: «Куди використано» of an issue without an order.
        delta:
          type: number
          format: double
        metersAfter:
          type: number
          format: double
          description: Balance of that line after the movement.
        note:
          type:
          - string
          - 'null'
        createdByName:
          type: string
        isReversed:
          type: boolean
        reversesMovementId:
          type:
          - integer
          - 'null'
        canReverse:
          type: boolean
      description: A row of «Рух тканини».
    FabricMovementPageResponse:
      type: object
      required:
      - rows
      - page
      - hasMore
      - permissions
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/FabricMovementRowResponse'
        page:
          type: integer
        hasMore:
          type: boolean
        permissions:
          $ref: '#/components/schemas/FabricStockPermissions'
    FabricStockFabricChoice:
      type: object
      required:
      - id
      - code
      - groupCode
      - name
      - composition
      - density
      - supplier
      - price
      properties:
        id:
          type: integer
        code:
          type: string
        groupCode:
          type: string
          description: Offers with the same group code are the same fabric on the shelf.
        name:
          type: string
        composition:
          type:
          - string
          - 'null'
        density:
          type:
          - string
          - 'null'
        supplier:
          type:
          - string
          - 'null'
        price:
          type:
          - number
          - 'null'
          format: double
          description: UAH per metre; null for people who do not see prices.
      description: An active offer of «Тканини» with a FAB- code.
    FabricStockChoicesResponse:
      type: object
      required:
      - fabrics
      - suppliers
      - colors
      properties:
        fabrics:
          type: array
          items:
            $ref: '#/components/schemas/FabricStockFabricChoice'
        suppliers:
          type: array
          items:
            type: string
          description: Names of active «Постачальники» and of the suppliers of «Тканини»; empty for people who cannot move stock.
        colors:
          type: array
          items:
            type: string
            maxLength: 80
          description: Active colours of «Кольори» in list order.
    OpenFabricStockInput:
      type: object
      required:
      - operationId
      - fabricId
      - color
      - meters
      - operationDate
      properties:
        operationId:
          type: string
          format: uuid
          description: A new id per form; the same id with the same data returns the saved result, with other data 409.
        fabricId:
          type: integer
        color:
          type: string
          maxLength: 80
        meters:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: 0…1 000 000, at most two decimals.
        operationDate:
          type: string
          format: date
          description: The day the fabric really came or went, 1900-01-01…2100-12-31.
    ReceiveFabricInput:
      type: object
      required:
      - operationId
      - fabricId
      - color
      - meters
      - operationDate
      properties:
        operationId:
          type: string
          format: uuid
          description: A new id per form; the same id with the same data returns the saved result, with other data 409.
        fabricId:
          type: integer
        color:
          type: string
          maxLength: 80
        meters:
          type: number
          format: double
          exclusiveMinimum: 0
          maximum: 1000000
        operationDate:
          type: string
          format: date
          description: The day the fabric really came or went, 1900-01-01…2100-12-31.
        supplierName:
          type:
          - string
          - 'null'
          maxLength: 160
        document:
          type:
          - string
          - 'null'
          maxLength: 160
        note:
          type:
          - string
          - 'null'
          maxLength: 1000
    IssueFabricInput:
      type: object
      required:
      - operationId
      - fabricCode
      - color
      - meters
      - operationDate
      properties:
        operationId:
          type: string
          format: uuid
          description: A new id per form; the same id with the same data returns the saved result, with other data 409.
        fabricCode:
          type: string
          maxLength: 32
        color:
          type: string
          maxLength: 80
        expectedVersion:
          type:
          - string
          - 'null'
          maxLength: 64
          description: The pair version shown on the form; null skips the check.
        meters:
          type: number
          format: double
          exclusiveMinimum: 0
          maximum: 1000000
        operationDate:
          type: string
          format: date
          description: The day the fabric really came or went, 1900-01-01…2100-12-31.
        destination:
          type:
          - string
          - 'null'
          maxLength: 160
          description: «Куди використано / контрагент».
        note:
          type:
          - string
          - 'null'
          maxLength: 1000
    AdjustFabricStockInput:
      type: object
      required:
      - operationId
      - fabricCode
      - color
      - expectedVersion
      - targetMeters
      - operationDate
      - reason
      properties:
        operationId:
          type: string
          format: uuid
          description: A new id per form; the same id with the same data returns the saved result, with other data 409.
        fabricCode:
          type: string
          maxLength: 32
        color:
          type: string
          maxLength: 80
        expectedVersion:
          type: string
          maxLength: 64
        targetMeters:
          type: number
          format: double
          description: The counted total of the pair; not below min(0, current total).
        operationDate:
          type: string
          format: date
          description: The day the fabric really came or went, 1900-01-01…2100-12-31.
        reason:
          type: string
          minLength: 3
          maxLength: 500
    ReverseFabricMovementInput:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    FabricStockOperationResponse:
      type: object
      required:
      - operationId
      - fabricCode
      - color
      - meters
      - replayed
      properties:
        operationId:
          type:
          - string
          - 'null'
          format: uuid
        fabricCode:
          type: string
        color:
          type: string
        meters:
          type: number
          format: double
          description: The pair total after the operation.
        replayed:
          type: boolean
          description: The same operation id was saved before; nothing moved now.
      description: The pair after a stock operation.
    FabricPlanPartResponse:
      type: object
      required:
      - fabricCode
      - color
      - colorKey
      - planned
      - covered
      - issued
      - reserved
      - stockId
      - stockMeters
      - stockAvailable
      properties:
        fabricCode:
          type: string
        color:
          type: string
        colorKey:
          type: string
        planned:
          type: number
          description: Norm part × quantity.
        covered:
          type: number
          description: What issues covered of the part.
        issued:
          type: number
          description: Metres of planned and replacement lines for the part.
        reserved:
          type: number
          description: Still held for this item; 0 unless the order is «Нове».
        stockId:
          type:
          - integer
          - 'null'
        stockMeters:
          type: number
        stockAvailable:
          type: number
    FabricIssueLineResponse:
      type: object
      required:
      - id
      - purpose
      - planColorKey
      - plannedMeters
      - stockId
      - fabricCode
      - fabricName
      - color
      - meters
      - coveredMeters
      properties:
        id:
          type: integer
        purpose:
          type: string
          enum:
          - Planned
          - Replacement
          - Additional
        planColorKey:
          type:
          - string
          - 'null'
        plannedMeters:
          type:
          - number
          - 'null'
        stockId:
          type: integer
        fabricCode:
          type: string
        fabricName:
          type: string
        color:
          type: string
        meters:
          type: number
        coveredMeters:
          type: number
    FabricIssueResponse:
      type: object
      required:
      - id
      - issuedOn
      - note
      - createdByName
      - createdAt
      - isReversed
      - reversedAt
      - reversedByName
      - reverseReason
      - lines
      properties:
        id:
          type: integer
        issuedOn:
          type: string
          format: date
        note:
          type:
          - string
          - 'null'
        createdByName:
          type: string
        createdAt:
          type: string
          format: date-time
        isReversed:
          type: boolean
        reversedAt:
          type:
          - string
          - 'null'
          format: date-time
        reversedByName:
          type:
          - string
          - 'null'
        reverseReason:
          type:
          - string
          - 'null'
