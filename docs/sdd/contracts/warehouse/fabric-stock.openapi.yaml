openapi: 3.1.0
info:
  title: 'Warehouse: fabric stock'
  version: 1.0.0
  description: 'Warehouse module (WH-001…WH-005): «Склад тканин». A stock line is one offer of «Тканини» (FAB- code) in one colour;
    lines of a reviewed alias group (FAB-023/067, FAB-078/077) and a normalised colour form one pair, which «Залишки», openings, issues
    without an order and «Уточнити» work on. Balances change only through movements (opening, receipt, issue, correction, reversal);
    each line''s chain runs by operation date, record time and id. Every stock form sends an operation id, so a repeat never moves the
    fabric twice. Everyone with access reads the stock; WorkshopChief and Admin move it; Admin alone moves the old stock. Openings,
    receipts, corrections and issues without an order can be edited, voided («Скасувати») and restored to the state before the last
    change; every change is a revision with the values before and after. Fabric goes to an item by actual cutting: the products cut
    and the real pairs; each planned part is compared with P × n / N, the plan of an item is saved at its first issue and changes only
    by «Оновити план». Four reports read the stock and the plans without changing them: «План і факт», «Бронь і що замовити», «Вартість
    складу» and «Фурнітура до замовлення», each its own page of «Права доступу».'
servers:
- url: /
security:
- Bearer: []
paths:
  /api/warehouse/fabric-stock:
    get:
      tags:
      - Production
      operationId: getFabricStock
      summary: '«Залишки»: fabrics by canonical code with every colour the stock holds; alias groups and colours summed'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockListResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
  /api/warehouse/fabric-stock/{id}:
    delete:
      tags:
      - Production
      operationId: deleteFabricStock
      summary: 'Always 410: stock lines keep their history; «Уточнити» brings a balance to zero'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '410':
          description: Stock lines are never deleted
          content:
            application/problem+json:
              schema:
                type: object
        '401':
          description: Not signed in
        '403':
          description: Not allowed
  /api/warehouse/fabric-stock/choices:
    get:
      tags:
      - Production
      operationId: getFabricStockChoices
      summary: Active offers of «Тканини» with a FAB- code, supplier names and colours for the stock forms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockChoicesResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
  /api/warehouse/fabric-stock/movements:
    get:
      tags:
      - Production
      operationId: getFabricMovements
      summary: '«Рух тканини»: 50 per page, newest operation date first (then record time and id)'
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - All
          - Receipt
          - Issue
          - Opening
          default: All
        description: Opening lists openings not taken back («Внесені початкові залишки»).
      - in: query
        name: fabricCode
        required: false
        schema:
          type: string
          maxLength: 32
        description: Any code of an alias group selects the whole group.
      - in: query
        name: color
        required: false
        schema:
          type: string
          maxLength: 80
        description: Matched by the normalised colour key.
      - in: query
        name: itemId
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricMovementPageResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid
  /api/warehouse/fabric-stock/openings:
    post:
      tags:
      - Production
      operationId: openFabricStock
      summary: '«Початковий залишок»: once per fabric and colour (any code of its group), zero allowed'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenFabricStockInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid, inactive fabric, colour not in «Кольори» or changed alias offer
        '404':
          description: No such fabric
        '409':
          description: The pair is already on the stock, or the operation id was used for other data
  /api/warehouse/fabric-stock/receipts:
    post:
      tags:
      - Production
      operationId: receiveFabric
      summary: «Прихід» of the offer picked; the supplier is a name, not a required counterparty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveFabricInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid, inactive fabric, colour not in «Кольори» or changed alias offer
        '404':
          description: No such fabric
        '409':
          description: Stale, or the operation id was used for other data
  /api/warehouse/fabric-stock/issues:
    post:
      tags:
      - Production
      operationId: issueFabric
      summary: '«Разова витрата / без замовлення»: lines spent in order, the balance may go below zero'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueFabricInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid
        '404':
          description: The stock never held this fabric and colour
        '409':
          description: Stale version, or the operation id was used for other data
  /api/warehouse/fabric-stock/adjustments:
    post:
      tags:
      - Production
      operationId: adjustFabricStock
      summary: '«Уточнити»: the counted total of a pair with a reason; it may not end below min(0, current total)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustFabricStockInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid, nothing to adjust, or it would create or deepen a negative balance
        '404':
          description: The stock never held this fabric and colour
        '409':
          description: Stale version, or the operation id was used for other data
  /api/warehouse/fabric-stock/movements/{movementId}/reverse:
    post:
      tags:
      - Production
      operationId: reverseFabricMovement
      summary: «Сторно» of an opening, receipt, correction or issue without an order
      parameters:
      - in: path
        name: movementId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseFabricMovementInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid
        '404':
          description: No such movement
        '409':
          description: Stale, already reversed, or an issue to an order
  /api/warehouse/fabric-stock/consumption:
    get:
      tags:
      - Production
      operationId: getFabricConsumption
      summary: '«Зведення витрати»: received, issued and corrected per line by operation date'
      parameters:
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricConsumptionResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid period
  /api/warehouse/fabric-stock/transfer:
    post:
      tags:
      - Production
      operationId: transferFabricStock
      summary: «Перенесення з v133» (Admin) replaces the stock with the D1 export of the old «Цех»
      description: >-
        WH-006. The body holds the rows of nine D1 tables (camelCase columns, values as exported). Every link,
        before + change = after, the chain of every line and the issued metres are checked; truncated values are
        refused. The stock is emptied and written in one transaction, revisions are replayed, and every movement and
        line is compared with the export; any difference rolls back. A dry run rolls back too. Records entered in
        Brevi itself are removed only with confirmReplace. The same export again changes nothing.
      parameters:
      - in: query
        name: dryRun
        required: false
        schema:
          type: boolean
        description: Do everything, show the result, and roll back.
      - in: query
        name: confirmReplace
        required: false
        schema:
          type: boolean
        description: Allow removing stock lines, movements and issues entered in Brevi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockTransferInput'
      responses:
        '200':
          description: OK; applied is false on a dry run, with errors, or while a confirmation is needed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransferResult'
        '401':
          description: Not signed in
        '403':
          description: Only Admin
        '400':
          description: A table is missing or too large
  /api/warehouse/orders/{id}/items/{itemId}/fabric:
    get:
      tags:
      - Production
      operationId: getProductionItemFabric
      summary: 'Tab «Тканина»: plan by colour, issues and whether the person may issue'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionItemFabricResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '404':
          description: No such order or item
  /api/warehouse/orders/{id}/items/{itemId}/fabric-issues:
    post:
      tags:
      - Production
      operationId: createFabricIssue
      summary: «Видача» by actual cutting from the item tab; same rules as issueFabricToItem
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFabricIssueInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionItemFabricResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid, more products than the item has, a pair the stock never held, or a planned part not in the plan
        '404':
          description: No such order or item
        '409':
          description: Order closed or changed, plan changed, pair changed, or the operation id was used for other data
  /api/warehouse/orders/{id}/fabric-issues/{issueId}/reverse:
    post:
      tags:
      - Production
      operationId: reverseFabricIssue
      summary: '«Сторно видачі»: every line returns to the stock and the plan is reserved again'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: issueId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseFabricIssueInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionItemFabricResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid
        '404':
          description: No such issue
        '409':
          description: Stale or already reversed
  /api/warehouse/fabric-stock/movements/{movementId}:
    put:
      tags:
      - Production
      operationId: editFabricMovement
      summary: Edits an opening, receipt, correction or issue without an order; the chains of both lines are restated
      parameters:
      - in: path
        name: movementId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditFabricMovementInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid, wrong sign for the kind, nothing changed, or a target change of an opening or correction
        '404':
          description: No such movement, or the stock never held the target pair
        '409':
          description: Changed by someone else, voided, reversed, an issue to an order, or the operation id was used for other data
  /api/warehouse/fabric-stock/movements/{movementId}/void:
    post:
      tags:
      - Production
      operationId: voidFabricMovement
      summary: '«Скасувати»: the movement stays in the history with no effect on the balance'
      parameters:
      - in: path
        name: movementId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidFabricMovementInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid
        '404':
          description: No such movement
        '409':
          description: Changed by someone else, voided, reversed, an issue to an order, or the operation id was used for other data
  /api/warehouse/fabric-stock/movements/{movementId}/restore:
    post:
      tags:
      - Production
      operationId: restoreFabricMovement
      summary: '«Скасувати останню правку»: the state before the newest edit or void not yet taken back comes back, only while the movement
        still is what it left'
      parameters:
      - in: path
        name: movementId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreFabricMovementInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricStockOperationResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid or out of range
        '404':
          description: No such movement
        '409':
          description: Nothing to restore, changed since, or the operation id was used for other data
  /api/warehouse/fabric-stock/movements/{movementId}/revisions:
    get:
      tags:
      - Production
      operationId: getFabricMovementHistory
      summary: «Історія правок» of a movement, newest first
      parameters:
      - in: path
        name: movementId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricMovementHistoryResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '404':
          description: No such movement
  /api/warehouse/fabric-stock/issue-items:
    get:
      tags:
      - Production
      operationId: getFabricIssueItems
      summary: '«Видача на завдання»: open items found by order number (with or without «Ц-»), client, model or fabric; at most 30,
        newest first'
      parameters:
      - in: query
        name: search
        required: false
        schema:
          type:
          - string
          - 'null'
          maxLength: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricIssueItemsResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid
  /api/warehouse/fabric-stock/issue-items/{orderId}/{itemId}:
    get:
      tags:
      - Production
      operationId: getFabricIssueItem
      summary: 'The fabric card of an item: plan by part, issued, reserved, issues with plan and fact'
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: integer
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionItemFabricResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '404':
          description: No such order or item
  /api/warehouse/fabric-stock/issue-items/{orderId}/{itemId}/issues:
    post:
      tags:
      - Production
      operationId: issueFabricToItem
      summary: '«Видача» by actual cutting: products cut and the real pairs; one package per operation id'
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: integer
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFabricIssueInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionItemFabricResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '400':
          description: Invalid, more products than the item has, a pair the stock never held, or a planned part not in the plan
        '404':
          description: No such order or item
        '409':
          description: Order closed or changed, plan changed, pair changed, or the operation id was used for other data
  /api/warehouse/fabric-stock/issue-items/{orderId}/{itemId}/plan:
    post:
      tags:
      - Production
      operationId: refreshFabricItemPlan
      summary: '«Оновити план»: the saved plan of the item takes today''s norm'
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: integer
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshItemFabricPlanInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionItemFabricResponse'
        '401':
          description: Not signed in
        '403':
          description: Not allowed
        '404':
          description: No such order or item
        '409':
          description: Order closed or changed, plan changed, nothing saved yet or the norm did not change
  /api/warehouse/reports/plan-fact:
    get:
      tags:
      - Warehouse
      operationId: getFabricPlanFact
      summary: '«План і факт»: main fabric by model for items issued for all their products (access:fabric-plan-fact)'
      parameters:
      - in: query
        name: model
        required: false
        schema:
          type:
          - string
          - 'null'
          maxLength: 200
      - in: query
        name: client
        required: false
        schema:
          type:
          - string
          - 'null'
          maxLength: 200
      - in: query
        name: fabric
        required: false
        schema:
          type:
          - string
          - 'null'
          maxLength: 200
        description: A planned or issued fabric code, name or colour.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricPlanFactResponse'
        '401':
          description: Not signed in
        '403':
          description: No right to the page in «Права доступу»
        '400':
          description: A filter is too long
  /api/warehouse/reports/booking:
    get:
      tags:
      - Warehouse
      operationId: getFabricBooking
      summary: '«Бронь і що замовити»: stock handed to the plans of open orders by order date; reads only (access:fabric-booking)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricBookingResponse'
        '401':
          description: Not signed in
        '403':
          description: No right to the page in «Права доступу»
  /api/warehouse/reports/valuation:
    get:
      tags:
      - Warehouse
      operationId: getFabricValuation
      summary: '«Вартість складу»: positive balances at today''s prices of «Тканини»; owner only by default (access:fabric-valuation)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricValuationResponse'
        '401':
          description: Not signed in
        '403':
          description: No right to the page in «Права доступу»
  /api/warehouse/reports/hardware:
    get:
      tags:
      - Warehouse
      operationId: getHardwareOrder
      summary: '«Фурнітура до замовлення»: full accessory need of open orders by model composition (access:hardware-order)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareOrderResponse'
        '401':
          description: Not signed in
        '403':
          description: No right to the page in «Права доступу»
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
  schemas:
    FabricStockPermissions:
      type: object
      required:
      - canMove
      - seesValue
      - canTransfer
      properties:
        canMove:
          type: boolean
          description: 'Openings, receipts, issues and «Уточнити»: WorkshopChief and Admin.'
        seesValue:
          type: boolean
          description: 'Prices of «Тканини» on the forms: WorkshopChief and Admin.'
        canTransfer:
          type: boolean
          description: '«Перенесення з v133»: Admin only.'
    FabricStockSourceResponse:
      type: object
      required:
      - id
      - fabricCode
      - meters
      properties:
        id:
          type: integer
        fabricCode:
          type: string
        meters:
          type: number
          format: double
      description: 'A stock line inside a pair: its own code and balance.'
    FabricStockColorResponse:
      type: object
      required:
      - color
      - colorKey
      - meters
      - version
      - sources
      properties:
        color:
          type: string
        colorKey:
          type: string
          description: NFC, trimmed, spaces collapsed, lower case (uk-UA).
        meters:
          type: number
          format: double
        version:
          type: string
          description: Changes whenever any line of the pair changes; goes back with «Уточнити» and a «Разова витрата».
        sources:
          type: array
          items:
            $ref: '#/components/schemas/FabricStockSourceResponse'
      description: 'A fabric and colour on the shelf: every line of the alias group with that colour summed.'
    FabricStockFabricResponse:
      type: object
      required:
      - fabricCode
      - codes
      - fabricName
      - composition
      - density
      - meters
      - colors
      properties:
        fabricCode:
          type: string
          description: The canonical code (FAB-067 → FAB-023, FAB-077 → FAB-078).
        codes:
          type: array
          items:
            type: string
          description: Codes of «Тканини» that are this fabric, the canonical first.
        fabricName:
          type: string
