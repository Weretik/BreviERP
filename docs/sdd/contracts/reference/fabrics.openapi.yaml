openapi: 3.1.0
info:
  title: BreviERP Fabrics Reference API
  version: 1.1.0
  description: Fabric reference operations implemented by FabricsController.
servers:
  - url: /
paths:
  /api/reference/fabrics:
    get:
      operationId: getFabrics
      summary: List fabrics
      security: []
      responses:
        '200':
          description: Fabrics.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FabricRow' }
        '401': { description: Unauthorized. }
        '404': { description: No fabrics found. }
    post:
      operationId: createFabric
      summary: Create a fabric with a client supplied ID
      description: Requires access:materials. Numeric edits append an approved pricing revision when the reference is versioned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFabricRequest' }
      responses:
        '200':
          description: Created fabric ID.
          content:
            application/json:
              schema: { type: integer, format: int32, minimum: 1 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
  /api/reference/fabrics/import:
    post:
      operationId: importFabrics
      summary: Import the Calculator sheet «Тканини»
      description: >-
        Requires access:materials. The caller sends the sheet rows as JSON (one-time transfer from the Calculator sheet). A row is matched by code (FAB-…);
        an older fabric without a code is linked when its name matches (case and punctuation ignored); the rest are
        created with the next ID. Supplier names are matched like the KeepinCRM sync; an unknown one becomes a new
        manual supplier, an empty one «Не вказано». dryRun (default) returns the preview only. Otherwise nothing is
        saved when any row has an error. deactivateMissing marks fabrics that are not in the sheet as not used.
        Repeating the same file changes nothing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportFabricsRequest' }
      responses:
        '200':
          description: Preview or result; applied tells whether anything was saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceImportResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
        '409': { description: A pricing revision conflict; reload and repeat. }
  /api/reference/fabrics/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
    put:
      operationId: updateFabric
      summary: Update a fabric
      description: >-
        Requires access:materials. Numeric edits append an approved pricing revision when the reference is versioned.
        A price change sets priceUpdatedAt to today (Kyiv).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFabricRequest' }
      responses:
        '200': { description: Fabric updated. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
        '404': { description: Fabric not found. }
        '409': { description: Conflict. }
    delete:
      operationId: deleteFabric
      summary: Delete a fabric
      description: Requires access:materials. Numeric edits append an approved pricing revision when the reference is versioned.
      security:
        - bearerAuth: []
      responses:
        '200': { description: Fabric deleted. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
        '404': { description: Fabric not found. }
        '409': { description: Fabric is used by products. }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    ValidationError:
      description: Validation failures including field identifiers.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/ValidationError' }
  schemas:
    ValidationError:
      type: object
      required: [identifier, errorMessage]
      properties:
        identifier: { type: string }
        errorMessage: { type: string }
        errorCode: { type: string, nullable: true }
        severity: { type: integer }
    FabricRow:
      type: object
      required: [id, name, price, providerName, code, nameRu, composition, compositionRu, density, priceUpdatedAt, isActive, comment, proposalDescription, providerId]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        price: { type: number, minimum: 0 }
        providerName: { type: string }
        code: { type: [string, 'null'], description: Calculator sheet ID (FAB-001…); unique when set. }
        nameRu: { type: [string, 'null'] }
        composition: { type: [string, 'null'] }
        compositionRu: { type: [string, 'null'] }
        density: { type: [string, 'null'], description: 'Density, g/m².' }
        priceUpdatedAt: { type: [string, 'null'], format: date }
        isActive: { type: boolean, description: «Активна». Inactive fabrics stay for history. }
        comment: { type: [string, 'null'] }
        proposalDescription: { type: [string, 'null'], description: Short description for commercial proposals (КП). }
        providerId: { type: integer, format: int32, description: Supplier (Reference) of the fabric. }
    CreateFabricRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateFabricRequest'
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int32, minimum: 1 }
    UpdateFabricRequest:
      type: object
      required: [name, price, providerName]
      properties:
        name: { type: string, minLength: 1, maxLength: 500 }
        price: { type: number, minimum: 0, maximum: 10000 }
        providerName: { type: string, minLength: 1, maxLength: 200 }
        code: { type: [string, 'null'], maxLength: 20 }
        nameRu: { type: [string, 'null'], maxLength: 500 }
        composition: { type: [string, 'null'], maxLength: 500 }
        compositionRu: { type: [string, 'null'], maxLength: 500 }
        density: { type: [string, 'null'], maxLength: 100 }
        isActive: { type: boolean, default: true }
        comment: { type: [string, 'null'], maxLength: 1000 }
        proposalDescription: { type: [string, 'null'], maxLength: 1000 }
    ImportFabricsRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: '#/components/schemas/FabricImportRow' }
        dryRun: { type: boolean, default: true }
        deactivateMissing: { type: boolean, default: false }
    FabricImportRow:
      type: object
      required: [rowNumber, code, name, price, isActive]
      properties:
        rowNumber: { type: integer, format: int32, description: Sheet row number for the preview. }
        code: { type: string, minLength: 1 }
        name: { type: string }
        nameRu: { type: [string, 'null'] }
        supplierName: { type: [string, 'null'] }
        composition: { type: [string, 'null'] }
        compositionRu: { type: [string, 'null'] }
        density: { type: [string, 'null'] }
        price: { type: number }
        priceUpdatedAt: { type: [string, 'null'], format: date }
        isActive: { type: boolean }
        comment: { type: [string, 'null'] }
        proposalDescription: { type: [string, 'null'] }
    ReferenceImportResult:
      type: object
      required: [applied, created, updated, unchanged, errors, newSuppliers, deactivated, rows]
      properties:
        applied: { type: boolean, description: False for a preview or when a row has an error; then nothing is saved. }
        created: { type: integer, format: int32 }
        updated: { type: integer, format: int32 }
        unchanged: { type: integer, format: int32 }
        errors: { type: integer, format: int32 }
        newSuppliers: { type: array, items: { type: string } }
        deactivated: { type: array, items: { type: string } }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ReferenceImportRow' }
    ReferenceImportRow:
      type: object
      required: [rowNumber, code, name, action, changes, error]
      properties:
        rowNumber: { type: integer, format: int32 }
        code: { type: string }
        name: { type: string }
        action: { type: string, enum: [create, update, unchanged, error] }
        changes: { type: array, items: { type: string }, description: Ukrainian labels of changed fields. }
        error: { type: [string, 'null'] }
