openapi: 3.1.0
info:
  title: BreviERP Garment Accessories Reference API
  version: 1.1.0
  description: Garment accessory reference operations implemented by GarmentAccessoriesController.
servers:
  - url: /
paths:
  /api/reference/garment-accessories:
    get:
      operationId: getGarmentAccessories
      summary: List garment accessories
      security: []
      responses:
        '200':
          description: Garment accessories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GarmentAccessoryRow' }
        '401': { description: Unauthorized. }
        '404': { description: No garment accessories found. }
    post:
      operationId: createGarmentAccessory
      summary: Create a garment accessory with a client supplied ID
      description: Requires CanManageProducts. Numeric edits append an approved pricing revision when the reference is versioned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGarmentAccessoryRequest' }
      responses:
        '200':
          description: Created garment accessory ID.
          content:
            application/json:
              schema: { type: integer, format: int32, minimum: 1 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
  /api/reference/garment-accessories/import:
    post:
      operationId: importGarmentAccessories
      summary: Import the Calculator sheet «Фурнітура»
      description: >-
        Requires CanManageProducts. Same rules as importFabrics with FUR- codes. unit is one of шт., м, послуга
        («шт», «м.», «Послуга» are accepted); an unknown unit is a row error.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportGarmentAccessoriesRequest' }
      responses:
        '200':
          description: Preview or result; applied tells whether anything was saved.
          content:
            application/json:
              schema: { $ref: './fabrics.openapi.yaml#/components/schemas/ReferenceImportResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
        '409': { description: A pricing revision conflict; reload and repeat. }
  /api/reference/garment-accessories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
    put:
      operationId: updateGarmentAccessory
      summary: Update a garment accessory
      description: Requires CanManageProducts. Numeric edits append an approved pricing revision when the reference is versioned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGarmentAccessoryRequest' }
      responses:
        '200': { description: Garment accessory updated. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
        '404': { description: Garment accessory not found. }
        '409': { description: Conflict. }
    delete:
      operationId: deleteGarmentAccessory
      summary: Delete a garment accessory
      description: Requires CanManageProducts. Numeric edits append an approved pricing revision when the reference is versioned.
      security:
        - bearerAuth: []
      responses:
        '200': { description: Garment accessory deleted. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
        '404': { description: Garment accessory not found. }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    ValidationError:
      description: Validation failures including field identifiers.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/ValidationError' }
  schemas:
    ValidationError:
      type: object
      required: [identifier, errorMessage]
      properties:
        identifier: { type: string }
        errorMessage: { type: string }
        errorCode: { type: string, nullable: true }
        severity: { type: integer }
    GarmentAccessoryRow:
      type: object
      required: [id, name, price, supplierName, code, unit, priceUpdatedAt, isActive, comment]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        price: { type: number, minimum: 0 }
        supplierName: { type: string }
        code: { type: [string, 'null'], description: Calculator sheet ID (FUR-001…); unique when set. }
        unit: { type: string, enum: [шт., м, послуга] }
        priceUpdatedAt: { type: [string, 'null'], format: date }
        isActive: { type: boolean }
        comment: { type: [string, 'null'] }
    CreateGarmentAccessoryRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateGarmentAccessoryRequest'
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int32, minimum: 1 }
    UpdateGarmentAccessoryRequest:
      type: object
      required: [name, price, supplierName]
      properties:
        name: { type: string, minLength: 1, maxLength: 500 }
        price: { type: number, minimum: 0, maximum: 10000 }
        supplierName: { type: string, minLength: 1, maxLength: 200 }
        code: { type: [string, 'null'], maxLength: 20 }
        unit: { type: [string, 'null'], enum: [шт., м, послуга, null], description: Default шт. }
        isActive: { type: boolean, default: true }
        comment: { type: [string, 'null'], maxLength: 1000 }
    ImportGarmentAccessoriesRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: '#/components/schemas/GarmentAccessoryImportRow' }
        dryRun: { type: boolean, default: true }
        deactivateMissing: { type: boolean, default: false }
    GarmentAccessoryImportRow:
      type: object
      required: [rowNumber, code, name, price, isActive]
      properties:
        rowNumber: { type: integer, format: int32 }
        code: { type: string, minLength: 1 }
        name: { type: string }
        supplierName: { type: [string, 'null'] }
        price: { type: number }
        unit: { type: [string, 'null'] }
        priceUpdatedAt: { type: [string, 'null'], format: date }
        isActive: { type: boolean }
        comment: { type: [string, 'null'] }
