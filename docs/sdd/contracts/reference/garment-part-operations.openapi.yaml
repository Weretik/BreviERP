openapi: 3.1.0
info:
  title: BreviERP Garment Part Operations Reference API
  version: 1.1.0
  description: Garment part operation reference operations implemented by GarmentPartOperationsController.
servers:
  - url: /
paths:
  /api/reference/garment-part-operations:
    get:
      operationId: getGarmentPartOperations
      summary: List garment part operations
      security: []
      responses:
        '200':
          description: Garment part operations, including an empty list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GarmentPartOperationRow' }
        '401': { description: Unauthorized. }
        '404': { description: No matching resource. }
    post:
      operationId: createGarmentPartOperation
      summary: Create a garment part operation with a client supplied ID
      description: Requires CanManageProducts. The code (OP-…) is unique when given; a duplicate is a 400 on Request.Code. Numeric edits append an approved pricing revision when the reference is versioned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGarmentPartOperationRequest' }
      responses:
        '200':
          description: Created garment part operation ID.
          content:
            application/json:
              schema: { type: integer, format: int32, minimum: 1 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
        '404': { description: Garment part not found. }
  /api/reference/garment-part-operations/import:
    post:
      operationId: importGarmentPartOperations
      summary: Import the Calculator sheet «Операції»
      description: >-
        Requires CanManageProducts. The caller sends the sheet rows as JSON (one-time transfer from the Calculator
        sheet). A row is matched by code (OP-…); the rest are created with the next ID. «Група деталей» is matched by
        name (case and punctuation ignored); an unknown one becomes a new group. dryRun (default) returns the preview
        only. Otherwise nothing is saved when any row has an error. deleteMissing deletes operations that are not in
        the sheet; an operation still used by a product or price history is marked not used instead (keptInUse).
        Groups left without operations are then deleted. Repeating the same file changes nothing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportGarmentPartOperationsRequest' }
      responses:
        '200':
          description: Preview or result; applied tells whether anything was saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GarmentPartOperationImportResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
        '409': { description: A pricing revision conflict; reload and repeat. }
  /api/reference/garment-part-operations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
    put:
      operationId: updateGarmentPartOperation
      summary: Update a garment part operation
      description: Requires CanManageProducts. Numeric edits append an approved pricing revision when the reference is versioned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGarmentPartOperationRequest' }
      responses:
        '200': { description: Garment part operation updated. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
        '404': { description: Garment part operation not found. }
        '409': { description: Conflict. }
    delete:
      operationId: deleteGarmentPartOperation
      summary: Delete a garment part operation
      description: Requires CanManageProducts. Numeric edits append an approved pricing revision when the reference is versioned.
      security:
        - bearerAuth: []
      responses:
        '200': { description: Garment part operation deleted. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Unauthorized. }
        '403': { description: Product management permission required. }
        '404': { description: Garment part operation not found. }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    ValidationError:
      description: Validation failures including field identifiers.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/ValidationError' }
  schemas:
    ValidationError:
      type: object
      required: [identifier, errorMessage]
      properties:
        identifier: { type: string }
        errorMessage: { type: string }
        errorCode: { type: [string, 'null'] }
        severity: { type: integer }
    GarmentPartOperationRow:
      type: object
      required: [id, garmentPartName, name, min, code, element, variant, minutesPerProduct, isActive, notes]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        garmentPartName: { type: string, description: «Група деталей». }
        name: { type: string }
        min: { type: number, minimum: 0, description: Norm in minutes; 0 when minutesPerProduct. }
        code: { type: [string, 'null'], description: Sheet code such as OP-001. }
        element: { type: [string, 'null'], description: «Вузол / елемент». }
        variant: { type: [string, 'null'], description: «Варіант виконання». }
        minutesPerProduct: { type: boolean, description: No fixed norm; the time is entered per product. }
        isActive: { type: boolean }
        notes: { type: [string, 'null'] }
    CreateGarmentPartOperationRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateGarmentPartOperationRequest'
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int32, minimum: 1 }
    UpdateGarmentPartOperationRequest:
      type: object
      required: [garmentPartName, name, min]
      properties:
        garmentPartName: { type: string, minLength: 1, maxLength: 150 }
        name: { type: string, minLength: 1, maxLength: 255 }
        min: { type: number, minimum: 0, maximum: 10000, description: Must be above 0 unless minutesPerProduct. }
        code: { type: [string, 'null'], maxLength: 20 }
        element: { type: [string, 'null'], maxLength: 150 }
        variant: { type: [string, 'null'], maxLength: 255 }
        minutesPerProduct: { type: boolean, default: false }
        isActive: { type: boolean, default: true }
        notes: { type: [string, 'null'], maxLength: 1000 }
    ImportGarmentPartOperationsRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: '#/components/schemas/GarmentPartOperationImportRow' }
        dryRun: { type: boolean, default: true }
        deleteMissing: { type: boolean, default: false }
    GarmentPartOperationImportRow:
      type: object
      required: [rowNumber, code, groupName, name, min, minutesPerProduct, isActive]
      properties:
        rowNumber: { type: integer, format: int32, description: Sheet row number for the preview. }
        code: { type: string, minLength: 1 }
        groupName: { type: string }
        element: { type: [string, 'null'] }
        variant: { type: [string, 'null'] }
        name: { type: string }
        min: { type: number }
        minutesPerProduct: { type: boolean }
        isActive: { type: boolean }
        notes: { type: [string, 'null'] }
    GarmentPartOperationImportResult:
      type: object
      required: [applied, created, updated, unchanged, errors, newGroups, deleted, keptInUse, deletedGroups, rows]
      properties:
        applied: { type: boolean, description: False for a preview or when a row has an error; then nothing is saved. }
        created: { type: integer, format: int32 }
        updated: { type: integer, format: int32 }
        unchanged: { type: integer, format: int32 }
        errors: { type: integer, format: int32 }
        newGroups: { type: array, items: { type: string } }
        deleted: { type: array, items: { type: string } }
        keptInUse: { type: array, items: { type: string }, description: Still used; marked not used instead of deleted. }
        deletedGroups: { type: array, items: { type: string } }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ReferenceImportRow' }
    ReferenceImportRow:
      type: object
      required: [rowNumber, code, name, action, changes, error]
      properties:
        rowNumber: { type: integer, format: int32 }
        code: { type: string }
        name: { type: string }
        action: { type: string, enum: [create, update, unchanged, error] }
        changes: { type: array, items: { type: string }, description: Ukrainian labels of changed fields. }
        error: { type: [string, 'null'] }
