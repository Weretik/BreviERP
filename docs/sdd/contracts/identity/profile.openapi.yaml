openapi: 3.1.0
info: { title: BreviERP Own Profile API, version: 0.1.0 }
paths:
  /api/profile:
    get:
      operationId: getMyProfile
      summary: The signed-in staff member's profile («Мій кабінет»)
      tags: [Profile]
      security: [{ cookieAuth: [] }]
      description: Policy `OwnProfile` (Accountant, Manager, Admin; the director also holds Admin).
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileResponse' } } } }
        '401': { description: Not signed in }
        '403': { description: Not a staff account }
  /api/profile/name:
    put:
      operationId: changeMyName
      summary: Change own name
      tags: [Profile]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: './session.openapi.yaml#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangeNameRequest' } } }
      responses:
        '204': { description: Name changed }
        '400': { description: Empty or longer than 100 characters }
        '401': { description: Not signed in }
        '403': { description: Not a staff account }
  /api/profile/avatar:
    put:
      operationId: uploadMyAvatar
      summary: Upload own photo
      description: JPEG, PNG or WebP up to 2 MB, at least 128×128 px. The server crops the centre square and stores a 256×256 WebP under a new name, then deletes the previous file.
      tags: [Profile]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: './session.openapi.yaml#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/AvatarResponse' } } } }
        '400': { description: 'Not an image, too small, or too many pixels (error on field "file")' }
        '401': { description: Not signed in }
        '403': { description: Not a staff account }
        '413': { description: Larger than 2 MB }
        '503': { description: Photo storage is not configured }
    delete:
      operationId: removeMyAvatar
      summary: Remove own photo
      tags: [Profile]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: './session.openapi.yaml#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Removed (also when there was none) }
        '401': { description: Not signed in }
        '403': { description: Not a staff account }
  /api/profile/email:
    put:
      operationId: changeMyEmail
      summary: Change own email (administrators)
      description: Needs the current password; a wrong one counts towards lockout. Other sessions end; this browser stays signed in.
      tags: [Profile]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: './session.openapi.yaml#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangeOwnEmailRequest' } } }
      responses:
        '204': { description: Email changed }
        '400': { description: 'Invalid email, or wrong current password (field "currentPassword")' }
        '401': { description: Not signed in }
        '403': { description: Not an administrator }
        '409': { description: Email already used }
  /api/profile/password:
    put:
      operationId: changeMyPassword
      summary: Change own password (administrators)
      description: Needs the current password; a wrong one counts towards lockout. Other sessions end; this browser stays signed in.
      tags: [Profile]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: './session.openapi.yaml#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangeOwnPasswordRequest' } } }
      responses:
        '204': { description: Password changed }
        '400': { description: 'New password shorter than 8 characters, or wrong current password (field "currentPassword")' }
        '401': { description: Not signed in }
        '403': { description: Not an administrator }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: __Host-brevi.session }
  schemas:
    ProfileResponse:
      type: object
      required: [id, email, fullName, role, avatarUrl]
      properties:
        id: { type: integer, format: int32 }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: './users.openapi.yaml#/components/schemas/StaffRole' }
        avatarUrl: { type: [string, 'null'], format: uri }
    ChangeNameRequest:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, maxLength: 100 }
    ChangeOwnEmailRequest:
      type: object
      required: [email, currentPassword]
      properties:
        email: { type: string, format: email, maxLength: 256 }
        currentPassword: { type: string }
    ChangeOwnPasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    AvatarResponse:
      type: object
      required: [avatarUrl]
      properties:
        avatarUrl: { type: string, format: uri }
