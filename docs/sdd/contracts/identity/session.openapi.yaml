openapi: 3.1.0
info: { title: BreviERP Session API, version: 2.1.0 }
paths:
  /api/auth/cookie/login:
    post:
      operationId: loginCookieSession
      summary: Sign a browser in with the session cookie
      tags: [Session]
      security: []
      description: >-
        Admin (React). Rate-limited by the AuthLogin policy. Sets the HttpOnly session cookie
        `__Host-brevi.session` (SameSite=Lax, sliding 7 days) and the readable `brevi.csrf` cookie. No token is returned.
        Five wrong passwords lock the account for 15 minutes.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SessionLoginRequest' } } }
      responses:
        '200': { description: Signed in, headers: { Set-Cookie: { schema: { type: string }, description: Session and CSRF cookies } }, content: { application/json: { schema: { $ref: '#/components/schemas/SessionMeResponse' } } } }
        '401': { description: 'Invalid credentials, locked or blocked account' }
        '429': { description: Login rate limit exceeded }
  /api/auth/cookie/logout:
    post:
      operationId: logoutCookieSession
      summary: End the browser session
      tags: [Session]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Signed out; session and CSRF cookies expired }
        '400': { description: Missing or invalid CSRF token }
        '401': { description: No valid session }
  /api/auth/session/me:
    get:
      operationId: getCurrentSession
      summary: Get the current user
      tags: [Session]
      security: [{ cookieAuth: [] }]
      description: For a cookie session it reissues a missing CSRF cookie.
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/SessionMeResponse' } } } }
        '401': { description: Not signed in }
  /api/auth/session/access:
    get:
      operationId: getSessionAccess
      summary: What the signed-in user may do
      tags: [Session]
      security: [{ cookieAuth: [] }]
      description: Rights by page of «Права доступу» ([ACC-001](../../specs/identity/002-access-rights/README.md)); the admin hides menu items and buttons by them, the server checks the same rights.
      responses:
        '200': { description: Rights, content: { application/json: { schema: { $ref: '#/components/schemas/MyAccessResponse' } } } }
        '401': { description: Not signed in }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: __Host-brevi.session }
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Value of the `brevi.csrf` cookie. Required on every non-GET request made with the session cookie.
      schema: { type: string }
  schemas:
    SessionLoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string, format: password } }
    SessionMeResponse:
      type: object
      required: [userId, email, fullName, roles, avatarUrl]
      properties:
        userId: { type: string }
        email: { type: string, format: email }
        fullName: { type: string }
        roles: { type: array, items: { type: string, description: 'Director, Admin, Accountant, Manager, WorkshopChief, User or a role made on «Права доступу» (custom-…)' } }
        avatarUrl: { type: [string, 'null'], format: uri, description: 'Profile photo on the CDN; null shows the initial and a color' }
    AccessAction: { type: string, enum: [view, create, edit, delete] }
    AccessGrants:
      type: object
      description: Page key → allowed actions.
      additionalProperties: { type: array, items: { $ref: '#/components/schemas/AccessAction' } }
    RoleTitleResponse:
      type: object
      required: [name, title, builtIn]
      properties:
        name: { type: string }
        title: { type: string }
        builtIn: { type: boolean }
    MyAccessResponse:
      type: object
      required: [allowAll, roles, grants]
      properties:
        allowAll: { type: boolean, description: 'The director: every page and action, also pages added later' }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleTitleResponse' } }
        grants: { $ref: '#/components/schemas/AccessGrants' }
