openapi: 3.1.0
info: { title: BreviERP Staff Accounts API, version: 0.2.0 }
paths:
  /api/admin/users:
    get:
      operationId: getStaffAccounts
      summary: List staff accounts
      tags: [Users]
      security: [{ cookieAuth: [] }]
      description: Policy `CanManageUsers` (role Admin; the director also holds Admin). Customers are not listed. Each account shows its strongest role.
      responses:
        '200': { description: Staff accounts ordered by email, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StaffAccountResponse' } } } } }
        '401': { description: Not signed in }
        '403': { description: Not an administrator }
    post:
      operationId: createStaffAccount
      summary: Create a staff account
      description: There is at most one director.
      tags: [Users]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: './session.openapi.yaml#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateStaffAccountRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/StaffAccountResponse' } } } }
        '400': { description: 'Invalid email, name, role, password or phone' }
        '401': { description: Not signed in }
        '403': { description: Not an administrator }
        '409': { description: 'Email already used, or a director already exists' }
  /api/admin/users/{userId}/role:
    put:
      operationId: changeStaffRole
      summary: Change a staff account's role
      tags: [Users]
      security: [{ cookieAuth: [] }]
      description: The account's sessions pick up the new role within 5 minutes. Only the director changes their own role; an administrator gets 400. Only the director changes the director (403). There is at most one director (409).
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: './session.openapi.yaml#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { $ref: '#/components/schemas/StaffRole' } } } } }
      responses:
        '204': { description: Role changed }
        '400': { description: Invalid role or own account }
        '401': { description: Not signed in }
        '403': { description: 'Not an administrator, or the account is the director' }
        '404': { description: No staff account with this ID }
        '409': { description: A director already exists }
  /api/admin/users/{userId}/details:
    put:
      operationId: updateStaffDetails
      summary: Change a staff account's name, email and phone
      tags: [Users]
      security: [{ cookieAuth: [] }]
      description: A new email ends the account's sessions within 5 minutes. Empty phone clears it. Only the director changes the director (403).
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: './session.openapi.yaml#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStaffDetailsRequest' } } }
      responses:
        '204': { description: Changed }
        '400': { description: 'Invalid name, email or phone' }
        '401': { description: Not signed in }
        '403': { description: 'Not an administrator, or the account is the director' }
        '404': { description: No staff account with this ID }
        '409': { description: Email already used }
  /api/admin/users/{userId}/blocked:
    put:
      operationId: setStaffBlocked
      summary: Block or unblock a staff account
      tags: [Users]
      security: [{ cookieAuth: [] }]
      description: Blocking ends browser sessions within 5 minutes. Nobody blocks their own account (400). Only the director changes the director (403).
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: './session.openapi.yaml#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [blocked], properties: { blocked: { type: boolean } } } } }
      responses:
        '204': { description: Updated }
        '400': { description: Own account }
        '401': { description: Not signed in }
        '403': { description: 'Not an administrator, or the account is the director' }
        '404': { description: No staff account with this ID }
  /api/admin/users/{userId}/password:
    put:
      operationId: setStaffPassword
      summary: Set a new password for a staff account
      tags: [Users]
      security: [{ cookieAuth: [] }]
      description: Ends the account's existing sessions. Only the director changes the director's password (403).
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: './session.openapi.yaml#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string, format: password, minLength: 8, maxLength: 128 } } } } }
      responses:
        '204': { description: Password set }
        '400': { description: Password too short or too weak }
        '401': { description: Not signed in }
        '403': { description: 'Not an administrator, or the account is the director' }
        '404': { description: No staff account with this ID }
  /api/admin/users/{userId}:
    delete:
      operationId: deleteStaffAccount
      summary: Delete a staff account
      tags: [Users]
      security: [{ cookieAuth: [] }]
      description: Removes the account and its sessions for good. Nobody deletes their own account (400). Only the director deletes the director (403).
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: './session.openapi.yaml#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Deleted }
        '400': { description: Own account }
        '401': { description: Not signed in }
        '403': { description: 'Not an administrator, or the account is the director' }
        '404': { description: No staff account with this ID }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: __Host-brevi.session }
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
  schemas:
    StaffRole: { type: string, maxLength: 256, description: 'Director, Admin, Accountant, Manager, WorkshopChief, Seo or a role made on «Права доступу» (custom-…); an unknown role returns 400' }
    StaffAccountResponse:
      type: object
      required: [id, email, fullName, role, isBlocked, avatarUrl, phoneNumber]
      properties:
        id: { type: integer, format: int32 }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        isBlocked: { type: boolean }
        avatarUrl: { type: [string, 'null'], format: uri }
        phoneNumber: { type: [string, 'null'] }
    UpdateStaffDetailsRequest:
      type: object
      required: [fullName, email]
      properties:
        fullName: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 256 }
        phoneNumber: { type: [string, 'null'], maxLength: 20 }
    CreateStaffAccountRequest:
      type: object
      required: [email, fullName, role, password]
      properties:
        email: { type: string, format: email, maxLength: 256 }
        fullName: { type: string, maxLength: 256 }
        role: { $ref: '#/components/schemas/StaffRole' }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        phoneNumber: { type: string, nullable: true, maxLength: 20, description: 'Optional, 7-15 digits' }
