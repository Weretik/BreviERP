openapi: 3.1.0
info:
  title: 'Production: orders'
  version: 1.0.0
  description: 'Stages 2-3 of «Швейний цех» (PRD-002, PRD-003): «Виробничі завдання» created from sent КП, then етапи, відвантаження,
    files, status and the one Telegram message to the workshop. Manager: creates from own КП, edits own orders and their files,
    never sees the sewing rate or КП price kept for reports. WorkshopChief: sees and edits every order with the rate, without
    КП prices, ticks stages and ships. Admin (the director also holds Admin): everything, alone deletes, reopens and moves
    old orders.'
servers:
- url: /
security:
- Bearer: []
paths:
  /api/production/orders:
    get:
      tags:
      - Production
      operationId: getProductionOrders
      summary: Not deleted orders, newest number first; counts by status ignore the status filter
      parameters:
      - in: query
        name: search
        required: false
        schema:
          type: string
          maxLength: 200
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - New
          - Closed
          - Cancelled
      - in: query
        name: manager
        required: false
        schema:
          type: string
      - in: query
        name: dueTo
        required: false
        schema: &id012
          type: string
          format: date
      - in: query
        name: stage
        required: false
        schema:
          type: string
          enum: &id015
          - New
          - FabricOrdered
          - FabricAvailable
          - Cutting
          - Application
          - Sewing
          - Ready
          - Shipped
          - Complete
        description: Orders whose least advanced item is at this stage.
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderPageResponse'
        '400':
          description: Unknown status or wrong page.
        '401': &id001
          description: Unauthenticated.
        '403': &id002
          description: Manager, WorkshopChief or Admin role required (policy CanUseProductionOrders).
    post:
      tags:
      - Production
      operationId: createProductionOrder
      summary: '«Передати в цех»: an order from a sent КП; a repeat with the same requestId returns the same order'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductionOrderInput'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
        '400':
          description: Wrong fields, an item or fabric variant not in the КП, or a variant twice.
        '404':
          description: The КП is missing or not the manager’s own.
        '409':
          description: The КП is not sent or is archived.
        '401': *id001
        '403': *id002
  /api/production/orders/quote-sources:
    get:
      tags:
      - Production
      operationId: getProductionQuoteSources
      summary: 'Sent КП «під запит» the person may pass to the workshop (Manager: own; Admin: all)'
      parameters:
      - in: query
        name: search
        required: false
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          description: КП.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductionQuoteSourceResponse'
        '401': *id001
        '403': *id002
  /api/production/orders/quote-sources/{quoteId}:
    parameters:
    - in: path
      name: quoteId
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      tags:
      - Production
      operationId: getProductionQuoteDraft
      summary: 'The КП for the order form: sewn items, fabric variants, workshop norm and (not for managers) the sewing rate'
      responses:
        '200':
          description: The КП.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionQuoteDraftResponse'
        '404':
          description: КП not found or not the manager’s own.
        '409':
          description: The КП is not sent or is archived.
        '401': *id001
        '403': *id002
  /api/production/orders/import:
    post:
      tags:
      - Production
      operationId: importProductionOrders
      summary: 'Admin: move orders of the old «Цех»; with dryRun only a preview. A list with any wrong order saves nothing'
      parameters:
      - in: query
        name: dryRun
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProductionOrderImportRow'
      responses:
        '200':
          description: What was or would be moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderImportResult'
        '400':
          description: Wrong rows.
        '401': *id001
        '403': *id002
  /api/production/orders/{id}:
    parameters:
    - &id003
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      tags:
      - Production
      operationId: getProductionOrder
      summary: An order with its items; prices are hidden by role
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
        '404':
          description: Not found or deleted.
        '401': *id001
        '403': *id002
    put:
      tags:
      - Production
      operationId: updateProductionOrder
      summary: Save the header and item details; every changed field goes to «Історія змін»
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductionOrderInput'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
        '400':
          description: Wrong fields or an item not in the order.
        '404':
          description: Not found.
        '409':
          description: The order was changed since it was read.
        '401': *id001
        '403': *id002
    delete:
      tags:
      - Production
      operationId: deleteProductionOrder
      summary: 'Admin: remove the order from the lists; its history stays'
      parameters:
      - in: query
        name: version
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '204':
          description: No content.
        '404':
          description: Not found.
        '409':
          description: Stale version.
        '401': *id001
        '403': *id002
  /api/production/orders/{id}/history:
    parameters:
    - *id003
    get:
      tags:
      - Production
      operationId: getProductionOrderHistory
      summary: «Історія змін», newest first
      responses:
        '200':
          description: Changes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductionOrderChangeResponse'
        '404':
          description: Not found.
        '401': *id001
        '403': *id002
  /api/production/orders/{id}/copy:
    parameters:
    - *id003
    post:
      tags:
      - Production
      operationId: copyProductionOrder
      summary: '«Копіювати»: a new «Нове» order of the person who copies, dated today'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyProductionOrderInput'
      responses:
        '200':
          description: The copy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
        '404':
          description: Not found.
        '401': *id001
        '403': *id002
  /api/production/orders/{id}/items/{itemId}/stages:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    - in: path
      name: itemId
      required: true
      schema:
        type: integer
        minimum: 1
    put:
      tags:
      - Production
      operationId: setProductionItemStages
      summary: Tick the stages of an item; the furthest one colours the row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProductionItemStagesInput'
      responses:
        '200': &id004
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
        '400': &id005
          description: Wrong fields.
        '404': &id006
          description: The order or item is missing.
        '409': &id009
          description: The order was changed since it was read, or the change is not allowed now.
        '401': &id007
          description: Unauthenticated.
        '403': &id008
          description: Manager, WorkshopChief or Admin role required (policy CanUseProductionOrders); the person may not make
            this change.
  /api/production/orders/{id}/items/{itemId}/shipments:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    - in: path
      name: itemId
      required: true
      schema:
        type: integer
        minimum: 1
    post:
      tags:
      - Production
      operationId: createProductionShipment
      summary: «Відвантажити» part of an item; a full shipment ticks «Фактично відвантажено»
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductionShipmentInput'
      responses:
        '200': *id004
        '400': *id005
        '404': *id006
        '409':
          description: Stale version, or more than is left to ship.
        '401': *id007
        '403': *id008
  /api/production/orders/{id}/shipments/{shipmentId}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    - in: path
      name: shipmentId
      required: true
      schema:
        type: integer
        minimum: 1
    delete:
      tags:
      - Production
      operationId: cancelProductionShipment
      summary: Cancel a shipment recorded by mistake
      parameters:
      - in: query
        name: version
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200': *id004
        '400': *id005
        '404': *id006
        '409': *id009
        '401': *id007
        '403': *id008
  /api/production/orders/{id}/close:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    post:
      tags:
      - Production
      operationId: closeProductionOrder
      summary: '«Закрити»: every item is shipped in full'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderVersionInput'
      responses:
        '200': *id004
        '400': *id005
        '404': *id006
        '409': *id009
        '401': *id007
        '403': *id008
  /api/production/orders/{id}/cancel:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    post:
      tags:
      - Production
      operationId: cancelProductionOrder
      summary: «Скасувати» with a reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelProductionOrderInput'
      responses:
        '200': *id004
        '400': *id005
        '404': *id006
        '409': *id009
        '401': *id007
        '403': *id008
  /api/production/orders/{id}/reopen:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    post:
      tags:
      - Production
      operationId: reopenProductionOrder
      summary: 'Admin: «Повернути в роботу» a closed or cancelled order'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderVersionInput'
      responses:
        '200': *id004
        '400': *id005
        '404': *id006
        '409': *id009
        '401': *id007
        '403': *id008
  /api/production/orders/{id}/files:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    post:
      tags:
      - Production
      operationId: uploadProductionOrderFile
      summary: Upload a file of the order or of one item to the CDN (up to 20 MB, any type)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - kind
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum: &id020
                  - Sizes
                  - Application
                  - Extra
                  - Photo
                itemId:
                  type:
                  - integer
                  - 'null'
                  description: Empty for the whole order.
      responses:
        '200': *id004
        '400':
          description: No file, empty, too large or an unknown kind.
        '404':
          description: The order or item is missing.
        '401': *id007
        '403': *id008
  /api/production/orders/{id}/files/{fileId}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    - in: path
      name: fileId
      required: true
      schema:
        type: integer
        minimum: 1
    delete:
      tags:
      - Production
      operationId: deleteProductionOrderFile
      summary: Remove a file; a CDN file is deleted too
      responses:
        '200': *id004
        '404':
          description: The order or file is missing.
        '401': *id007
        '403': *id008
  /api/production/orders/{id}/telegram:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    post:
      tags:
      - Production
      operationId: sendProductionOrderTelegram
      summary: '«Надіслати в цех»: the one message to the workshop group; never sent twice, a failure is shown on the card
        and can be retried'
      responses:
        '200': *id004
        '404':
          description: Not found.
        '409':
          description: Already sent or being sent, or the workshop group is not set.
        '401': *id007
        '403': *id008
  /api/production/orders/progress-import:
    post:
      tags:
      - Production
      operationId: importProductionProgress
      summary: 'Admin: move stages, file links and Telegram marks of the old «Цех»; dryRun only shows them; any error saves
        nothing'
      parameters:
      - in: query
        name: dryRun
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: What changed or would change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionProgressImportResult'
        '401': *id007
        '403': *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProductionProgressImportRow'
  /api/production/settings:
    get:
      tags:
      - Production
      operationId: getWorkshopSettings
      summary: '«Налаштування цеху»: the workshop group and topic'
      responses:
        '200': &id010
          description: The settings with the groups the bot is in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkshopSettingsResponse'
        '403': &id011
          description: Only WorkshopChief or Admin manage the workshop settings.
        '401': *id007
    put:
      tags:
      - Production
      operationId: updateWorkshopSettings
      summary: Choose the group and topic, turn sending on or off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkshopSettingsInput'
      responses:
        '200': *id010
        '403': *id011
        '400':
          description: Sending on without a group.
        '401': *id007
  /api/production/settings/telegram-test:
    post:
      tags:
      - Production
      operationId: sendWorkshopTelegramTest
      summary: Send a test line to the chosen group and topic
      responses:
        '204':
          description: Sent.
        '409':
          description: No bot token or no group.
        '500':
          description: Telegram refused; the reason is in the error.
        '403': *id011
        '401': *id007
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
  schemas:
    ItemApplicationInput:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - Embroidery
          - Print
        place:
          type:
          - string
          - 'null'
          maxLength: 300
        description:
          type:
          - string
          - 'null'
          maxLength: 300
        color:
          type:
          - string
          - 'null'
          maxLength: 300
    ProductionItemDetailsInput:
      type: object
      required:
      - quantity
      - dueDate
      - mainColor
      - additionalColors
      - applications
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
        dueDate: *id012
        mainColor:
          type: string
          maxLength: 80
        additionalColors:
          type: array
          maxItems: 2
          items:
            type: string
            maxLength: 80
        sizesText:
          type:
          - string
          - 'null'
          maxLength: 4000
        technicalChanges:
          type:
          - string
          - 'null'
          maxLength: 4000
        comment:
          type:
          - string
          - 'null'
          maxLength: 4000
        applications:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ItemApplicationInput'
    CreateProductionItemInput:
      type: object
      required:
      - quoteItemId
      - quoteOptionId
      - details
      properties:
        quoteItemId: &id013
          type: integer
        quoteOptionId: *id013
        details:
          $ref: '#/components/schemas/ProductionItemDetailsInput'
    CreateProductionOrderInput:
      type: object
      required:
      - requestId
      - quoteId
      - clientName
      - orderDate
      - priceTier
      - items
      properties:
        requestId:
          type: string
          format: uuid
        quoteId: *id013
        clientName:
          type: string
          maxLength: 300
        orderDate: *id012
        comment:
          type:
          - string
          - 'null'
          maxLength: 4000
        priceTier:
          type: string
          enum:
          - Retail
          - Wholesale
          - Large
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CreateProductionItemInput'
    UpdateProductionItemInput:
      type: object
      required:
      - id
      - details
      properties:
        id: *id013
        details:
          $ref: '#/components/schemas/ProductionItemDetailsInput'
        sewingRate:
          type: &id014
          - number
          - 'null'
          description: Applied only for Admin and the head of the workshop; null clears it.
    UpdateProductionOrderInput:
      type: object
      required:
      - version
      - clientName
      - orderDate
      - items
      properties:
        version: *id013
        clientName:
          type: string
          maxLength: 300
        orderDate: *id012
        comment:
          type:
          - string
          - 'null'
          maxLength: 4000
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpdateProductionItemInput'
    CopyProductionOrderInput:
      type: object
      required:
      - requestId
      properties:
        requestId:
          type: string
          format: uuid
    ProductionItemImportRow:
      type: object
      required:
      - modelName
      - details
      properties:
        modelCode:
          type:
          - string
          - 'null'
          maxLength: 32
        modelName:
          type: string
          maxLength: 300
        fabricCode:
          type:
          - string
          - 'null'
          maxLength: 32
        fabricName:
          type:
          - string
          - 'null'
          maxLength: 300
        sewingRate: &id016
          type: *id014
        details:
          $ref: '#/components/schemas/ProductionItemDetailsInput'
    ProductionOrderImportRow:
      type: object
      required:
      - legacyId
      - number
      - clientName
      - managerName
      - status
      - orderDate
      - items
      properties:
        legacyId:
          type: string
          maxLength: 64
        number: *id013
        quoteNumber:
          type:
          - string
          - 'null'
          maxLength: 40
        clientName:
          type: string
          maxLength: 300
        managerEmail:
          type:
          - string
          - 'null'
        managerName:
          type: string
          maxLength: 200
        status:
          type: string
          enum:
          - New
          - Closed
          - Cancelled
        orderDate: *id012
        comment:
          type:
          - string
          - 'null'
          maxLength: 4000
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductionItemImportRow'
    ProductionOrderSummaryResponse:
      type: object
      required:
      - id
      - number
      - status
      - clientName
      - quoteId
      - quoteNumber
      - managerName
      - orderDate
      - itemsCount
      - totalQuantity
      - nearestDueDate
      - isTransferred
      - updatedAt
      - stage
      properties:
        id: *id013
        number: *id013
        status:
          type: string
          enum:
          - New
          - Closed
          - Cancelled
        clientName:
          type: string
        quoteId: &id017
          type:
          - integer
          - 'null'
        quoteNumber:
          type:
          - string
          - 'null'
        managerName:
          type: string
        orderDate: *id012
        itemsCount: *id013
        totalQuantity: *id013
        nearestDueDate:
          type:
          - string
          - 'null'
          format: date
        isTransferred:
          type: boolean
        updatedAt: &id018
          type: string
          format: date-time
        stage:
          type: string
          enum: *id015
          description: 'The least advanced item stage: the order is only as far as its slowest item.'
    ProductionOrderCounts:
      type: object
      required:
      - all
      - new
      - closed
      - cancelled
      properties:
        all: *id013
        new: *id013
        closed: *id013
        cancelled: *id013
    ProductionOrderPageResponse:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      - counts
      - managers
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductionOrderSummaryResponse'
        page: *id013
        pageSize: *id013
        total: *id013
        counts:
          $ref: '#/components/schemas/ProductionOrderCounts'
        managers:
          type: array
          items:
            type: string
    ProductionOrderPermissions:
      type: object
      required:
      - canEdit
      - canCopy
      - canDelete
      - seesSewingRate
      - seesReportPrice
      - canTrack
      - canClose
      - canCancel
      - canReopen
      - canManageFiles
      - canSendTelegram
      properties:
        canEdit:
          type: boolean
        canCopy:
          type: boolean
        canDelete:
          type: boolean
        seesSewingRate:
          type: boolean
        seesReportPrice:
          type: boolean
        canTrack:
          type: boolean
          description: 'Tick stages and ship: WorkshopChief and Admin on a «Нове» order.'
        canClose:
          type: boolean
          description: '«Закрити»: everything is shipped.'
        canCancel:
          type: boolean
          description: «Скасувати» with a reason.
        canReopen:
          type: boolean
          description: '«Повернути в роботу»: Admin on a closed or cancelled order.'
        canManageFiles:
          type: boolean
          description: Add and delete files.
        canSendTelegram:
          type: boolean
          description: '«Надіслати в цех»: not sent yet and the group is set.'
    ItemApplicationResponse:
      type: object
      required:
      - kind
      - place
      - description
      - color
      properties:
        kind:
          type: string
          enum:
          - Embroidery
          - Print
        place:
          type:
          - string
