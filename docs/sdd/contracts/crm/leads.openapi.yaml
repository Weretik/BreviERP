openapi: 3.1.0
info:
  title: BreviERP CRM Leads API
  version: 1.0.0
  description: >-
    Leads of the «Менеджер сервісу» block (LEAD-001): companies an AI writes into the Google sheet «Лиды Brevi», synced
    every weekday morning. Managers take free leads on «Усі ліди», call them on «Мій день» and record results; a result
    with a next contact makes a «Подзвонити» task in «Мої завдання». «Адміністрування › Ліди» has the statistics
    («Зведення»), the references («Довідники») and «Синхронізувати зараз».
servers:
  - url: /
paths:
  /api/crm/leads:
    get:
      operationId: getCrmLeads
      security:
        - bearerAuth: []
      description: >-
        Requires access:leads (view). A page of «Усі ліди»: leads still in the sheet first, newest added first.
        Search matches the number, company, region, industry, contacts and owner. Chip counts follow search, category
        and stage but not the scope.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: scope
          in: query
          schema: { $ref: "#/components/schemas/CrmLeadScope" }
        - name: category
          in: query
          schema: { type: string, maxLength: 10 }
        - name: stage
          in: query
          description: A stage, or `Open` for every stage still in work.
          schema: { type: string, enum: [Open, New, InWork, Talking, Offer, Client, Closed] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLeadPage" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: No right to the page. }
  /api/crm/leads/my-day:
    get:
      operationId: getCrmLeadsMyDay
      security:
        - bearerAuth: []
      description: >-
        Requires access:leads (view). «Мій день» of the signed-in user: own open leads due by the end of the Kyiv
        day or never called (overdue and today first, then new by category), and the next 50 planned later.
      responses:
        "200":
          description: The day.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLeadMyDay" }
        "401": { description: Authentication required. }
        "403": { description: No right to the page. }
  /api/crm/leads/call-results:
    get:
      operationId: getCrmLeadCallResults
      security:
        - bearerAuth: []
      description: 'Requires access:leads (view). The active call result buttons, in order.'
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CrmLeadCallResult" }
        "401": { description: Authentication required. }
        "403": { description: No right to the page. }
  /api/crm/leads/{id}:
    parameters:
      - $ref: "#/components/parameters/LeadId"
    get:
      operationId: getCrmLead
      security:
        - bearerAuth: []
      description: 'Requires access:leads (view). The card of a lead with its calls, newest first.'
      responses:
        "200":
          description: The lead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLead" }
        "401": { description: Authentication required. }
        "403": { description: No right to the page. }
        "404": { description: Not found. }
  /api/crm/leads/{id}/take:
    parameters:
      - $ref: "#/components/parameters/LeadId"
    post:
      operationId: takeCrmLead
      security:
        - bearerAuth: []
      description: >-
        Requires access:leads (edit). «Взяти собі»: a free open lead becomes the actor's; taking an own lead again
        changes nothing.
      responses:
        "200":
          description: The lead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLead" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: No right to the page. }
        "404": { description: Not found. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/leads/{id}/release:
    parameters:
      - $ref: "#/components/parameters/LeadId"
    post:
      operationId: releaseCrmLead
      security:
        - bearerAuth: []
      description: >-
        Requires access:leads (edit). «Повернути у вільні»: the owner, or Director/Admin for anybody's lead. The
        next contact is cleared and the open «Подзвонити» task is deleted.
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The lead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLead" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: "No right to the page, or somebody else's lead for a manager." }
        "404": { description: Not found. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/leads/{id}/calls:
    parameters:
      - $ref: "#/components/parameters/LeadId"
    post:
      operationId: recordCrmLeadCall
      security:
        - bearerAuth: []
      description: >-
        Requires access:leads (edit). Records a call by the owner (a free lead is taken first). The lead moves to the
        result's stage; its open «Подзвонити» task is done; a next contact makes a new task for the actor. A retry
        without a date is planned the result's `retryDays` later; callback, talking and offer need a date; client and
        closed results end the work and ignore the date.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmRecordLeadCallInput" }
      responses:
        "200":
          description: The lead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLead" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: "No right to the page, or the lead is somebody else's." }
        "404": { description: Not found. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/lead-stats:
    get:
      operationId: getCrmLeadStats
      security:
        - bearerAuth: []
      description: >-
        Requires access:lead-stats (view). «Зведення» for a period of Kyiv dates (both included; default the last 7
        days): totals now, calls and new leads in the period, a row per manager, call results, industries by category,
        and the last sync.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: The statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLeadStats" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: No right to the page. }
  /api/crm/lead-stats/call-results:
    get:
      operationId: getCrmLeadStatsCallResults
      security:
        - bearerAuth: []
      description: 'Requires access:lead-stats (view). Every call result, switched-off ones included, in order.'
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CrmLeadCallResult" }
        "401": { description: Authentication required. }
        "403": { description: No right to the page. }
    post:
      operationId: createCrmLeadCallResult
      security:
        - bearerAuth: []
      description: 'Requires access:lead-stats (edit). Adds a call result (at most 30).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSaveLeadCallResultInput" }
      responses:
        "201":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLeadCallResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: No right to change the references. }
  /api/crm/lead-stats/call-results/{id}:
    parameters:
      - $ref: "#/components/parameters/LeadId"
    put:
      operationId: editCrmLeadCallResult
      security:
        - bearerAuth: []
      description: >-
        Requires access:lead-stats (edit). Changes a result. Results are never deleted, only switched off; recorded
        calls keep the old name.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSaveLeadCallResultInput" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLeadCallResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: No right to change the references. }
        "404": { description: Not found. }
  /api/crm/lead-stats/categories:
    get:
      operationId: getCrmLeadCategories
      security:
        - bearerAuth: []
      description: >-
        Requires access:lead-stats (view). Category codes met in the sheet with their description and the number of
        leads.
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CrmLeadCategory" }
        "401": { description: Authentication required. }
        "403": { description: No right to the page. }
  /api/crm/lead-stats/categories/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string, maxLength: 10 }
    put:
      operationId: editCrmLeadCategory
      security:
        - bearerAuth: []
      description: 'Requires access:lead-stats (edit). Writes what a category means.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSaveLeadCategoryInput" }
      responses:
        "200":
          description: The category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLeadCategory" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: No right to change the references. }
        "404": { description: Not found. }
  /api/crm/lead-stats/sync:
    post:
      operationId: syncCrmLeads
      security:
        - bearerAuth: []
      description: >-
        Requires access:lead-stats (create). «Синхронізувати зараз»: reads the sheet and applies it in one
        transaction, the same run as the weekday 09:00 job. Rows are matched by «ID»; the calling work is never touched;
        rows missing from the sheet only get `inSheet: false`.
      responses:
        "200":
          description: What changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLeadSync" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: No right to sync. }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: The sheet has an unexpected shape (no tab with the saved id, too many rows); nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLeadSyncFailure" }
        "503":
          description: Google cannot be read now (access, network); nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmLeadSyncFailure" }
components:
  parameters:
    LeadId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    Invalid:
      description: Validation errors with Ukrainian messages for the Admin.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                identifier: { type: [string, "null"] }
                errorMessage: { type: string }
    Conflict:
      description: >-
        Somebody else took the lead first, the lead was saved in another window (stale version), or a sync is running;
        errors are Ukrainian strings.
      content:
        application/json:
          schema:
            type: array
            items: { type: string }
  schemas:
    CrmLeadScope:
      type: string
      enum: [All, Mine, Free]
    CrmLeadStage:
      type: string
      enum: [New, InWork, Talking, Offer, Client, Closed]
    CrmLeadOutcome:
      type: string
      description: >-
        What a result does: `Retry` plans the next try, `Callback`, `Talking` and `Offer` need a next contact, `Client`
        and `Closed` end the work.
      enum: [Retry, Callback, Talking, Offer, Client, Closed]
    CrmLeadPerson:
      type: object
      required: [userId, name]
      properties:
        userId: { type: integer }
        name: { type: string }
    CrmLeadSummary:
      type: object
      required:
        [id, sourceId, company, category, region, industry, callReason, stage, owner, lastResultName, lastCallAt,
         nextContactAt, isOverdue, callCount, addedOn, inSheet, version]
      properties:
        id: { type: integer, format: int64 }
        sourceId: { type: integer, description: "The «ID» column of the sheet; not unique, leads match by company name." }
        company: { type: string }
        category: { type: [string, "null"] }
        region: { type: [string, "null"] }
        industry: { type: [string, "null"] }
        callReason: { type: [string, "null"] }
        stage: { $ref: "#/components/schemas/CrmLeadStage" }
        owner:
          oneOf:
            - { $ref: "#/components/schemas/CrmLeadPerson" }
            - { type: "null" }
        lastResultName: { type: [string, "null"] }
        lastCallAt: { type: [string, "null"], format: date-time }
        nextContactAt: { type: [string, "null"], format: date-time }
        isOverdue: { type: boolean }
        callCount: { type: integer }
        addedOn: { type: [string, "null"], format: date }
        inSheet: { type: boolean }
        version: { type: integer }
    CrmLeadPage:
      type: object
      required: [items, page, pageSize, total, mine, free, all]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CrmLeadSummary" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        mine: { type: integer }
        free: { type: integer, description: Open leads nobody took. }
        all: { type: integer }
    CrmLeadCall:
      type: object
      required: [id, by, at, resultId, resultName, outcome, comment, nextContactAt]
      properties:
        id: { type: integer, format: int64 }
        by: { $ref: "#/components/schemas/CrmLeadPerson" }
        at: { type: string, format: date-time }
        resultId: { type: integer, format: int64 }
        resultName: { type: string }
        outcome: { $ref: "#/components/schemas/CrmLeadOutcome" }
        comment: { type: [string, "null"] }
        nextContactAt: { type: [string, "null"], format: date-time }
    CrmLead:
      type: object
      required:
        [id, sourceId, company, category, categoryDescription, addedOn, region, industry, scale, signal, signalDate,
         factOrPlan, signalUrl, volumeReason, offer, website, contacts, whomToCall, tenderCheck, callReason, reliability,
         email, sheetNotes, inSheet, stage, owner, takenAt, lastResultName, lastCallAt, nextContactAt, isOverdue,
         callCount, openTaskId, calls, version]
      properties:
        id: { type: integer, format: int64 }
        sourceId: { type: integer }
        company: { type: string }
        category: { type: [string, "null"] }
        categoryDescription: { type: [string, "null"] }
        addedOn: { type: [string, "null"], format: date }
        region: { type: [string, "null"] }
        industry: { type: [string, "null"] }
        scale: { type: [string, "null"] }
        signal: { type: [string, "null"] }
        signalDate: { type: [string, "null"], format: date }
        factOrPlan: { type: [string, "null"] }
        signalUrl: { type: [string, "null"] }
        volumeReason: { type: [string, "null"], description: «Почему возможны 50+ единиц». }
        offer: { type: [string, "null"] }
        website: { type: [string, "null"] }
        contacts: { type: [string, "null"], description: «Открытый контакт» as written (phones and emails). }
        whomToCall: { type: [string, "null"] }
        tenderCheck: { type: [string, "null"] }
        callReason: { type: [string, "null"] }
        reliability: { type: [string, "null"] }
        email: { type: [string, "null"] }
        sheetNotes:
          type: [string, "null"]
          description: The manager columns of the sheet at the first sync, one line per sheet column, its name first.
        inSheet: { type: boolean }
        stage: { $ref: "#/components/schemas/CrmLeadStage" }
        owner:
          oneOf:
            - { $ref: "#/components/schemas/CrmLeadPerson" }
            - { type: "null" }
        takenAt: { type: [string, "null"], format: date-time }
        lastResultName: { type: [string, "null"] }
        lastCallAt: { type: [string, "null"], format: date-time }
        nextContactAt: { type: [string, "null"], format: date-time }
        isOverdue: { type: boolean }
        callCount: { type: integer }
        openTaskId:
          type: [integer, "null"]
          format: int64
          description: The open «Подзвонити» task in «Мої завдання».
        calls:
          type: array
          items: { $ref: "#/components/schemas/CrmLeadCall" }
        version: { type: integer }
    CrmLeadMyDay:
      type: object
      required: [queue, later, callsToday, plannedToday, free]
      properties:
        queue:
          type: array
          items: { $ref: "#/components/schemas/CrmLeadSummary" }
        later:
          type: array
          items: { $ref: "#/components/schemas/CrmLeadSummary" }
        callsToday: { type: integer, description: Calls the user recorded since the start of the Kyiv day. }
        plannedToday: { type: integer, description: Calls today plus the queue. }
        free: { type: integer, description: Open leads nobody took. }
    CrmLeadCallResult:
      type: object
      required: [id, name, outcome, retryDays, isActive, position]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        outcome: { $ref: "#/components/schemas/CrmLeadOutcome" }
        retryDays: { type: [integer, "null"], description: Only for `Retry`. }
        isActive: { type: boolean }
        position: { type: integer }
    CrmLeadCategory:
      type: object
      required: [code, description, leads]
      properties:
        code: { type: string }
        description: { type: [string, "null"] }
        leads: { type: integer }
    CrmLeadSyncFailure:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          description: Ukrainian messages for the Admin, also saved as the last sync error.
          items: { type: string }
    CrmLeadSync:
      type: object
      required: [rows, added, updated, gone, skipped, at, duplicates, assigned, calls, warning]
      properties:
        rows: { type: integer }
        added: { type: integer }
        updated: { type: integer }
        gone: { type: integer, description: Leads that disappeared from the sheet in this run. }
        skipped: { type: integer, description: Rows with text but without a whole-number ID or a company. }
        at: { type: string, format: date-time }
        duplicates: { type: integer, description: "Rows left out because their company is already on an earlier row (rows match by company name, not ID)." }
        assigned: { type: integer, description: "Free leads taken for the Brevi manager named in «Кто взял в работу»." }
        calls: { type: integer, description: "Calls brought into the history from a new «Результат звонка» of the sheet." }
        warning: { type: [string, "null"], description: "Which rows were left out or which sheet owners or call results are unknown; null when none." }
    CrmLeadSyncState:
      type: object
      required: [lastRunAt, lastSuccessAt, rows, added, updated, error, warning]
      properties:
        lastRunAt: { type: [string, "null"], format: date-time }
        lastSuccessAt: { type: [string, "null"], format: date-time }
        rows: { type: integer }
        added: { type: integer }
        updated: { type: integer }
        error: { type: [string, "null"], description: Why the last run failed; null after a success. }
        warning: { type: [string, "null"], description: "What the last successful run left out (repeated companies, sheet owners without a manager); null when nothing." }
    CrmLeadManagerStats:
      type: object
      required: [manager, inWork, calls, reachedPercent, offers, clients, overdue]
      properties:
        manager: { $ref: "#/components/schemas/CrmLeadPerson" }
        inWork: { type: integer, description: Own open leads now. }
        calls: { type: integer }
        reachedPercent:
          type: [integer, "null"]
          description: Calls whose result is not a retry, of all calls in the period; null without calls.
        offers: { type: integer }
        clients: { type: integer }
        overdue: { type: integer, description: Own open leads whose next contact has passed (now). }
    CrmLeadCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    CrmLeadIndustryStats:
      type: object
      required: [industry, categories, total]
      properties:
        industry: { type: string }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CrmLeadCount" }
        total: { type: integer }
    CrmLeadStats:
      type: object
      required:
        [from, to, total, free, inWork, offer, clients, closed, overdue, callsInPeriod, addedInPeriod, managers, results,
         industries, categories, sync]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        total: { type: integer }
        free: { type: integer }
        inWork: { type: integer }
        offer: { type: integer }
        clients: { type: integer }
        closed: { type: integer }
        overdue: { type: integer }
        callsInPeriod: { type: integer }
        addedInPeriod: { type: integer }
        managers:
          type: array
          items: { $ref: "#/components/schemas/CrmLeadManagerStats" }
        results:
          type: array
          items: { $ref: "#/components/schemas/CrmLeadCount" }
        industries:
          type: array
          description: Up to 20 industries with the most leads.
          items: { $ref: "#/components/schemas/CrmLeadIndustryStats" }
        categories:
          type: array
          description: Every category code met, «—» for none.
          items: { type: string }
        sync:
          oneOf:
            - { $ref: "#/components/schemas/CrmLeadSyncState" }
            - { type: "null" }
    CrmRecordLeadCallInput:
      type: object
      required: [resultId, version]
      properties:
        resultId: { type: integer, format: int64, minimum: 1 }
        comment: { type: [string, "null"], maxLength: 2000 }
        nextContactAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
    CrmSaveLeadCallResultInput:
      type: object
      required: [name, outcome, isActive, position]
      properties:
        name: { type: string, maxLength: 60 }
        outcome: { $ref: "#/components/schemas/CrmLeadOutcome" }
        retryDays: { type: [integer, "null"], minimum: 1, maximum: 60 }
        isActive: { type: boolean }
        position: { type: integer, minimum: 0, maximum: 1000 }
    CrmSaveLeadCategoryInput:
      type: object
      properties:
        description: { type: [string, "null"], maxLength: 200 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
