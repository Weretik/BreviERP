openapi: 3.1.0
info:
  title: BreviERP CRM Quotes (КП) API
  version: 1.0.0
  description: >-
    КП of the «Менеджер сервісу» block (QTE-001, stages 1–4). Admin or Manager session; a Manager sees and changes only КП
    they are responsible for, Admin (the Director also holds Admin) sees all. Catalog prices are never taken from the
    client: a new row gets them from the Catalog, a saved row keeps its own until an explicit reprice.
servers:
  - url: /
paths:
  /api/crm/quotes:
    get:
      operationId: getCrmQuotes
      security:
        - bearerAuth: []
      description: КП the actor may see, newest change first.
      parameters:
        - name: search
          in: query
          description: Number, client or request name, company or recipient; case-insensitive.
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CrmQuoteStatus" }
        - name: responsibleUserId
          in: query
          description: Admin only; ignored for a Manager.
          schema: { type: integer, minimum: 1 }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1, maximum: 100000 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
        - name: archived
          in: query
          description: True lists only «Архів», false (default) only КП in work.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuotePage" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role and a numeric actor claim required. }
    post:
      operationId: createCrmQuote
      security:
        - bearerAuth: []
      description: Creates a draft «КП під запит»; the creator becomes responsible. The number is «n-month-year», counted per Kyiv month.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSaveQuoteInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuote" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/quotes/{id}:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    get:
      operationId: getCrmQuote
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The КП with items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuote" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "404": { description: Not found or not visible to the actor. }
    put:
      operationId: saveCrmQuote
      security:
        - bearerAuth: []
      description: Saves the whole editor content. Saved rows keep their prices; only the shown flags and PPE manual prices change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSaveQuoteInput" }
      responses:
        "200":
          description: Saved; Version is incremented and item/option ids are new.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuote" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "404": { description: Not found or not visible to the actor. }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteCrmQuote
      security:
        - bearerAuth: []
      description: Deletes a draft.
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "404": { description: Not found or not visible to the actor. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/quotes/{id}/reprice:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    post:
      operationId: repriceCrmQuote
      security:
        - bearerAuth: []
      description: >-
        «Перерахувати за актуальними цінами». apply=false only lists the changes; apply=true replaces the Catalog
        prices of the listed rows. Manual PPE prices stay; rows the Catalog cannot price are listed in unavailable and
        keep their prices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, apply]
              properties:
                version: { type: integer, minimum: 1 }
                apply: { type: boolean }
      responses:
        "200":
          description: Report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteRepriceReport" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "404": { description: Not found or not visible to the actor. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/quotes/{id}/responsible:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    put:
      operationId: setCrmQuoteResponsible
      security:
        - bearerAuth: []
      description: Admin (Director) gives the КП to themselves or another active manager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, userId]
              properties:
                version: { type: integer, minimum: 1 }
                userId: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuote" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin role required. }
        "404": { description: Not found. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/quotes/{id}/history:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    get:
      operationId: getCrmQuoteHistory
      security:
        - bearerAuth: []
      description: >-
        «Історія змін»: who created, saved, sent, repriced, passed, archived, restored or copied the КП; newest first,
        at most 500 lines.
      responses:
        "200":
          description: History lines.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CrmQuoteEvent" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role and a numeric actor claim required. }
        "404": { description: Not found or not the actor's КП. }
  /api/crm/quotes/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    post:
      operationId: archiveCrmQuote
      security:
        - bearerAuth: []
      description: >-
        «В архів»: the КП of any status leaves the working list. Save, send, reprice and passing it to another manager
        return 409 until it is restored; it can still be opened, printed, copied and deleted (a draft).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmQuoteVersionRequest" }
      responses:
        "200":
          description: Archived; the version grows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuote" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role and a numeric actor claim required. }
        "404": { description: Not found. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/quotes/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    post:
      operationId: restoreCrmQuote
      security:
        - bearerAuth: []
      description: «Повернути з архіву»; the version grows.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmQuoteVersionRequest" }
      responses:
        "200":
          description: Back in work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuote" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role and a numeric actor claim required. }
        "404": { description: Not found. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/quotes/{id}/copy:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    post:
      operationId: copyCrmQuote
      security:
        - bearerAuth: []
      description: >-
        «Копіювати»: a new draft with the next number, the same header, introduction and items with their saved
        prices. The actor becomes its author and responsible. An archived КП can be copied.
      responses:
        "201":
          description: The new КП.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuote" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role and a numeric actor claim required. }
        "404": { description: Not found. }
  /api/crm/quotes/{id}/pdf:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    get:
      operationId: getCrmQuotePdf
      security:
        - bearerAuth: []
      description: «Сформувати КП». The PDF of the saved КП with the current settings; only shown items, variants and prices, client texts, the responsible manager's КП contact and the requisites (R-14).
      responses:
        "200":
          description: PDF file, `Content-Disposition` attachment named «КП <number>.pdf»; not cached.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "404": { description: Not found or not visible to the actor. }
  /api/crm/quotes/{id}/send-draft:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    get:
      operationId: getCrmQuoteSendDraft
      security:
        - bearerAuth: []
      description: >-
        «Надіслати КП» (R-15): the signed-in person's connected Gmail (null until connected), whether Gmail is configured
        on the server, the PDF file name, and the letters (template from the settings first, then the letter variants)
        with {quoteNumber}, {managerName}, {managerPhone}, {managerEmail}, {site} filled with the sender's КП contact.
      responses:
        "200":
          description: Draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteSendDraft" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "404": { description: Not found or not visible to the actor. }
  /api/crm/quotes/{id}/send:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    post:
      operationId: sendCrmQuote
      security:
        - bearerAuth: []
      description: >-
        Sends the PDF of the saved КП of exactly `version` from the signed-in person's Gmail. On success the КП becomes
        Sent with `lastSentAt` and its version grows; it can be edited and sent again. Any failure (no Gmail, Gmail
        refused, stale version) leaves the КП as it was and returns 409 with the reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSendQuoteInput" }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuote" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "404": { description: Not found or not visible to the actor. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/mailboxes/{userId}/connect:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: connectCrmMailbox
      security:
        - bearerAuth: []
      description: >-
        «Підключити Gmail»: the Google consent address (openid, email and gmail.send only). Admin (Director) for any
        staff member, a Manager only for themselves. The Admin opens it in the same tab; Google returns to
        `google-callback`, which redirects to `returnPath` with `gmail=connected` or `gmail=error&reason=…`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [returnPath]
              properties:
                returnPath: { type: string, maxLength: 200, description: "An Admin path under /crm/." }
      responses:
        "200":
          description: Consent address.
          content:
            application/json:
              schema:
                type: object
                required: [consentUrl]
                properties:
                  consentUrl: { type: string, format: uri }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Only for yourself unless Admin. }
        "404": { description: Staff member not found or blocked. }
        "409": { description: "Gmail is not configured on the server; errors are Ukrainian strings." }
  /api/crm/mailboxes/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      operationId: disconnectCrmMailbox
      security:
        - bearerAuth: []
      description: Forgets the connected Gmail (Admin for anyone, a Manager for themselves).
      responses:
        "204": { description: Disconnected or was not connected. }
        "401": { description: Authentication required. }
        "403": { description: Only for yourself unless Admin. }
  /api/crm/mailboxes/google-callback:
    get:
      operationId: crmMailboxGoogleCallback
      description: >-
        Google OAuth callback, anonymous; the signed state carries the staff member. Stores the Gmail address and the
        encrypted refresh token, then redirects to the Admin. Not called by the Admin code.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Back to the Admin with gmail=connected or gmail=error&reason=expired|denied|google|twice. }
  /api/crm/quote-import:
    post:
      operationId: importCrmQuotes
      security:
        - bearerAuth: []
      description: >-
        One-time transfer of КП from the old calculator (R-25). dryRun=true only returns the report. Otherwise every new
        КП is saved in one transaction with its calculator number, people, dates, status, prices and history plus an
        «Imported» line. A КП transferred before is skipped, so the same file can be sent again; a number a new Brevi
        КП already has gets the next free number of that month. Items are linked to the Catalog and Reference by code;
        what cannot be linked is transferred as it is and named in warnings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmImportQuotesInput" }
      responses:
        "200":
          description: Report; applied is true when the КП were saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteImportReport" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin role and a numeric actor claim required (the Director also holds Admin). }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/quote-settings:
    get:
      operationId: getCrmQuoteSettings
      security:
        - bearerAuth: []
      description: «Налаштування КП» (R-13). Before the first save returns the defaults with version 0. Has a contact row for every active staff member; an unsaved contact shows the account name, phone and email.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteSettings" }
        "401": { description: Authentication required. }
        "403": { description: Admin role required (the Director also holds it). }
    put:
      operationId: saveCrmQuoteSettings
      security:
        - bearerAuth: []
      description: Saves the whole page with the version that was loaded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSaveQuoteSettingsInput" }
      responses:
        "200":
          description: Saved; version is incremented.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteSettings" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin role required (the Director also holds it). }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/quote-introductions:
    post:
      operationId: createCrmQuoteIntroduction
      security:
        - bearerAuth: []
      description: >-
        Creates a draft «КП для знайомства» (R-16): one page per season of the layout, the main model of the season
        first, then 3 more models of that season, one fabric each. Only the від 41 шт. price is shown; it comes from the
        Catalog. It is read, listed, sent and deleted through /api/crm/quotes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSaveQuoteIntroductionInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuote" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/quote-introductions/{id}:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    put:
      operationId: saveCrmQuoteIntroduction
      security:
        - bearerAuth: []
      description: Saves the whole introduction; a saved model keeps its price. 409 for a stale version or a КП «під запит».
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSaveQuoteIntroductionInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuote" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "404": { description: Not found or not visible to the actor. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/quote-intro-templates:
    get:
      operationId: getCrmQuoteIntroTemplates
      security:
        - bearerAuth: []
      description: «Готові шаблони», shared by all staff, newest first (R-19). Templates keep no prices.
      responses:
        "200":
          description: Templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CrmQuoteIntroTemplate" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
    post:
      operationId: createCrmQuoteIntroTemplate
      security:
        - bearerAuth: []
      description: «Зберегти як готовий шаблон»; the name is unique ignoring case, at most 200 templates.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmCreateQuoteIntroTemplateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteIntroTemplate" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/quote-intro-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    delete:
      operationId: deleteCrmQuoteIntroTemplate
      security:
        - bearerAuth: []
      description: The author, Director or Admin.
      responses:
        "204": { description: Deleted. }
        "401": { description: Authentication required. }
        "403": { description: "Not the author, Director or Admin." }
        "404": { description: Not found. }
  /api/crm/quote-lookups/catalog:
    get:
      operationId: searchCrmQuoteCatalog
      security:
        - bearerAuth: []
      description: Catalog products for «Додати товар» with published prices; problem says why a row cannot be added.
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [Sewing, Ppe] }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: season
          in: query
          description: Only sewing models of this season (introduction pages).
          schema: { $ref: "#/components/schemas/CrmQuoteIntroSeason" }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1, maximum: 10000 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteCatalogPage" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
  /api/crm/quote-lookups/products:
    get:
      operationId: getCrmQuoteCatalogProducts
      security:
        - bearerAuth: []
      description: Current Catalog data of chosen products (a saved introduction or a template); unknown ids are left out.
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Products.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CrmQuoteCatalogProduct" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
  /api/crm/quote-lookups/introduction:
    get:
      operationId: getCrmQuoteIntroductionSetup
      security:
        - bearerAuth: []
      description: The main model of each season (codes from «Налаштування КП») and the letter variants.
      responses:
        "200":
          description: Setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteIntroductionSetup" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
  /api/crm/quote-lookups/custom-sewing-price:
    post:
      operationId: calculateCrmQuoteCustomSewing
      security:
        - bearerAuth: []
      description: >-
        «Виріб з нуля» (R-20, R-26) or a model row in another fabric (R-27): prices each variant, the sum of its fabrics
        with the shared accessories and operations, by the Catalog sewing formula and the current settings and
        reference prices. Nothing is saved; a variant that cannot be priced lists its problems.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmQuoteCustomSewingPriceInput" }
      responses:
        "200":
          description: Line names and the price of each variant, in the order given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteCustomSewingPrice" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
  /api/crm/quote-lookups/catalog/{productId}/composition:
    get:
      operationId: getCrmQuoteModelComposition
      security:
        - bearerAuth: []
      description: >-
        «Змінити склад» (R-21): the composition of a Catalog sewing model to start a changed model from: the fabric of
        each variant with its metres, and the shared accessories, services, extra fabrics and operations. Nothing is
        saved.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The composition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteModelComposition" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "404": { description: Not a sewing model of the Catalog. }
  /api/crm/quote-lookups/staff:
    get:
      operationId: getCrmQuoteStaff
      security:
        - bearerAuth: []
      description: Active Manager and Admin users a КП can be given to.
      responses:
        "200":
          description: Staff.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CrmQuoteStaff" }
        "401": { description: Authentication required. }
        "403": { description: Admin role required. }
components:
  parameters:
    QuoteId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    Invalid:
      description: Validation errors with Ukrainian messages for the Admin.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                identifier: { type: [string, "null"] }
                errorMessage: { type: string }
    Conflict:
      description: >-
        The КП was saved in another window (stale version), only a draft can be deleted, or a Catalog product or variant
        cannot be added; errors are Ukrainian strings.
      content:
        application/json:
          schema:
            type: array
            items: { type: string }
  schemas:
    CrmQuoteKind:
      type: string
      enum: [Request, Introduction]
    CrmQuoteStatus:
      type: string
      enum: [Draft, Sent]
    CrmQuoteItemKind:
      type: string
      enum: [Sewing, Ppe, OneOffPpe, CustomSewing]
    CrmQuoteItemLineKind:
      type: string
      enum: [Accessory, Operation, Service, Fabric]
      description: >-
        Service is a «послуга» of a Catalog model priced by its other-cost code; Fabric is an extra fabric shared by
        every variant (for example a lining), in metres.
    CrmQuoteItemLineInput:
      type: object
      required: [kind, referenceId, quantity]
      properties:
        kind: { $ref: "#/components/schemas/CrmQuoteItemLineKind" }
        referenceId:
          type: integer
          minimum: 0
          description: Reference garment accessory, operation or fabric (1 or more); 0 for a service.
        costCode: { type: [string, "null"], maxLength: 80, description: Service only; its other-cost code. }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 10000 }
        manualMinutes:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 10000
          description: Operation only; minutes of an operation without a fixed norm.
    CrmQuoteItemLine:
      type: object
      required: [id, kind, referenceId, name, unit, quantity]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/CrmQuoteItemLineKind" }
        referenceId: { type: integer, description: 0 for a service. }
        costCode: { type: [string, "null"], description: Service only. }
        name: { type: string, description: Copied from the reference when the line was priced. }
        unit: { type: string }
        quantity: { type: number }
        manualMinutes: { type: [number, "null"] }
    CrmQuoteModelComposition:
      type: object
      required: [productId, fabrics, lines]
      properties:
        productId: { type: integer }
        fabrics:
          type: array
          description: The fabric of each variant, in the Catalog order.
          items:
            type: object
            required: [articleId, fabricId, meters, isActive]
            properties:
              articleId: { type: integer, format: int64 }
              fabricId: { type: integer }
              name: { type: [string, "null"] }
              meters: { type: number }
              isActive: { type: boolean }
        lines:
          type: array
          description: Shared accessories, extra fabrics and services, then operations, in the Catalog order.
          items:
            type: object
            required: [kind, referenceId, unit, quantity]
            properties:
              kind: { $ref: "#/components/schemas/CrmQuoteItemLineKind" }
              referenceId: { type: integer }
              costCode: { type: [string, "null"] }
              name: { type: [string, "null"], description: The reference name or the service code; null when gone. }
              unit: { type: string }
              quantity: { type: number }
              manualMinutes: { type: [number, "null"] }
    CrmQuoteOptionFabricInput:
      type: object
      required: [fabricId, meters]
      properties:
        fabricId: { type: integer, minimum: 1 }
        meters: { type: number, exclusiveMinimum: 0, maximum: 10000 }
    CrmQuoteOptionFabrics:
      type: array
      minItems: 1
      maxItems: 10
      description: Different fabrics; their costs are summed in the variant's price.
      items: { $ref: "#/components/schemas/CrmQuoteOptionFabricInput" }
    CrmQuoteCustomSewingPriceInput:
      type: object
      required: [variants, lines]
      properties:
        variants:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [fabrics]
            properties:
              fabrics: { $ref: "#/components/schemas/CrmQuoteOptionFabrics" }
        lines:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/CrmQuoteItemLineInput" }
    CrmQuoteCustomSewingPrice:
      type: object
      required: [lines, variants]
      properties:
        lines:
          type: array
          description: The reference data of each requested line; name is null when the row is gone.
          items:
            type: object
            required: [kind, referenceId, isActive]
            properties:
              kind: { $ref: "#/components/schemas/CrmQuoteItemLineKind" }
              referenceId: { type: integer }
              costCode: { type: [string, "null"] }
              name: { type: [string, "null"] }
              unit: { type: [string, "null"] }
              unitValue:
                type: [number, "null"]
                description: Accessory, fabric or service price per unit, or operation norm in minutes.
              isActive: { type: boolean }
        variants:
          type: array
          items:
            type: object
            required: [fabrics, problems]
            properties:
              title:
                type: [string, "null"]
                description: The fabric names joined by « + »; null when a fabric is gone from the Reference.
              fabrics:
                type: array
                items:
                  type: object
                  required: [fabricId, meters]
                  properties:
                    fabricId: { type: integer }
                    meters: { type: number }
                    name: { type: [string, "null"] }
                    details: { type: [string, "null"], description: The client text of the fabric. }
                    pricePerMeter: { type: [number, "null"] }
              minutes: { type: [number, "null"] }
              laborCost: { type: [number, "null"], description: "Minutes × cost of a minute, UAH." }
              fullCost: { type: [number, "null"] }
              prices:
                oneOf: [{ $ref: "#/components/schemas/CrmQuoteTierPrices" }, { type: "null" }]
              problems: { type: array, items: { type: string }, description: Why prices is null. }
    CrmQuoteVersionRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    CrmQuoteEvent:
      type: object
      required: [id, kind, at, actor]
      properties:
        id: { type: integer, format: int64 }
        kind:
          type: string
          enum: [Created, Saved, Sent, Repriced, ResponsibleChanged, Archived, Restored, Copied, Imported]
        at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/CrmQuotePerson" }
        details:
          type: [string, "null"]
          description: For example the recipients of a letter, the old and new responsible, or the source КП number.
    CrmQuotePerson:
      type: object
      required: [userId, name]
      properties:
        userId: { type: integer }
        name: { type: string }
    CrmQuotePriceInput:
      type: object
      required: [shown]
      properties:
        shown: { type: boolean }
        manual:
          description: PPE and one-off PPE only; null keeps the Catalog price.
          type: [number, "null"]
          minimum: 0
          maximum: 10000000
    CrmQuoteOptionInput:
      type: object
      required: [isRecommended, retail, wholesale, large]
      properties:
        id: { type: [integer, "null"], format: int64, description: The saved row; null for a new one. }
        articleId: { type: [integer, "null"], format: int64, description: Fabric variant of a sewing model. }
        isRecommended: { type: boolean }
        retail: { $ref: "#/components/schemas/CrmQuotePriceInput" }
        wholesale: { $ref: "#/components/schemas/CrmQuotePriceInput" }
        large: { $ref: "#/components/schemas/CrmQuotePriceInput" }
        manualReason: { type: [string, "null"], maxLength: 500, description: Required when a PPE price differs from the Catalog. }
        fabrics:
          description: >-
            CustomSewing: the fabrics of the variant (R-26). Sewing: one fabric from the Reference for a row in another
            fabric, with articleId null (R-27). Null for a Catalog variant and a PPE.
          oneOf: [{ $ref: "#/components/schemas/CrmQuoteOptionFabrics" }, { type: "null" }]
    CrmQuoteItemInput:
      type: object
      required: [kind, options]
      properties:
        id: { type: [integer, "null"], format: int64 }
        kind: { $ref: "#/components/schemas/CrmQuoteItemKind" }
        productId:
          type: [integer, "null"]
          description: >-
            Required for Sewing and Ppe, null for OneOffPpe; for CustomSewing the model whose composition was changed,
            or null for a product from scratch.
        name: { type: [string, "null"], maxLength: 200, description: OneOffPpe and CustomSewing only. }
        description: { type: [string, "null"], maxLength: 4000 }
        photoUrl: { type: [string, "null"], maxLength: 1000 }
        supplierUrl: { type: [string, "null"], maxLength: 1000 }
        options:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/CrmQuoteOptionInput" }
        lines:
          type: [array, "null"]
          maxItems: 200
          description: CustomSewing only (needs at least one operation); prices come from the server.
          items: { $ref: "#/components/schemas/CrmQuoteItemLineInput" }
    CrmSaveQuoteInput:
      type: object
      required: [version, internalName, items]
      properties:
        version: { type: integer, description: The loaded version; ignored on create. }
        internalName: { type: string, minLength: 1, maxLength: 200 }
        customerId: { type: [integer, "null"], format: int64 }
        recipientName: { type: [string, "null"], maxLength: 200 }
        companyName: { type: [string, "null"], maxLength: 200 }
        clientComment: { type: [string, "null"], maxLength: 4000 }
        managerNote: { type: [string, "null"], maxLength: 4000 }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CrmQuoteItemInput" }
    CrmQuotePrice:
      type: object
      required: [isManual, shown]
      properties:
        amount: { type: [number, "null"], description: What the client sees. }
        source: { type: [number, "null"], description: The Catalog price taken into the КП. }
        isManual: { type: boolean }
        shown: { type: boolean }
    CrmQuoteOption:
      type: object
      required: [id, title, isRecommended, retail, wholesale, large, fabrics]
      properties:
        id: { type: integer, format: int64 }
        articleId: { type: [integer, "null"], format: int64 }
        fabricId: { type: [integer, "null"] }
        title: { type: string }
        details: { type: [string, "null"] }
        isRecommended: { type: boolean }
        retail: { $ref: "#/components/schemas/CrmQuotePrice" }
        wholesale: { $ref: "#/components/schemas/CrmQuotePrice" }
        large: { $ref: "#/components/schemas/CrmQuotePrice" }
        manualReason: { type: [string, "null"] }
        manualByName: { type: [string, "null"] }
        manualAt: { type: [string, "null"], format: date-time }
        pricesTakenAt: { type: [string, "null"], format: date-time }
        fabricMeters: { type: [number, "null"], description: Metres of the first fabric. }
        fabrics:
          type: array
          description: The fabrics of a «Виріб з нуля» variant or of a model row in another fabric; empty otherwise.
          items:
            type: object
            required: [fabricId, name, meters]
            properties:
              fabricId: { type: integer }
              name: { type: string }
              meters: { type: number }
    CrmQuoteItem:
      type: object
      required: [id, kind, name, options, lines]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/CrmQuoteItemKind" }
        productId: { type: [integer, "null"] }
        code: { type: [string, "null"] }
        name: { type: string }
        subtitle: { type: [string, "null"] }
        description: { type: [string, "null"] }
        siteUrl: { type: [string, "null"] }
        photoUrl: { type: [string, "null"] }
        season: { type: [string, "null"] }
        supplierUrl: { type: [string, "null"] }
        options:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteOption" }
        lines:
          type: array
          description: Accessories and operations of a CustomSewing item; empty for other items.
          items: { $ref: "#/components/schemas/CrmQuoteItemLine" }
    CrmQuote:
      type: object
      required: [id, number, kind, status, internalName, author, responsible, createdAt, updatedAt, version, items]
      properties:
        id: { type: integer, format: int64 }
        number: { type: string, examples: ["37-9-2026"] }
        kind: { $ref: "#/components/schemas/CrmQuoteKind" }
        status: { $ref: "#/components/schemas/CrmQuoteStatus" }
        internalName: { type: string }
        customerId: { type: [integer, "null"], format: int64 }
        recipientName: { type: [string, "null"] }
        companyName: { type: [string, "null"] }
        clientComment: { type: [string, "null"] }
        managerNote: { type: [string, "null"] }
        author: { $ref: "#/components/schemas/CrmQuotePerson" }
        responsible: { $ref: "#/components/schemas/CrmQuotePerson" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastSentAt: { type: [string, "null"], format: date-time, description: Last time Gmail accepted the КП. }
        archivedAt: { type: [string, "null"], format: date-time, description: Set while the КП is in «Архів». }
        archivedByName: { type: [string, "null"] }
        version: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteItem" }
        introduction:
          oneOf: [{ $ref: "#/components/schemas/CrmQuoteIntroduction" }, { type: "null" }]
          description: Only a «КП для знайомства» has it; its items go page by page, 4 per page.
    CrmQuoteSummary:
      type: object
      required: [id, number, kind, status, internalName, responsible, itemsCount, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        number: { type: string }
        kind: { $ref: "#/components/schemas/CrmQuoteKind" }
        status: { $ref: "#/components/schemas/CrmQuoteStatus" }
        internalName: { type: string }
        companyName: { type: [string, "null"] }
        responsible: { $ref: "#/components/schemas/CrmQuotePerson" }
        itemsCount: { type: integer }
        updatedAt: { type: string, format: date-time }
        lastSentAt: { type: [string, "null"], format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    CrmQuotePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteSummary" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    CrmQuoteTierPrices:
      type: object
      properties:
        retail: { type: [number, "null"], description: 1–9 pcs. }
        wholesale: { type: [number, "null"], description: 10–40 pcs. }
        large: { type: [number, "null"], description: From 41 pcs. }
    CrmQuoteRepriceChange:
      type: object
      required: [optionId, itemName, optionTitle, before, after]
      properties:
        optionId: { type: integer, format: int64 }
        itemName: { type: string }
        optionTitle: { type: string }
        before: { $ref: "#/components/schemas/CrmQuoteTierPrices" }
        after: { $ref: "#/components/schemas/CrmQuoteTierPrices" }
    CrmQuoteRepriceProblem:
      type: object
      required: [optionId, itemName, optionTitle, reason]
      properties:
        optionId: { type: integer, format: int64 }
        itemName: { type: string }
        optionTitle: { type: string }
        reason: { type: string }
    CrmQuoteRepriceReport:
      type: object
      required: [applied, version, changes, unavailable]
      properties:
        applied: { type: boolean }
        version: { type: integer }
        changes:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteRepriceChange" }
        unavailable:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteRepriceProblem" }
    CrmImportPerson:
      type: object
      required: [name]
      properties:
        email: { type: [string, "null"], maxLength: 320, description: Found among Brevi staff by e-mail. }
        name: { type: string, maxLength: 200 }
    CrmImportPrice:
      type: object
      required: [shown]
      properties:
        source: { type: [number, "null"], minimum: 0, maximum: 10000000 }
        manual: { type: [number, "null"], minimum: 0, maximum: 10000000 }
        shown: { type: boolean }
    CrmImportOption:
      type: object
      required: [title, prices]
      properties:
        fabricCode: { type: [string, "null"], description: Reference fabric `FAB-…` of a sewing row. }
        fabricMeters: { type: [number, "null"], exclusiveMinimum: 0, description: Metres in one «Виріб з нуля». }
        title: { type: string, maxLength: 200 }
        details: { type: [string, "null"], maxLength: 4000 }
        isRecommended: { type: boolean }
        prices:
          type: object
          required: [retail, wholesale, large]
          properties:
            retail: { $ref: "#/components/schemas/CrmImportPrice" }
            wholesale: { $ref: "#/components/schemas/CrmImportPrice" }
            large: { $ref: "#/components/schemas/CrmImportPrice" }
        manualReason: { type: [string, "null"], maxLength: 500 }
        manualByEmail: { type: [string, "null"] }
        manualByName: { type: [string, "null"] }
        manualAt: { type: [string, "null"], format: date-time }
    CrmImportItem:
      type: object
      required: [kind, name, options]
      properties:
        kind: { $ref: "#/components/schemas/CrmQuoteItemKind" }
        code: { type: [string, "null"], description: Catalog code `MOD-…` or PPE site article; required for Sewing and Ppe. }
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 4000 }
        siteUrl: { type: [string, "null"] }
        photoUrl: { type: [string, "null"], description: "Kept only when it starts with https://." }
        season: { type: [string, "null"] }
        supplierUrl: { type: [string, "null"] }
        options:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/CrmImportOption" }
        lines:
          type: [array, "null"]
          maxItems: 200
          description: The composition of a «Виріб з нуля» by Reference codes.
          items:
            type: object
            required: [kind, code, quantity]
            properties:
              kind: { type: string, enum: [Fabric, Accessory, Operation] }
              code: { type: string, description: "`FAB-…`, `FUR-…` or `OP-…`." }
              quantity: { type: number, exclusiveMinimum: 0 }
    CrmImportQuote:
      type: object
      required: [number, kind, status, internalName, author, responsible, createdAt, updatedAt, items]
      properties:
        sourceId: { type: [string, "null"] }
        number: { type: string, pattern: "^[0-9]{1,6}-[0-9]{1,2}-[0-9]{4}$", description: Calculator number n-month-year. }
        kind: { $ref: "#/components/schemas/CrmQuoteKind" }
        status: { $ref: "#/components/schemas/CrmQuoteStatus" }
        internalName: { type: string, maxLength: 200 }
        recipientName: { type: [string, "null"], maxLength: 200 }
        companyName: { type: [string, "null"], maxLength: 200 }
        clientComment: { type: [string, "null"], maxLength: 4000 }
        managerNote: { type: [string, "null"], maxLength: 4000 }
        keepinClientId: { type: [string, "null"], description: Linked to the Brevi customer with this KeepinCRM id. }
        author: { $ref: "#/components/schemas/CrmImportPerson" }
        responsible: { $ref: "#/components/schemas/CrmImportPerson" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastSentAt: { type: [string, "null"], format: date-time }
        introduction:
          type: [object, "null"]
          required: [layout]
          properties:
            layout: { $ref: "#/components/schemas/CrmQuoteIntroLayout" }
            recipientEmail: { type: [string, "null"] }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CrmImportItem" }
        events:
          type: [array, "null"]
          items:
            type: object
            required: [kind, at, actor]
            properties:
              kind: { type: string, enum: [Sent, ResponsibleChanged] }
              at: { type: string, format: date-time }
              actor: { $ref: "#/components/schemas/CrmImportPerson" }
              details: { type: [string, "null"] }
    CrmImportQuotesInput:
      type: object
      required: [dryRun, quotes]
      properties:
        dryRun: { type: boolean }
        quotes:
          type: array
          minItems: 1
          maxItems: 1000
          description: Numbers must not repeat.
          items: { $ref: "#/components/schemas/CrmImportQuote" }
    CrmQuoteImportReport:
      type: object
      required: [dryRun, applied, total, created, requests, introductions, items, alreadyImported, renumbered, unknownPeople, warnings]
      properties:
        dryRun: { type: boolean }
        applied: { type: boolean }
        total: { type: integer }
        created: { type: integer, description: КП that are (or would be) added. }
        requests: { type: integer }
        introductions: { type: integer }
        items: { type: integer }
        alreadyImported:
          type: array
          description: Calculator numbers transferred before; skipped.
          items: { type: string }
        renumbered:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string }
              to: { type: string }
        unknownPeople:
          type: array
          description: Calculator users not found among staff; their КП go to the person who imports.
          items: { $ref: "#/components/schemas/CrmImportPerson" }
        warnings:
          type: array
          description: Transferred anyway with the calculator prices; «Перерахувати» cannot update the named rows.
          items:
            type: object
            required: [number, message]
            properties:
              number: { type: string }
              item: { type: [string, "null"] }
              message: { type: string }
    CrmQuoteCatalogVariant:
      type: object
      required: [articleId, sku, title]
      properties:
        articleId: { type: integer, format: int64 }
        sku: { type: string }
        title: { type: string, description: Fabric name. }
        fabricInfo: { type: [string, "null"], description: "For the manager only, fabric price and supplier." }
        prices: { oneOf: [{ $ref: "#/components/schemas/CrmQuoteTierPrices" }, { type: "null" }] }
        problem: { type: [string, "null"], description: Why it cannot be added; null when it can. }
    CrmQuoteCatalogProduct:
      type: object
      required: [productId, kind, name, variants]
      properties:
        productId: { type: integer }
        kind: { type: string, enum: [Sewing, Ppe] }
        code: { type: [string, "null"] }
        name: { type: string }
        season: { type: [string, "null"] }
        photoUrl: { type: [string, "null"] }
        description: { type: [string, "null"], description: «Короткий опис для КП». }
        prices: { oneOf: [{ $ref: "#/components/schemas/CrmQuoteTierPrices" }, { type: "null" }] }
        problem: { type: [string, "null"] }
        variants:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteCatalogVariant" }
    CrmQuoteCatalogPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteCatalogProduct" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    CrmQuoteStaff:
      type: object
      required: [userId, name]
      properties:
        userId: { type: integer }
        name: { type: string }
        email: { type: [string, "null"] }
    CrmQuoteCompany:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 300 }
        edrpou: { type: [string, "null"], description: 8 digits. }
        taxId: { type: [string, "null"], description: "ІПН, 10–12 digits." }
        iban: { type: [string, "null"] }
        address: { type: [string, "null"], maxLength: 300 }
        phone: { type: [string, "null"], maxLength: 50 }
        email: { type: [string, "null"], format: email }
        site: { type: [string, "null"], format: uri }
        logoUrl: { type: [string, "null"], format: uri, description: "https link (photo library); SVG, PNG or JPEG." }
    CrmQuoteEmailTemplate:
      type: object
      required: [subject, body]
      description: "Marks: {quoteNumber}, {managerName}, {managerPhone}, {managerEmail}, {site}."
      properties:
        subject: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 4000 }
    CrmQuotePdfTexts:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 300 }
        vatNotice: { type: [string, "null"], maxLength: 300 }
        ctaTitle: { type: [string, "null"], maxLength: 300 }
        ctaText: { type: [string, "null"], maxLength: 4000 }
        ctaContactTemplate: { type: [string, "null"], maxLength: 4000, description: "Marks: {managerName}, {managerPhone}, {managerEmail}." }
    CrmQuoteAdvantage:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 300 }
        text: { type: [string, "null"], maxLength: 300 }
    CrmQuoteIntroductionTexts:
      type: object
      required: [advantages]
      description: «КП для знайомства — рекламний каталог».
      properties:
        logoText: { type: [string, "null"] }
        summerTitle: { type: [string, "null"] }
        winterTitle: { type: [string, "null"] }
        subtitle: { type: [string, "null"] }
        summerBannerUrl: { type: [string, "null"], format: uri }
        winterBannerUrl: { type: [string, "null"], format: uri }
        modelsTitle: { type: [string, "null"] }
        assortmentLinkText: { type: [string, "null"] }
        assortmentUrl: { type: [string, "null"], format: uri }
        productButtonText: { type: [string, "null"] }
        nextStepText: { type: [string, "null"] }
        accentColor: { type: [string, "null"], pattern: "^#[0-9A-Fa-f]{6}$" }
        summerMainCode: { type: [string, "null"], maxLength: 100, description: "Main summer model code; null means MOD-166 «Імпульс»." }
        winterMainCode: { type: [string, "null"], maxLength: 100, description: "Main winter model code; null means MOD-169 «Прайм»." }
        advantages:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: "#/components/schemas/CrmQuoteAdvantage" }
    CrmQuoteLetterVariant:
      type: object
      required: [name, subject, body]
      properties:
        name: { type: string, maxLength: 300 }
        subject: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 4000 }
    CrmQuoteStaffContact:
      type: object
      required: [userId, accountName, name]
      properties:
        userId: { type: integer }
        accountName: { type: string }
        accountEmail: { type: [string, "null"] }
        name: { type: string, description: Name shown to the client. }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        mailboxEmail: { type: [string, "null"], description: Connected Gmail КП are sent from; null until connected. }
    CrmQuoteStaffContactInput:
      type: object
      required: [userId, name]
      properties:
        userId: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 300 }
        phone: { type: [string, "null"], maxLength: 50 }
        email: { type: [string, "null"], format: email }
    CrmQuoteSettings:
      type: object
      required: [version, company, email, pdf, introduction, letterVariants, staffContacts]
      properties:
        version: { type: integer, description: 0 before the first save. }
        updatedByName: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
        company: { $ref: "#/components/schemas/CrmQuoteCompany" }
        email: { $ref: "#/components/schemas/CrmQuoteEmailTemplate" }
        pdf: { $ref: "#/components/schemas/CrmQuotePdfTexts" }
        introduction: { $ref: "#/components/schemas/CrmQuoteIntroductionTexts" }
        letterVariants:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteLetterVariant" }
        staffContacts:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteStaffContact" }
    CrmSaveQuoteSettingsInput:
      type: object
      required: [version, company, email, pdf, introduction, letterVariants, staffContacts]
      properties:
        version: { type: integer, minimum: 0 }
        company: { $ref: "#/components/schemas/CrmQuoteCompany" }
        email: { $ref: "#/components/schemas/CrmQuoteEmailTemplate" }
        pdf: { $ref: "#/components/schemas/CrmQuotePdfTexts" }
        introduction: { $ref: "#/components/schemas/CrmQuoteIntroductionTexts" }
        letterVariants:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/CrmQuoteLetterVariant" }
        staffContacts:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CrmQuoteStaffContactInput" }
    CrmQuoteLetter:
      type: object
      required: [name, subject, body]
      properties:
        name: { type: string }
        subject: { type: string }
        body: { type: string }
    CrmQuoteSendDraft:
      type: object
      required: [fromName, gmailConfigured, fileName, letters]
      properties:
        fromEmail: { type: [string, "null"], format: email }
        fromName: { type: string }
        gmailConfigured: { type: boolean }
        fileName: { type: string }
        letters:
          type: array
          description: For an introduction the chosen letter variant comes first.
          items: { $ref: "#/components/schemas/CrmQuoteLetter" }
        to: { type: [string, "null"], description: The recipient saved in an introduction. }
    CrmSendQuoteInput:
      type: object
      required: [version, to, subject, body]
      properties:
        version: { type: integer, minimum: 1 }
        to: { type: string, maxLength: 2000, description: "1 to 10 addresses separated by commas, semicolons or spaces." }
        subject: { type: string, maxLength: 300, description: One line. }
        body: { type: string, maxLength: 10000, description: Plain text. }
    CrmQuoteIntroLayout:
      type: string
      enum: [General, Summer, Winter]
      description: General = summer and winter pages; Summer or Winter = one page.
    CrmQuoteIntroSeason:
      type: string
      enum: [Summer, Winter]
    CrmQuoteIntroduction:
      type: object
      required: [layout]
      properties:
        layout: { $ref: "#/components/schemas/CrmQuoteIntroLayout" }
        recipientEmail: { type: [string, "null"] }
        letterName: { type: [string, "null"] }
    CrmQuoteIntroModelInput:
      type: object
      required: [productId, articleId]
      properties:
        itemId: { type: [integer, "null"], format: int64, description: "The saved item, so its price stays." }
        productId: { type: integer, minimum: 1 }
        articleId: { type: integer, format: int64, minimum: 1, description: The fabric variant. }
    CrmQuoteIntroPageInput:
      type: object
      required: [season, models]
      properties:
        season: { $ref: "#/components/schemas/CrmQuoteIntroSeason" }
        models:
          type: array
          minItems: 4
          maxItems: 4
          description: The main model of the season first.
          items: { $ref: "#/components/schemas/CrmQuoteIntroModelInput" }
    CrmSaveQuoteIntroductionInput:
      type: object
      required: [version, internalName, layout, pages]
      properties:
        version: { type: integer, description: Ignored on create. }
        internalName: { type: string, minLength: 1, maxLength: 200 }
        customerId: { type: [integer, "null"], format: int64 }
        recipientEmail: { type: [string, "null"], maxLength: 320, format: email }
        recipientName: { type: [string, "null"], maxLength: 200 }
        companyName: { type: [string, "null"], maxLength: 200 }
        managerNote: { type: [string, "null"], maxLength: 4000 }
        layout: { $ref: "#/components/schemas/CrmQuoteIntroLayout" }
        letterName: { type: [string, "null"], maxLength: 300 }
        pages:
          type: array
          description: One page per season of the layout, summer first; a model only once.
          items: { $ref: "#/components/schemas/CrmQuoteIntroPageInput" }
    CrmQuoteIntroMainModel:
      type: object
      required: [code]
      properties:
        code: { type: string }
        product: { oneOf: [{ $ref: "#/components/schemas/CrmQuoteCatalogProduct" }, { type: "null" }] }
        problem: { type: [string, "null"], description: Why the page cannot be built; null when it can. }
    CrmQuoteIntroLetter:
      type: object
      required: [name, subject]
      properties:
        name: { type: string }
        subject: { type: string }
    CrmQuoteIntroductionSetup:
      type: object
      required: [summer, winter, letters]
      properties:
        summer: { $ref: "#/components/schemas/CrmQuoteIntroMainModel" }
        winter: { $ref: "#/components/schemas/CrmQuoteIntroMainModel" }
        letters:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteIntroLetter" }
    CrmQuoteIntroTemplateModel:
      type: object
      required: [productId, articleId, productName, fabricTitle]
      properties:
        productId: { type: integer }
        articleId: { type: integer, format: int64 }
        productName: { type: string, description: The name when the template was saved. }
        fabricTitle: { type: string }
    CrmQuoteIntroTemplatePage:
      type: object
      required: [season, models]
      properties:
        season: { $ref: "#/components/schemas/CrmQuoteIntroSeason" }
        models:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteIntroTemplateModel" }
    CrmQuoteIntroTemplate:
      type: object
      required: [id, name, layout, pages, author, createdAt, canDelete]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        layout: { $ref: "#/components/schemas/CrmQuoteIntroLayout" }
        letterName: { type: [string, "null"] }
        pages:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteIntroTemplatePage" }
        author: { $ref: "#/components/schemas/CrmQuotePerson" }
        createdAt: { type: string, format: date-time }
        canDelete: { type: boolean, description: "The actor is the author, Director or Admin." }
    CrmCreateQuoteIntroTemplateInput:
      type: object
      required: [name, layout, pages]
      properties:
        name: { type: string, maxLength: 100 }
        layout: { $ref: "#/components/schemas/CrmQuoteIntroLayout" }
        letterName: { type: [string, "null"], maxLength: 300 }
        pages:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteIntroPageInput" }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
