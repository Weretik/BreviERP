openapi: 3.1.0
info:
  title: BreviERP CRM Embroidery Price API
  version: 1.1.0
  description: >-
    «Ціна вишивки» of the «Менеджер сервісу» block (EMB-001). Manager, Director and Admin calculate the price of an
    embroidery on a garment or of chevrons; only Director and Admin (the Director also holds Admin) get the cost and
    read or change «Налаштування». The embroiderer's rate is the pricing parameter `EMBROIDERY_RATE_1000_STITCHES` of
    «Параметри ціноутворення». Money is UAH rounded half-up to kopecks from exact values.
servers:
  - url: /
paths:
  /api/crm/embroidery/form:
    get:
      operationId: getCrmEmbroideryForm
      security:
        - bearerAuth: []
      description: Hoops, extra costs and the two price category names for the form. No rates are returned.
      responses:
        "200":
          description: The form.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmEmbroideryForm" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role and a numeric actor claim required. }
  /api/crm/embroidery/calculate:
    post:
      operationId: calculateCrmEmbroidery
      security:
        - bearerAuth: []
      description: >-
        Computes the price and saves nothing. A problem that stops the price (a blank wider than the roll, an unknown
        hoop, no stitch rate) comes back as `error` with status 200 and no prices. `cost` and money of the cut layout
        are null for a Manager.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmCalculateEmbroideryInput" }
      responses:
        "200":
          description: The price.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmEmbroideryCalculation" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role and a numeric actor claim required. }
  /api/crm/embroidery/settings:
    get:
      operationId: getCrmEmbroiderySettings
      security:
        - bearerAuth: []
      description: The saved settings, or the old calculator's rates with `version` 0 before the first save.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmEmbroiderySettings" }
        "401": { description: Authentication required. }
        "403": { description: Admin role required. }
    put:
      operationId: saveCrmEmbroiderySettings
      security:
        - bearerAuth: []
      description: Saves the whole page. `version` is the one read; a stale version is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSaveEmbroiderySettingsInput" }
      responses:
        "200":
          description: Saved, with the new version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmEmbroiderySettings" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin role required. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/crm/embroidery/calculations:
    get:
      operationId: getCrmEmbroideryCalculations
      security:
        - bearerAuth: []
      description: >-
        «Збережені», newest first. `search` matches the name, the client name or the number («ВШ-0042», «вш42», «42»).
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of saved calculations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmEmbroiderySavedPage" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role and a numeric actor claim required. }
    post:
      operationId: saveCrmEmbroideryCalculation
      security:
        - bearerAuth: []
      description: >-
        «Зберегти розрахунок». The server prices the form with the rates in force now, freezes those rates with the
        record and never recalculates it. An «Орієнтовна» price (`incomplete`) can be saved; a price that failed
        (`error`), an unknown or hidden client is 400. The name is trimmed and cut to 120 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSaveEmbroideryCalculationInput" }
      responses:
        "200":
          description: The saved calculation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmEmbroiderySavedCalculation" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role and a numeric actor claim required. }
  /api/crm/embroidery/calculations/import:
    post:
      operationId: importCrmEmbroideryArchive
      security:
        - bearerAuth: []
      description: >-
        «Імпорт архіву» (Director and Admin). Moves calculations of the old calculator's archive into «Збережені» with
        their own dates, authors (matched by email, otherwise the email is shown) and frozen rates. Each record is
        priced with its old rates and must give the old saved prices to the kopeck, otherwise its line is `error`.
        A record already moved (same `legacyId`) is `unchanged`. With `dryRun=true`, or when any line is `error`,
        nothing is saved and `dryRun` in the answer is true.
      parameters:
        - { name: dryRun, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 2000
              items: { $ref: "#/components/schemas/CrmEmbroideryArchiveRow" }
      responses:
        "200":
          description: What was moved, or would be.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmEmbroideryArchiveImportResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin role required (the Director also holds Admin). }
  /api/crm/embroidery/calculations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: getCrmEmbroideryCalculation
      security:
        - bearerAuth: []
      description: One saved calculation as it was saved. `result.cost` and `rates` are null for a Manager.
      responses:
        "200":
          description: The saved calculation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmEmbroiderySavedCalculation" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role and a numeric actor claim required. }
        "404": { description: Not found. }
    delete:
      operationId: deleteCrmEmbroideryCalculation
      security:
        - bearerAuth: []
      description: Removes a saved calculation for good.
      responses:
        "204": { description: Deleted. }
        "401": { description: Authentication required. }
        "403": { description: Admin role required. }
        "404": { description: Not found. }
  /api/crm/embroidery/calculations/{id}/mockup:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      operationId: setCrmEmbroideryMockup
      security:
        - bearerAuth: []
      description: «Макет» — a Media library photo of the design for the workshop; `mediaFileId` null clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSetEmbroideryMockupInput" }
      responses:
        "200":
          description: The saved calculation with its mockup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmEmbroiderySavedCalculation" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role and a numeric actor claim required. }
        "404": { description: Not found. }
components:
  responses:
    Invalid:
      description: Validation errors with Ukrainian messages for the Admin.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                identifier: { type: [string, "null"] }
                errorMessage: { type: string }
    Conflict:
      description: The settings were saved in another window; errors are Ukrainian strings.
      content:
        application/json:
          schema:
            type: array
            items: { type: string }
  schemas:
    CrmSaveEmbroideryCalculationInput:
      type: object
      required: [calculation, category]
      properties:
        name: { type: [string, "null"], maxLength: 1000, description: Trimmed and cut to 120; empty is «Без назви». }
        customerPublicId: { type: [string, "null"], format: uuid, description: An active client of «Клієнти». }
        calculation: { $ref: "#/components/schemas/CrmCalculateEmbroideryInput" }
        category:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            The one price category kept, a price name of the result («Категорія 1» or «Категорія 2»); another name
            is 400.
    CrmEmbroideryArchiveRow:
      type: object
      required: [legacyId, createdAt, calculation, stitchRate, settings, prices]
      properties:
        legacyId: { type: string, minLength: 1, maxLength: 64, description: The old record id. }
        name: { type: [string, "null"], maxLength: 1000 }
        createdAt: { type: string, format: date-time }
        createdByEmail: { type: [string, "null"], maxLength: 200 }
        calculation: { $ref: "#/components/schemas/CrmCalculateEmbroideryInput" }
        stitchRate: { type: number, exclusiveMinimum: 0, description: The embroiderer's rate per 1000 stitches then. }
        settings: { $ref: "#/components/schemas/CrmSaveEmbroiderySettingsInput" }
        prices:
          type: array
          minItems: 1
          description: The old saved prices, «Опт», «Стандарт», «Терміново» in order.
          items: { $ref: "#/components/schemas/CrmEmbroideryArchivePrice" }
    CrmEmbroideryArchivePrice:
      type: object
      required: [unit, total, repeatUnit]
      properties:
        unit: { type: number }
        total: { type: number }
        repeatUnit: { type: number }
    CrmEmbroideryArchiveImportResult:
      type: object
      required: [dryRun, created, unchanged, errors, lines]
      properties:
        dryRun: { type: boolean, description: True when nothing was saved. }
        created: { type: integer }
        unchanged: { type: integer }
        errors: { type: integer }
        lines: { type: array, items: { $ref: "#/components/schemas/CrmEmbroideryArchiveImportLine" } }
    CrmEmbroideryArchiveImportLine:
      type: object
      required: [legacyId, name, createdAt, createdByName, action]
      properties:
        legacyId: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        createdByName: { type: string }
        action: { type: string, enum: [created, unchanged, error] }
        message: { type: [string, "null"] }
        number: { type: [string, "null"], description: «ВШ-0042» once saved. }
    CrmEmbroiderySavedPrice:
      type: object
      required: [name, unit, total, repeatUnit]
      properties:
        name: { type: string }
        unit: { type: number }
        total: { type: number }
        repeatUnit: { type: number }
    CrmEmbroiderySavedSummary:
      type: object
      required: [id, number, name, customerPublicId, customerName, mode, quantity, stitchesPerUnit, hoopLabel, incomplete,
        price, createdAt, createdByName, mockup]
      properties:
        id: { type: integer, format: int64 }
        number: { type: string, description: «ВШ-0042»; not stored. }
        name: { type: string, description: Empty means «Без назви». }
        customerPublicId: { type: [string, "null"], format: uuid }
        customerName: { type: [string, "null"], description: The client name at the time of saving. }
        mode: { $ref: "#/components/schemas/CrmEmbroideryMode" }
        quantity: { type: integer }
        stitchesPerUnit: { type: integer }
        hoopLabel: { type: string, description: The hoop name from the frozen settings. }
        incomplete: { type: boolean, description: Some ticked costs had no rate; the prices were «Орієнтовна». }
        price:
          oneOf:
            - { $ref: "#/components/schemas/CrmEmbroiderySavedPrice" }
            - { type: "null" }
          description: >-
            The one saved price category. A calculation saved before the choice keeps «Стандарт», named
            «Категорія 1». Null only for a calculation without prices.
        createdAt: { type: string, format: date-time }
        createdByName: { type: string }
        mockup:
          oneOf:
            - { $ref: "#/components/schemas/CrmEmbroideryMockup" }
            - { type: "null" }
          description: «Макет» from the Media library; null when none or the photo was removed.
    CrmEmbroideryMockup:
      type: object
      required: [mediaFileId, fileName, url, thumbnailUrl]
      properties:
        mediaFileId: { type: integer }
        fileName: { type: string }
        url: { type: string }
        thumbnailUrl: { type: [string, "null"] }
    CrmSetEmbroideryMockupInput:
      type: object
      properties:
        mediaFileId: { type: [integer, "null"], minimum: 1, description: A Media library photo; null clears the mockup. }
    CrmEmbroiderySavedPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CrmEmbroiderySavedSummary" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    CrmEmbroiderySavedCalculation:
      type: object
      required: [summary, input, result, rates]
      properties:
        summary: { $ref: "#/components/schemas/CrmEmbroiderySavedSummary" }
        input: { $ref: "#/components/schemas/CrmCalculateEmbroideryInput" }
        result:
          $ref: "#/components/schemas/CrmEmbroideryCalculation"
          description: The saved result with only the saved price category in `prices`.
        rates:
          description: The rates frozen at saving; null for a Manager.
          oneOf:
            - type: "null"
            - type: object
              required: [stitchRate, rates, markups]
              properties:
                stitchRate: { type: number, description: «Оплата вишивки за 1000 стібків» at saving. }
                rates: { $ref: "#/components/schemas/CrmEmbroideryRates" }
                markups:
                  type: array
                  items: { $ref: "#/components/schemas/CrmEmbroideryMarkup" }
    CrmEmbroideryMode:
      type: string
      description: Garment = «Вишивка на виробі», Chevron = «Шеврони».
      enum: [Garment, Chevron]
    CrmEmbroideryProgram:
      type: string
      enum: [New, Adjustment, Ready]
    CrmEmbroideryMaterialMode:
      type: string
      description: UsedBlanks = only the blanks used; FullCut = the whole cut length. Applies to both materials.
      enum: [UsedBlanks, FullCut]
    CrmEmbroideryExpenseBasis:
      type: string
      description: What one unit of the rate is counted per.
      enum: [Stitches, Hoop, Unit, MachineHour, Order]
    CrmEmbroideryExpenseMode:
      type: string
      enum: [All, ChevronOnly]
    CrmEmbroideryCostKind:
      type: string
      enum: [Stitches, Threads, Hooping, Stabilizer, Fabric, Program, Extra]
    CrmEmbroideryForm:
      type: object
      required: [seesCost, hoops, expenses, markupNames, settingsUpdatedAt]
      properties:
        seesCost: { type: boolean, description: True for Director and Admin. }
        hoops:
          type: array
          items:
            type: object
            required: [id, label, blankWidthCm, blankLengthCm]
            properties:
              id: { type: string }
              label: { type: string }
              blankWidthCm: { type: number }
              blankLengthCm: { type: number }
        expenses:
          type: array
          items:
            type: object
            required: [id, name, basis, mode, enabled, hasRate]
            properties:
              id: { type: string }
              name: { type: string }
              basis: { $ref: "#/components/schemas/CrmEmbroideryExpenseBasis" }
              mode: { $ref: "#/components/schemas/CrmEmbroideryExpenseMode" }
              enabled: { type: boolean, description: Ticked when a calculation starts. }
              hasRate: { type: boolean, description: False makes the price «Орієнтовна» while ticked. }
        markupNames: { type: array, items: { type: string }, minItems: 3, maxItems: 3 }
        settingsUpdatedAt: { type: [string, "null"], format: date-time }
    CrmCalculateEmbroideryInput:
      type: object
      required: [mode, quantity, stitchesPerUnit, hoopId, unitsPerHoop, stabilizerLayers, fabricLayers, program,
        programMinutes, materialMode]
      properties:
        mode: { $ref: "#/components/schemas/CrmEmbroideryMode" }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        stitchesPerUnit: { type: integer, minimum: 1, maximum: 1000000 }
        hoopId: { type: string, maxLength: 64 }
        unitsPerHoop: { type: integer, description: Chevrons per hooping (1–500); ignored for Garment. }
        stabilizerLayers: { type: integer, minimum: 1, maximum: 20 }
        fabricLayers: { type: integer, description: Chevron fabric layers (1–20); ignored for Garment. }
        program: { $ref: "#/components/schemas/CrmEmbroideryProgram" }
        programMinutes: { type: integer, minimum: 0, maximum: 100000, description: Ignored for Ready. }
        machineMinutes: { type: [number, "null"], minimum: 0, description: Machine time of the whole batch. }
        materialMode: { $ref: "#/components/schemas/CrmEmbroideryMaterialMode" }
        expenseOverrides:
          type: [object, "null"]
          description: Extra costs ticked (true) or unticked (false) for this calculation only, by id.
          additionalProperties: { type: boolean }
    CrmEmbroideryCalculation:
      type: object
      required: [error, missing, hoopings, fullHoopings, lastHoopUnits, freeInLastHoop, prices, cost, stabilizer, fabric]
      properties:
        error: { type: [string, "null"], description: Ukrainian text; no prices when set. }
        missing:
          type: array
          items: { type: string }
          description: Ticked costs without a rate (or «Час роботи машини»); the prices are «Орієнтовна».
        hoopings: { type: integer }
        fullHoopings: { type: integer }
        lastHoopUnits: { type: integer }
        freeInLastHoop: { type: integer }
        prices:
          type: array
          items:
            type: object
            required: [name, markupPercent, unit, total, repeatUnit]
            properties:
              name: { type: string }
              markupPercent: { type: [number, "null"], description: Null for a Manager. }
              unit: { type: number }
              total: { type: number }
              repeatUnit: { type: number, description: Unit price with the ready program. }
        cost:
          oneOf:
            - type: "null"
            - type: object
              required: [total, perUnit, rows]
              properties:
                total: { type: number }
                perUnit: { type: number }
                rows:
                  type: array
                  items:
                    type: object
                    required: [kind, name, basis, quantity, rate, amount, perUnit]
                    properties:
                      kind: { $ref: "#/components/schemas/CrmEmbroideryCostKind" }
                      name: { type: string }
                      basis:
                        oneOf:
                          - type: "null"
                          - $ref: "#/components/schemas/CrmEmbroideryExpenseBasis"
                      quantity:
                        type: number
                        description: Thousands of stitches, hoopings, blanks, minutes of development, units, machine hours or 1.
                      rate: { type: [number, "null"] }
                      amount: { type: number }
                      perUnit: { type: number }
        stabilizer:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CrmEmbroideryCut"
        fabric:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CrmEmbroideryCut"
    CrmEmbroideryCut:
      type: object
      required: [blankWidthCm, blankLengthCm, rollWidthCm, blanks, across, rows, produced, spare, sideWasteCm, cutMetres,
        blankCost, wholeCost, charged]
      properties:
        blankWidthCm: { type: number }
        blankLengthCm: { type: number }
        rollWidthCm: { type: number }
        blanks: { type: integer }
        across: { type: integer }
        rows: { type: integer }
        produced: { type: integer }
        spare: { type: integer }
        sideWasteCm: { type: number }
        cutMetres: { type: number }
        blankCost: { type: [number, "null"] }
        wholeCost: { type: [number, "null"] }
        charged: { type: [number, "null"], description: What the cost includes; null for a Manager. }
    CrmEmbroideryRates:
      type: object
      required: [threadRate, hoopingRate, programHourRate, taxPercent]
      properties:
        threadRate: { type: number, minimum: 0 }
        hoopingRate: { type: number, minimum: 0 }
        programHourRate: { type: number, minimum: 0 }
        taxPercent: { type: number, minimum: 0, description: A multiplier after the markup, not VAT. }
    CrmEmbroideryMarkup:
      type: object
      required: [name, percent]
      properties:
        name: { type: string, maxLength: 120 }
        percent: { type: number, minimum: 0 }
    CrmEmbroideryMaterial:
      type: object
      required: [pricePerMetre, widthCm]
      properties:
        pricePerMetre: { type: number, minimum: 0 }
        widthCm: { type: number, exclusiveMinimum: 0 }
    CrmEmbroideryHoop:
      type: object
      required: [id, label, blankWidthCm, blankLengthCm, glueRate]
      properties:
        id: { type: string, maxLength: 64 }
        label: { type: string, maxLength: 120 }
        blankWidthCm: { type: number, exclusiveMinimum: 0 }
        blankLengthCm: { type: number, exclusiveMinimum: 0 }
        glueRate: { type: [number, "null"], minimum: 0, description: Null uses the general «Клей» rate. }
    CrmEmbroideryExpense:
      type: object
      required: [id, name, basis, rate, enabled, mode]
      properties:
        id: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 120 }
        basis: { $ref: "#/components/schemas/CrmEmbroideryExpenseBasis" }
        rate: { type: [number, "null"], minimum: 0, description: Null = not set yet; 0 = free. }
        enabled: { type: boolean }
        mode: { $ref: "#/components/schemas/CrmEmbroideryExpenseMode" }
    CrmSaveEmbroiderySettingsInput:
      type: object
      required: [version, rates, markups, stabilizer, fabric, fabricIncreasePercent, hoops, expenses]
      properties:
        version: { type: integer, minimum: 0 }
        rates: { $ref: "#/components/schemas/CrmEmbroideryRates" }
        markups:
          type: array
          items: { $ref: "#/components/schemas/CrmEmbroideryMarkup" }
          minItems: 2
          maxItems: 3
          description: Exactly two price categories when saving the settings; a row of the old archive has three.
        stabilizer: { $ref: "#/components/schemas/CrmEmbroideryMaterial" }
        fabric: { $ref: "#/components/schemas/CrmEmbroideryMaterial" }
        fabricIncreasePercent: { type: number, minimum: 0 }
        hoops: { type: array, items: { $ref: "#/components/schemas/CrmEmbroideryHoop" }, minItems: 1, maxItems: 30 }
        expenses: { type: array, items: { $ref: "#/components/schemas/CrmEmbroideryExpense" }, maxItems: 100 }
    CrmEmbroiderySettings:
      type: object
      required: [version, updatedByName, updatedAt, stitchRate, rates, markups, stabilizer, fabric, fabricIncreasePercent,
        hoops, expenses]
      properties:
        version: { type: integer, description: 0 before the first save. }
        updatedByName: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
        stitchRate:
          type: object
          required: [value, updatedOn]
          description: Read-only here; edited in «Параметри ціноутворення».
          properties:
            value: { type: [number, "null"] }
            updatedOn: { type: [string, "null"], format: date }
        rates: { $ref: "#/components/schemas/CrmEmbroideryRates" }
        markups: { type: array, items: { $ref: "#/components/schemas/CrmEmbroideryMarkup" } }
        stabilizer: { $ref: "#/components/schemas/CrmEmbroideryMaterial" }
        fabric: { $ref: "#/components/schemas/CrmEmbroideryMaterial" }
        fabricIncreasePercent: { type: number }
        hoops: { type: array, items: { $ref: "#/components/schemas/CrmEmbroideryHoop" } }
        expenses: { type: array, items: { $ref: "#/components/schemas/CrmEmbroideryExpense" } }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
