openapi: 3.1.0
info:
  title: BreviERP CRM Draft Quotes API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/crm/quote-assignees:
    get:
      operationId: getCrmQuoteAssignees
      security: [{ bearerAuth: [] }]
      description: Bounded eligible unlocked Manager/Admin names for explicit ownership transfer. No email or authentication fields.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Paged eligible users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteAssigneePage" }
        "400": { description: "Invalid search or pagination." }
        "401": { description: "Authentication required." }
        "403": { description: "Manager or Admin role required." }
  /api/crm/quotes:
    get:
      operationId: getCrmQuotes
      security:
        - bearerAuth: []
      description: Admin sees all; Manager sees owned quotes. Counts and rows use the same scope.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 300 }
        - name: state
          in: query
          schema: { type: string, enum: [draft, ready, sent] }
        - name: archived
          in: query
          schema: { type: boolean }
        - name: ownerId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: createdFrom
          in: query
          schema: { type: string, format: date-time }
          description: Inclusive UTC creation instant.
        - name: createdBefore
          in: query
          schema: { type: string, format: date-time }
          description: Exclusive UTC creation instant.
        - name: sourceQuoteId
          in: query
          schema: { type: string, format: uuid }
          description: Copies originating from this quote.
        - name: page
          description: One-based page.
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Scoped quote page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuotePage" }
        "400": { description: "Invalid filter or page." }
        "401": { description: "Authentication required." }
        "403":
          {
            description: "Admin or Manager role and numeric actor ID required.",
          }
    post:
      operationId: createCrmQuote
      security:
        - bearerAuth: []
      description: Creates a draft root and immutable V1 atomically. Draft number is null until issuer numbering is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmCreateQuoteRequest" }
      responses:
        "201":
          description: Created draft. Identical requestId replay returns the original response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteDetail" }
        "400": { description: "Invalid recipient, contact, content or body." }
        "401": { description: "Authentication required." }
        "403":
          {
            description: "Admin or Manager role and numeric actor ID required.",
          }
        "404": { description: "Customer missing or inaccessible." }
        "409":
          {
            description: "Price basis missing, expired or changed; requestId payload conflict.",
          }
  /api/crm/quotes/price-previews:
    post:
      operationId: previewCrmQuotePrices
      security:
        - bearerAuth: []
      description: >
        Server prices one typed variant. Writes a 15-minute actor/input/quote-scoped basis.
        A blocked selection returns null tiers with blocker codes. Identical requestId
        replay returns the original basis; changed payload conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CrmPreviewQuotePricesRequest" }
            example:
              requestId: 11111111-1111-4111-8111-111111111111
              quoteId: null
              intent:
                kind: sewing
                productId: 25
                articleId: 246
                override: null
                manualPrices: null
      responses:
        "200":
          description: Server basis, three semantic tiers or typed blockers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuotePricePreview" }
        "400":
          { description: "Invalid kind, reference, amount, reason or body." }
        "401": { description: "Authentication required." }
        "403":
          {
            description: "Admin or Manager role and numeric actor ID required.",
          }
        "404": { description: "Bound quote missing or inaccessible." }
        "409":
          {
            description: "Bound quote is not editable or requestId payload differs.",
          }
  /api/crm/quotes/{quoteId}:
    parameters:
      - name: quoteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCrmQuote
      security:
        - bearerAuth: []
      description: Reads the saved current version without pricing or refreshing source values.
      responses:
        "200":
          description: Current root and immutable version snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteDetail" }
        "401": { description: "Authentication required." }
        "403":
          {
            description: "Admin or Manager role and numeric actor ID required.",
          }
        "404": { description: "Quote missing or inaccessible." }
  /api/crm/quotes/{quoteId}/versions:
    get:
      operationId: getCrmQuoteVersions
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Paged immutable version history with parent, action, actor and time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteVersionPage" }
        "400": { description: "Invalid pagination." }
        "401": { description: "Authentication required." }
        "403": { description: "Manager or Admin required." }
        "404": { description: "Missing or inaccessible quote." }
    parameters:
      - name: quoteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: saveCrmQuoteVersion
      security:
        - bearerAuth: []
      description: >
        Appends a complete immutable draft version and moves the current pointer
        atomically. Text-only edits may reuse the saved price basis; changed price
        intent requires a fresh actor/quote-scoped token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSaveQuoteVersionRequest" }
      responses:
        "200":
          description: Updated root and new immutable version. Identical requestId replay returns original response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteDetail" }
        "400": { description: "Invalid content or body." }
        "401": { description: "Authentication required." }
        "403":
          {
            description: "Admin or Manager role and numeric actor ID required.",
          }
        "404": { description: "Quote missing or inaccessible." }
        "409": { description: "Revision, source-basis or requestId conflict." }
  /api/crm/quotes/{quoteId}/versions/{versionId}:
    parameters:
      - name: quoteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCrmQuoteVersion
      security: [{ bearerAuth: [] }]
      description: Reads the specified saved version without pricing.
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Scoped immutable history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteVersionView" }

        "400": { description: "Invalid request or pagination." }
        "401": { description: "Authentication required." }
        "403": { description: "Admin or Manager role required." }
        "404": { description: "Missing or inaccessible quote or version." }
        "409":
          {
            description: "Revision, price source, blocked basis or requestId conflict.",
          }
  /api/crm/quotes/{quoteId}/events:
    parameters:
      - name: quoteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCrmQuoteEvents
      security: [{ bearerAuth: [] }]
      description: Bounded actor and ownership history under current quote access.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Scoped immutable history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteEventPage" }

        "400": { description: "Invalid request or pagination." }
        "401": { description: "Authentication required." }
        "403": { description: "Admin or Manager role required." }
        "404": { description: "Missing or inaccessible quote or version." }
        "409":
          {
            description: "Revision, price source, blocked basis or requestId conflict.",
          }
  /api/crm/quotes/{quoteId}/ready:
    parameters:
      - name: quoteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: prepareCrmQuote
      security: [{ bearerAuth: [] }]
      description: >
        Admin or owning Manager prepares exactly the saved current version. The
        server validates public recipient, visible prices, active verified
        seller/template and provisioned logo, allocates a monthly number once,
        and pins the immutable issue. Identical requestId replays the result.
        This does not render, download, queue or mark a document sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmPrepareQuoteRequest" }
      responses:
        "200":
          description: Current ready quote and pinned version/number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteDetail" }
        "400": { description: "Invalid request or ready blocker (recipient, settings, price or logo)." }
        "401": { description: Authentication required. }
        "403": { description: Admin or Manager role required. }
        "404": { description: Missing or inaccessible quote. }
        "409": { description: "Revision, version, state or requestId conflict." }
  /api/crm/quotes/{quoteId}/reprice:
    parameters:
      - name: quoteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: repriceCrmQuote
      security: [{ bearerAuth: [] }]
      description: Confirms fresh previews for every current variant; exact version and revision required. Blockers abort the whole write.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmRepriceQuoteRequest" }
      responses:
        "200":
          description: Committed result. Identical accessible requestId replay returns original response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteDetail" }

        "400": { description: "Invalid request or pagination." }
        "401": { description: "Authentication required." }
        "403": { description: "Admin or Manager role required." }
        "404": { description: "Missing or inaccessible quote or version." }
        "409":
          {
            description: "Revision, price source, blocked basis or requestId conflict.",
          }
  /api/crm/quotes/{quoteId}/copy:
    parameters:
      - name: quoteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: copyCrmQuote
      security: [{ bearerAuth: [] }]
      description: Copies a selected immutable version to a new draft root owned by the actor without repricing. Number is null pending EN-005 and no delivery event is copied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmCopyQuoteRequest" }
      responses:
        "201":
          description: Committed result. Identical accessible requestId replay returns original response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteDetail" }

        "400": { description: "Invalid request or pagination." }
        "401": { description: "Authentication required." }
        "403": { description: "Admin or Manager role required." }
        "404": { description: "Missing or inaccessible quote or version." }
        "409":
          {
            description: "Revision, price source, blocked basis or requestId conflict.",
          }
  /api/crm/quotes/{quoteId}/transfer:
    parameters:
      - name: quoteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: transferCrmQuote
      security: [{ bearerAuth: [] }]
      description: Transfers current responsibility to an unlocked Manager or Admin. Former Manager loses access; replay after that loss returns 404 without revealing subsequent data.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmTransferQuoteRequest" }
      responses:
        "200":
          description: Committed result. Identical accessible requestId replay returns original response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteDetail" }

        "400": { description: "Invalid request or pagination." }
        "401": { description: "Authentication required." }
        "403": { description: "Admin or Manager role required." }
        "404": { description: "Missing or inaccessible quote or version." }
        "409":
          {
            description: "Revision, price source, blocked basis or requestId conflict.",
          }
  /api/crm/quotes/{quoteId}/archive:
    parameters:
      - name: quoteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setCrmQuoteArchived
      security: [{ bearerAuth: [] }]
      description: Archives or restores without deleting versions. State and monetary history are retained.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmArchiveQuoteRequest" }
      responses:
        "200":
          description: Committed result. Identical accessible requestId replay returns original response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmQuoteDetail" }

        "400": { description: "Invalid request or pagination." }
        "401": { description: "Authentication required." }
        "403": { description: "Admin or Manager role required." }
        "404": { description: "Missing or inaccessible quote or version." }
        "409":
          {
            description: "Revision, price source, blocked basis or requestId conflict.",
          }
components:
  schemas:
    CrmQuoteAssignee:
      type: object
      required: [userId, displayName]
      properties:
        userId: { type: integer, minimum: 1 }
        displayName: { type: string }
    CrmQuoteAssigneePage:
      type: object
      required: [value, pagedInfo]
      properties:
        value:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteAssignee" }
        pagedInfo:
          $ref: ./clients-quotes.openapi.yaml#/components/schemas/CrmPagedInfo
    CrmPrepareQuoteRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision, versionId]
      properties:
        requestId: { type: string, format: uuid }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        versionId: { type: string, format: uuid }
    CrmCopyQuoteRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision, versionId]
      properties:
        requestId: { type: string, format: uuid }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        versionId: { type: string, format: uuid }
    CrmArchiveQuoteRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision, archived, reason]
      properties:
        requestId: { type: string, format: uuid }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        archived: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CrmTransferQuoteRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision, ownerId, reason]
      properties:
        requestId: { type: string, format: uuid }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        ownerId: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CrmRepriceQuoteRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision, versionId, bases]
      properties:
        requestId: { type: string, format: uuid }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        versionId: { type: string, format: uuid }
        bases:
          type: array
          minItems: 1
          maxItems: 3000
          items: { $ref: "#/components/schemas/CrmQuoteRepriceBasis" }
    CrmQuoteRepriceBasis:
      type: object
      additionalProperties: false
      required: [variantId, basisToken]
      properties:
        variantId: { type: string, format: uuid }
        basisToken: { type: string, format: uuid }
    CrmQuoteVersionSummary:
      type: object
      required:
        [publicId, versionNumber, action, actorId, createdAt, parentVersionId]
      properties:
        publicId: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        action: { type: string, enum: [created, edited, recalculated, copied] }
        actorId: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        parentVersionId: { type: [string, "null"], format: uuid }
    CrmQuoteEvent:
      type: object
      required:
        [
          publicId,
          revision,
          versionNumber,
          action,
          actorId,
          ownerId,
          previousOwnerId,
          reason,
          createdAt,
        ]
      properties:
        publicId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        versionNumber: { type: integer, minimum: 1 }
        action:
          {
            type: string,
            enum:
              [
                created,
                edited,
                recalculated,
                copied,
                transferred,
                archived,
                restored,
                readied,
              ],
          }
        actorId: { type: integer, minimum: 1 }
        ownerId: { type: integer, minimum: 1 }
        previousOwnerId: { type: [integer, "null"], minimum: 1 }
        reason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    CrmQuoteVersionPage:
      type: object
      required: [value, pagedInfo]
      properties:
        value:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteVersionSummary" }
        pagedInfo:
          $ref: ./clients-quotes.openapi.yaml#/components/schemas/CrmPagedInfo
    CrmQuoteEventPage:
      type: object
      required: [value, pagedInfo]
      properties:
        value:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteEvent" }
        pagedInfo:
          $ref: ./clients-quotes.openapi.yaml#/components/schemas/CrmPagedInfo
    CrmQuotePriceOverride:
      type: object
      additionalProperties: false
      required: [tier, amount, reason]
      properties:
        tier: { type: string, enum: [retail, wholesale, largeWholesale] }
        amount: { type: number, exclusiveMinimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    CrmQuoteManualPrices:
      type: object
      additionalProperties: false
      required: [retail, wholesale, largeWholesale, reason]
      properties:
        retail: { type: number, exclusiveMinimum: 0 }
        wholesale: { type: number, exclusiveMinimum: 0 }
        largeWholesale: { type: number, exclusiveMinimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    CrmQuotePriceIntent:
      type: object
      additionalProperties: false
      required: [kind]
      description: >
        sewing requires productId and articleId; ppe requires productId and no
        articleId; oneOffPpe requires manualPrices and no catalog reference.
        Only ppe may carry an override. customSewing requires customVersionPublicId only; the server hydrates its immutable saved composition and prices. Server validates discriminator rules.
      properties:
        kind: { type: string, enum: [sewing, ppe, oneOffPpe, customSewing] }
        productId: { type: [integer, "null"], minimum: 1 }
        articleId: { type: [integer, "null"], format: int64, minimum: 1 }
        override:
          oneOf:
            - { $ref: "#/components/schemas/CrmQuotePriceOverride" }
            - { type: "null" }
        customVersionPublicId: { type: [string, "null"], format: uuid }
        manualPrices:
          oneOf:
            - { $ref: "#/components/schemas/CrmQuoteManualPrices" }
            - { type: "null" }
    CrmQuoteCatalogPrice:
      type: object
      required:
        [
          kind,
          productId,
          sourceId,
          referenceVersionIds,
          formulaVersion,
          retail,
          wholesale,
          largeWholesale,
          blockers,
        ]
      properties:
        kind: { type: string, enum: [sewing, ppe] }
        productId: { type: integer }
        articleId: { type: [integer, "null"], format: int64 }
        sourceId: { type: string, format: uuid }
        calculationId: { type: [string, "null"], format: uuid }
        ruleVersionId: { type: [string, "null"], format: uuid }
        compositionVersion: { type: [integer, "null"], format: int64 }
        settingsVersionId: { type: [integer, "null"], format: int64 }
        referenceVersionIds:
          type: array
          items: { type: integer, format: int64 }
        formulaVersion: { type: string }
        retail: { type: [number, "null"] }
        wholesale: { type: [number, "null"] }
        largeWholesale: { type: [number, "null"] }
        blockers:
          type: array
          items: { type: string }
    CrmQuotePricePreview:
      type: object
      required:
        [
          basisToken,
          expiresAt,
          intent,
          retail,
          wholesale,
          largeWholesale,
          blockers,
          currency,
          taxBasis,
        ]
      properties:
        basisToken: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        intent: { $ref: "#/components/schemas/CrmQuotePriceIntent" }
        customVersion:
          oneOf:
            - $ref: "./custom-sewing.openapi.yaml#/components/schemas/CrmQuoteCustomVersionSnapshot"
            - { type: "null" }
        source:
          oneOf:
            - { $ref: "#/components/schemas/CrmQuoteCatalogPrice" }
            - { type: "null" }
        retail: { type: [number, "null"] }
        wholesale: { type: [number, "null"] }
        largeWholesale: { type: [number, "null"] }
        blockers:
          type: array
          items: { type: string }
        currency: { type: string, const: UAH }
        taxBasis:
          { type: string, enum: [catalog_no_extra_vat, manual_no_extra_vat, custom_no_extra_vat] }
    CrmPreviewQuotePricesRequest:
      type: object
      additionalProperties: false
      required: [requestId, intent]
      properties:
        requestId: { type: string, format: uuid }
        quoteId: { type: [string, "null"], format: uuid }
        intent: { $ref: "#/components/schemas/CrmQuotePriceIntent" }
    CrmQuoteTierVisibilityInput:
      type: object
      additionalProperties: false
      required: [retail, wholesale, largeWholesale]
      properties:
        retail: { type: boolean }
        wholesale: { type: boolean }
        largeWholesale: { type: boolean }
    CrmQuoteVariantInput:
      type: object
      additionalProperties: false
      required: [sortOrder, title, visible, priceIntent, tierVisibility]
      properties:
        publicId: { type: [string, "null"], format: uuid }
        sortOrder: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 300 }
        visible: { type: boolean }
        priceIntent: { $ref: "#/components/schemas/CrmQuotePriceIntent" }
        basisToken: { type: [string, "null"], format: uuid }
        tierVisibility:
          { $ref: "#/components/schemas/CrmQuoteTierVisibilityInput" }
    CrmQuoteItemInput:
      type: object
      additionalProperties: false
      required: [sortOrder, title, included, variants]
      properties:
        publicId: { type: [string, "null"], format: uuid }
        sortOrder: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 300 }
        publicDescription: { type: [string, "null"], maxLength: 5000 }
        publicComment: { type: [string, "null"], maxLength: 5000 }
        internalNote: { type: [string, "null"], maxLength: 5000 }
        included: { type: boolean }
        variants:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/CrmQuoteVariantInput" }
    CrmQuoteDraftContent:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CrmQuoteItemInput" }
    CrmCreateQuoteRequest:
      type: object
      additionalProperties: false
      required: [requestId, content]
      properties:
        requestId: { type: string, format: uuid }
        customerPublicId: { type: [string, "null"], format: uuid }
        contactPublicId: { type: [string, "null"], format: uuid }
        recipientName: { type: [string, "null"], maxLength: 300 }
        content: { $ref: "#/components/schemas/CrmQuoteDraftContent" }
    CrmSaveQuoteVersionRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision, content]
      properties:
        requestId: { type: string, format: uuid }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        content: { $ref: "#/components/schemas/CrmQuoteDraftContent" }
    CrmQuoteTierView:
      type: object
      required: [code, amount, visible, currency]
      properties:
        code: { type: string, enum: [retail, wholesale, largeWholesale] }
        amount: { type: [number, "null"] }
        visible: { type: boolean }
        currency: { type: string, const: UAH }
    CrmQuoteVariantView:
      type: object
      required: [publicId, sortOrder, title, kind, visible, priceBasis, tiers]
      properties:
        publicId: { type: string, format: uuid }
        sortOrder: { type: integer }
        title: { type: string }
        kind: { type: string, enum: [sewing, ppe, oneOffPpe] }
        productId: { type: [integer, "null"] }
        articleId: { type: [integer, "null"], format: int64 }
        visible: { type: boolean }
        priceBasis: { $ref: "#/components/schemas/CrmQuotePricePreview" }
        tiers:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/CrmQuoteTierView" }
    CrmQuoteItemView:
      type: object
      required: [publicId, sortOrder, title, included, variants]
      properties:
        publicId: { type: string, format: uuid }
        sortOrder: { type: integer }
        title: { type: string }
        publicDescription: { type: [string, "null"] }
        publicComment: { type: [string, "null"] }
        internalNote: { type: [string, "null"] }
        included: { type: boolean }
        variants:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteVariantView" }
    CrmQuoteVersionView:
      type: object
      required:
        [
          publicId,
          versionNumber,
          action,
          recipientName,
          currency,
          taxBasis,
          actorId,
          createdAt,
          items,
        ]
      properties:
        publicId: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        action: { type: string, enum: [created, edited, recalculated, copied] }
        recipientName: { type: string }
        customerPublicId: { type: [string, "null"], format: uuid }
        contactPublicId: { type: [string, "null"], format: uuid }
        currency: { type: string, const: UAH }
        taxBasis: { type: string, const: no_extra_vat }
        actorId: { type: integer }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteItemView" }
    CrmQuoteDetail:
      type: object
      required:
        [
          publicId,
          recipientName,
          revision,
          state,
          archived,
          ownerId,
          createdAt,
          updatedAt,
          canEdit,
          version,
        ]
      properties:
        publicId: { type: string, format: uuid }
        customerPublicId: { type: [string, "null"], format: uuid }
        contactPublicId: { type: [string, "null"], format: uuid }
        recipientName: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [draft, ready, sent] }
        archived: { type: boolean }
        number: { type: [string, "null"] }
        ownerId: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        canEdit: { type: boolean }
        version: { $ref: "#/components/schemas/CrmQuoteVersionView" }
        sourceQuoteId: { type: [string, "null"], format: uuid }
        sourceVersionId: { type: [string, "null"], format: uuid }
    CrmQuoteSummary:
      type: object
      required:
        [
          publicId,
          recipientName,
          revision,
          versionNumber,
          state,
          archived,
          ownerId,
          updatedAt,
        ]
      properties:
        publicId: { type: string, format: uuid }
        recipientName: { type: string }
        revision: { type: integer, format: int64 }
        versionNumber: { type: integer }
        state: { type: string, enum: [draft, ready, sent] }
        archived: { type: boolean }
        number: { type: [string, "null"] }
        ownerId: { type: integer }
        updatedAt: { type: string, format: date-time }
    CrmQuotePage:
      type: object
      required: [value, pagedInfo]
      properties:
        value:
          type: array
          items: { $ref: "#/components/schemas/CrmQuoteSummary" }
        pagedInfo:
          $ref: ./clients-quotes.openapi.yaml#/components/schemas/CrmPagedInfo
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
