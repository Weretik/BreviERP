{
  "openapi": "3.1.0",
  "info": {
    "title": "Crm versioned plain-text email templates",
    "version": "1.0.0"
  },
  "security": [
    {
      "Bearer": []
    }
  ],
  "paths": {
    "/api/crm/email-templates": {
      "get": {
        "operationId": "getCrmEmailTemplates",
        "tags": [
          "CrmEmailTemplates"
        ],
        "description": "Admin or Manager. Immutable version reference; no credentials or delivery side effects.",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CrmEmailTemplatePage"
                }
              }
            }
          },
          "400": {
            "description": "Malformed request, invalid placeholder/text/header or pagination"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Role/actor denied"
          }
        },
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 1000000,
              "default": 1
            }
          },
          {
            "name": "pageSize",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 25
            }
          }
        ]
      }
    },
    "/api/crm/email-templates/versions": {
      "post": {
        "operationId": "createCrmEmailTemplateVersion",
        "tags": [
          "CrmEmailTemplates"
        ],
        "description": "Admin only. Plain-text versions; allowed placeholders: {recipientName}, {managerName}, {quoteNumber}. No send or default content. Actor-bound same requestId replays; changed payload409.",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CrmEmailTemplateDetail"
                }
              }
            }
          },
          "400": {
            "description": "Malformed request, invalid placeholder/text/header or pagination"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Role/actor denied"
          },
          "409": {
            "description": "Revision or requestId payload conflict"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CrmCreateEmailTemplateRequest"
              }
            }
          }
        }
      }
    },
    "/api/crm/email-templates/{versionId}": {
      "get": {
        "operationId": "getCrmEmailTemplateVersion",
        "tags": [
          "CrmEmailTemplates"
        ],
        "description": "Admin or Manager. Immutable version reference; no credentials or delivery side effects.",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CrmEmailTemplateDetail"
                }
              }
            }
          },
          "400": {
            "description": "Malformed request, invalid placeholder/text/header or pagination"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Role/actor denied"
          },
          "404": {
            "description": "Version missing"
          }
        }
      },
      "parameters": [
        {
          "name": "versionId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ]
    },
    "/api/crm/email-templates/active": {
      "get": {
        "operationId": "getCrmActiveEmailTemplate",
        "tags": [
          "CrmEmailTemplates"
        ],
        "description": "Admin or Manager. Immutable version reference; no credentials or delivery side effects.",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CrmEmailTemplateSettings"
                }
              }
            }
          },
          "400": {
            "description": "Malformed request, invalid placeholder/text/header or pagination"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Role/actor denied"
          }
        }
      },
      "put": {
        "operationId": "activateCrmEmailTemplate",
        "tags": [
          "CrmEmailTemplates"
        ],
        "description": "Admin only. Plain-text versions; allowed placeholders: {recipientName}, {managerName}, {quoteNumber}. No send or default content. Actor-bound same requestId replays; changed payload409.",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CrmEmailTemplateSettings"
                }
              }
            }
          },
          "400": {
            "description": "Malformed request, invalid placeholder/text/header or pagination"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Role/actor denied"
          },
          "409": {
            "description": "Revision or requestId payload conflict"
          },
          "404": {
            "description": "Version missing"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CrmActivateEmailTemplateRequest"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "CrmEmailTemplateSummary": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "versionId": {
            "type": "string",
            "format": "uuid"
          },
          "number": {
            "type": "integer",
            "minimum": 1
          },
          "name": {
            "type": "string",
            "maxLength": 120
          },
          "subject": {
            "type": "string",
            "maxLength": 200
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "versionId",
          "number",
          "name",
          "subject",
          "createdAt"
        ]
      },
      "CrmEmailTemplateDetail": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "versionId": {
            "type": "string",
            "format": "uuid"
          },
          "number": {
            "type": "integer",
            "minimum": 1
          },
          "name": {
            "type": "string",
            "maxLength": 120
          },
          "subject": {
            "type": "string",
            "maxLength": 200
          },
          "body": {
            "type": "string",
            "maxLength": 3000
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "versionId",
          "number",
          "name",
          "subject",
          "body",
          "createdAt"
        ]
      },
      "CrmEmailTemplateSettings": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "revision": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "active": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/CrmEmailTemplateDetail"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "revision",
          "active"
        ]
      },
      "CrmEmailTemplatePage": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "value": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CrmEmailTemplateSummary"
            }
          },
          "pagedInfo": {
            "$ref": "./clients-quotes.openapi.yaml#/components/schemas/CrmPagedInfo"
          }
        },
        "required": [
          "value",
          "pagedInfo"
        ]
      },
      "CrmCreateEmailTemplateRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "requestId": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "subject": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1
          },
          "body": {
            "type": "string",
            "maxLength": 3000,
            "minLength": 1
          }
        },
        "required": [
          "requestId",
          "name",
          "subject",
          "body"
        ]
      },
      "CrmActivateEmailTemplateRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "requestId": {
            "type": "string",
            "format": "uuid"
          },
          "expectedRevision": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "versionId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "requestId",
          "expectedRevision",
          "versionId"
        ]
      }
    },
    "securitySchemes": {
      "Bearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    }
  }
}
