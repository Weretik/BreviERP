openapi: 3.1.0
info:
  title: 'Content: «Контент → Переадресації» redirects of the site'
  version: 1.0.0
  description: 'Permanent (301) redirects of the public site (CNT-005): an old address and the page of the new site it
    leads to. Addresses are kept as normalized paths: a full link loses its host, query and fragment, percent-encoding
    is decoded, extra slashes go and letters become lower case. A target starts with /uk or /ru. A redirect is also
    made by the server when staff change the address of a product page, a site category or an article. Policy
    access:content-redirects («Права доступу»): the Director and Admin may do everything, Manager only reads; other
    roles get 403.'
security:
- Bearer: []
paths:
  /api/content/redirects:
    get:
      tags:
      - Content
      operationId: getSiteRedirects
      description: Every redirect, by the old address.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteRedirectList'
        '401':
          description: Not signed in
        '403':
          description: No right to view «Переадресації»
    post:
      tags:
      - Content
      operationId: createSiteRedirect
      description: Adds a redirect made by hand (source Manual).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSiteRedirectRequest'
      responses:
        '200':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteRedirectResponse'
        '400':
          description: An invalid old address, a target outside /uk and /ru, the same address twice or a long note
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Not signed in
        '403':
          description: No right to create in «Переадресації»
        '409':
          description: The old address already has a redirect, the pair would make a loop, or there are 10 000 redirects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Messages'
  /api/content/redirects/old-site-import:
    post:
      tags:
      - Content
      operationId: importOldSiteRedirects
      description: Transfer of the old-site addresses. Each address goes to the page given in the file (to) or, without
        it, to the page the server finds - an address under /ru/ is resolved without that prefix and goes to the Russian
        page; the last part of the address is tried as an article, a site category and the old-site link of a product
        (its page, or its first site category when it has no page); then the deepest part that is a site category. With
        dryRun nothing is written and the answer says what would happen. An existing redirect is kept unless overwrite
        is true; a redirect made or changed by hand is always kept. Needs the create right.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportOldSiteRedirectsRequest'
      responses:
        '200':
          description: Reported (dryRun) or transferred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OldSiteRedirectImportResponse'
        '400':
          description: No addresses, more than 3000 addresses, or an address over 2000 characters
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Not signed in
        '403':
          description: No right to create in «Переадресації»
        '409':
          description: The transfer would make more than 10 000 redirects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Messages'
  /api/content/redirects/{id}:
    parameters:
    - $ref: '#/components/parameters/RedirectId'
    put:
      tags:
      - Content
      operationId: saveSiteRedirect
      description: Changes a redirect; it becomes a redirect made by hand (source Manual).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSiteRedirectRequest'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteRedirectResponse'
        '400':
          description: An invalid old address, a target outside /uk and /ru, the same address twice or a long note
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Not signed in
        '403':
          description: No right to edit in «Переадресації»
        '404':
          description: No such redirect
        '409':
          description: Another redirect has this old address, or the pair would make a loop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Messages'
    delete:
      tags:
      - Content
      operationId: deleteSiteRedirect
      description: Removes a redirect; the old address then answers 404.
      responses:
        '204':
          description: Removed
        '401':
          description: Not signed in
        '403':
          description: No right to delete in «Переадресації»
        '404':
          description: No such redirect
components:
  parameters:
    RedirectId:
      name: id
      in: path
      required: true
      description: Redirect id.
      schema:
        type: integer
        format: int32
        minimum: 1
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
  schemas:
    Messages:
      type: array
      description: Ukrainian texts for staff that say why the action was refused.
      items:
        type: string
    SiteRedirectSource:
      type: string
      description: Manual - added or changed by staff; OldSite - made by the old-site transfer; SlugChange - made when
        staff changed the address of a page.
      enum:
      - Manual
      - OldSite
      - SlugChange
    SiteRedirectResponse:
      type: object
      required:
      - id
      - fromPath
      - toPath
      - source
      - updatedAtUtc
      - updatedBy
      properties:
        id:
          type: integer
          format: int32
        fromPath:
          type: string
          maxLength: 500
          description: The old address, for example /specodyag-litnij or /ru/specodyag-litnij.
        toPath:
          type: string
          maxLength: 500
          description: The page of the new site, for example /uk/catalog/litnij-specodyag.
        source:
          $ref: '#/components/schemas/SiteRedirectSource'
        note:
          type:
          - string
          - 'null'
          maxLength: 200
        updatedAtUtc:
          type: string
          format: date-time
        updatedBy:
          type: string
    SiteRedirectList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SiteRedirectResponse'
    SaveSiteRedirectRequest:
      type: object
      description: Both addresses may be typed as full links; they are normalized.
      properties:
        fromPath:
          type:
          - string
          - 'null'
        toPath:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
          maxLength: 200
    OldSiteRedirectItem:
      type: object
      required:
      - from
      properties:
        from:
          type: string
          maxLength: 2000
          description: An address of the old site, a full link or a path.
        to:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: The page of the new site; empty to let the server find it.
    ImportOldSiteRedirectsRequest:
      type: object
      required:
      - items
      properties:
        dryRun:
          type: boolean
        overwrite:
          type: boolean
        items:
          type: array
          minItems: 1
          maxItems: 3000
          items:
            $ref: '#/components/schemas/OldSiteRedirectItem'
    OldSiteRedirectRow:
      type: object
      required:
      - fromPath
      - result
      properties:
        fromPath:
          type: string
        toPath:
          type:
          - string
          - 'null'
          description: Where the address goes; null when no page was found.
        note:
          type:
          - string
          - 'null'
          description: How the page was found, or why not.
        result:
          type: string
          enum:
          - Created
          - Updated
          - Kept
          - Same
          - Unresolved
    OldSiteRedirectImportResponse:
      type: object
      required:
      - dryRun
      - total
      - created
      - updated
      - kept
      - unresolved
      - rows
      properties:
        dryRun:
          type: boolean
        total:
          type: integer
          format: int32
        created:
          type: integer
          format: int32
        updated:
          type: integer
          format: int32
        kept:
          type: integer
          format: int32
        unresolved:
          type: integer
          format: int32
        rows:
          type: array
          description: One row per address of the file; a repeated address is listed once.
          items:
            $ref: '#/components/schemas/OldSiteRedirectRow'
