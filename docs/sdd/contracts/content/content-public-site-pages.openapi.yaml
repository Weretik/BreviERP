openapi: 3.1.0
info:
  title: 'Content: public site page texts'
  version: 1.0.0
  description: 'Read-only texts of the fixed pages for the public site (CNT-007, CNT-010). No sign-in. Only what every
    page shows anyway: the title, the description, the main text and the frequent questions. Every answer has Cache-Control: public, max-age=300.
    The server reads the texts at most once a minute.'
security: []
paths:
  /api/public/site-pages:
    get:
      tags:
      - PublicSitePages
      operationId: getPublicSitePages
      description: The saved texts by page key; a page that is not listed, or an empty text, keeps the site's own text.
      responses:
        '200':
          description: Texts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSitePagesResponse'
components:
  schemas:
    SitePageText:
      type: object
      required:
      - text
      - faq
      properties:
        title:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        text:
          type: array
          description: Main text at the bottom of the page; empty keeps the site's own (CNT-010).
          items:
            $ref: ./content-products.openapi.yaml#/components/schemas/ProductTextBlock
        faq:
          type: array
          description: Frequent questions in the order shown, also given to search engines as FAQPage; empty keeps the
            site's own.
          items:
            $ref: ./content-site-pages.openapi.yaml#/components/schemas/SiteFaqItem
    PublicSitePage:
      type: object
      required:
      - key
      - uk
      - ru
      properties:
        key:
          type: string
        uk:
          $ref: '#/components/schemas/SitePageText'
        ru:
          $ref: '#/components/schemas/SitePageText'
    PublicSitePagesResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicSitePage'
