openapi: 3.1.0
info:
  title: 'Accounting: «Бухгалтерія»'
  version: 3.1.0
  description: '«Бухгалтерія» (ACC-001): «Рахунки і каси» with balances, «Категорії», «Операції», «Перекази», «Огляд», «Контрагенти»
    and «Потребують перевірки» for the current books and «Домашня бухгалтерія», with a change log and private files
    of operations. Policy access:accounting («Права доступу»; only the Director by default):
    Director only; other roles get 403. Money is a whole number of kopecks.'
security:
- Bearer: []
paths:
  /api/accounting/settings:
    get:
      tags:
      - Accounting
      operationId: getAccountingSettings
      description: Cutover date between «Домашня бухгалтерія» and the current books, the time zone and today in Kyiv.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingSettingsResponse'
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/accounts:
    get:
      tags:
      - Accounting
      operationId: getFinanceAccounts
      description: '«Рахунки і каси»: active accounts by order and name; with includeArchived archived ones follow.'
      parameters:
      - name: includeArchived
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinanceAccountResponse'
        '401':
          description: Not signed in
        '403':
          description: Not Director
    post:
      tags:
      - Accounting
      operationId: createFinanceAccount
      description: «Додати рахунок». The name is trimmed, the currency upper-cased, the IBAN keeps letters and digits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceAccountInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAccountResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/accounts/{id}:
    put:
      tags:
      - Accounting
      operationId: updateFinanceAccount
      description: Edit an account. A save that changes nothing keeps the version. With movements the currency is fixed and
        the opening date cannot be later than the earliest movement (400).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceAccountUpdateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAccountResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
    delete:
      tags:
      - Accounting
      operationId: deleteFinanceAccount
      description: 'Delete an account; the change log keeps its last snapshot. An account with any operation or transfer (cancelled
        ones too) can only be archived: 409.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
        '409':
          description: Stale version, or the account has movements and can only be archived
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/accounts/{id}/cutover:
    put:
      tags:
      - Accounting
      operationId: setFinanceAccountCutover
      description: '«Залишок на 01.10»: confirm the starting balance of the current books (who and when are stored) or clear
        it with confirmed false.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceAccountCutoverInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAccountResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/accounts/{id}/archive:
    post:
      tags:
      - Accounting
      operationId: archiveFinanceAccount
      description: '«Архівувати»: the account leaves the active list.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceVersionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAccountResponse'
        '404':
          description: Not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/accounts/{id}/restore:
    post:
      tags:
      - Accounting
      operationId: restoreFinanceAccount
      description: «Відновити» an archived account.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceVersionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAccountResponse'
        '404':
          description: Not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/accounts/{id}/history:
    get:
      tags:
      - Accounting
      operationId: getFinanceAccountHistory
      description: Change log of one account, newest first.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinanceHistoryEntryResponse'
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/categories:
    get:
      tags:
      - Accounting
      operationId: getFinanceCategories
      description: «Категорії» of one area of the books (all areas without scope), roots and subcategories in one flat list.
      parameters:
      - name: scope
        in: query
        schema:
          $ref: '#/components/schemas/LedgerScope'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinanceCategoryResponse'
        '401':
          description: Not signed in
        '403':
          description: Not Director
    post:
      tags:
      - Accounting
      operationId: createFinanceCategory
      description: «Додати категорію», or a subcategory with parentId. A subcategory must match its root in direction and
        scope; only two levels.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceCategoryInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCategoryResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Parent not found
        '409':
          description: The same level already has this name (case-insensitive)
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/categories/{id}:
    put:
      tags:
      - Accounting
      operationId: updateFinanceCategory
      description: Rename a category or change its note and order.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceCategoryUpdateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCategoryResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Not found
        '409':
          description: Stale version or the name is taken at this level
        '401':
          description: Not signed in
        '403':
          description: Not Director
    delete:
      tags:
      - Accounting
      operationId: deleteFinanceCategory
      description: Delete a category; a root goes with its subcategories, each with its own log entry. When an operation (cancelled
        ones too) uses the category or a subcategory, the whole branch is switched off instead (active false, log action Deactivate).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        '204':
          description: Deleted or switched off
        '404':
          description: Not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/categories/{id}/history:
    get:
      tags:
      - Accounting
      operationId: getFinanceCategoryHistory
      description: Change log of one category, newest first.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinanceHistoryEntryResponse'
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/overview:
    get:
      tags:
      - Accounting
      operationId: getFinanceOverview
      description: '«Огляд»: per currency of the active accounts, the balance of the chosen area (both without scope; balances
        ignore the period) and active income and expense of the inclusive period. For Current, unconfirmedCutoverCount > 0
        means the total is not known yet.'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: scope
        in: query
        schema:
          $ref: '#/components/schemas/LedgerScope'
        description: Omit for both areas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceOverviewResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/transactions:
    get:
      tags:
      - Accounting
      operationId: getFinanceTransactions
      description: '«Операції»: one area, newest first by default (ties: newest saved first). Totals cover the whole filtered
        selection per currency, without cancelled rows. needsReview keeps «Потребують перевірки» (verification other than
        Verified); counterpartyKind with counterpartyId keeps one counterparty.'
      parameters:
      - name: scope
        in: query
        schema:
          $ref: '#/components/schemas/LedgerScope'
        description: Current by default; LegacyArchive is «Домашня бухгалтерія»
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Inclusive
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: Inclusive
      - name: accountId
        in: query
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/CategoryDirection'
      - name: categoryId
        in: query
        schema:
          type: string
          format: uuid
        description: A root takes its subcategories
      - name: subcategoryId
        in: query
        schema:
          type: string
          format: uuid
        description: One exact category; wins over categoryId
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
        description: Case-insensitive part of the description, note or one-off name
      - name: needsReview
        in: query
        schema:
          type: boolean
          default: false
      - name: counterpartyKind
        in: query
        schema:
          $ref: '#/components/schemas/CounterpartyKind'
      - name: counterpartyId
        in: query
        schema:
          type: string
          maxLength: 64
        description: 'With counterpartyKind: UUID for Financial and Client, a number for Supplier'
      - name: minMinor
        in: query
        schema:
          type: integer
          format: int64
      - name: maxMinor
        in: query
        schema:
          type: integer
          format: int64
      - name: source
        in: query
        schema:
          $ref: '#/components/schemas/MovementSource'
      - name: includeVoided
        in: query
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        schema:
          $ref: '#/components/schemas/FinanceJournalSort'
      - name: direction
        in: query
        schema:
          $ref: '#/components/schemas/FinanceSortDirection'
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
        description: 50 rows per page, fixed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceTransactionPageResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '401':
          description: Not signed in
        '403':
          description: Not Director
    post:
      tags:
      - Accounting
      operationId: createFinanceTransaction
      description: «Додати дохід» / «Додати витрату». The date must fall into the area (Current from 2026-10-01) and be on
        or after the account opening date; Current needs an active account; the category must be active, of the same area
        and direction. The currency comes from the account. A finance counterparty that is not confirmed yet gives verification
        NeedsCounterpartyReview; an archived counterparty cannot be newly chosen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceTransactionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceTransactionResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Account or category not found
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/transactions/{id}:
    put:
      tags:
      - Accounting
      operationId: updateFinanceTransaction
      description: Edit an active hand-made operation; the area stays. An unchanged account or category may already be archived
        or switched off; a new date must fit the area.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceTransactionUpdateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceTransactionResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Operation, account or category not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/transactions/{id}/void:
    post:
      tags:
      - Accounting
      operationId: voidFinanceTransaction
      description: '«Анулювати»: never deleted; the operation stays in the journal (includeVoided) and the log but no longer
        counts. A cancelled operation cannot be changed (400).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceVersionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceTransactionResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/transactions/{id}/history:
    get:
      tags:
      - Accounting
      operationId: getFinanceTransactionHistory
      description: Change log of one operation, newest first.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinanceHistoryEntryResponse'
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/transfers:
    get:
      tags:
      - Accounting
      operationId: getFinanceTransfers
      description: '«Перекази»: one area, newest first by default. accountId matches either side. Totals sum active transfers
        of the whole selection once per transfer, per currency.'
      parameters:
      - name: scope
        in: query
        schema:
          $ref: '#/components/schemas/LedgerScope'
        description: Current by default; LegacyArchive is «Домашня бухгалтерія»
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Inclusive
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: Inclusive
      - name: accountId
        in: query
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
        description: Case-insensitive part of the note
      - name: minMinor
        in: query
        schema:
          type: integer
          format: int64
      - name: maxMinor
        in: query
        schema:
          type: integer
          format: int64
      - name: source
        in: query
        schema:
          $ref: '#/components/schemas/MovementSource'
      - name: includeVoided
        in: query
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        schema:
          $ref: '#/components/schemas/FinanceJournalSort'
      - name: direction
        in: query
        schema:
          $ref: '#/components/schemas/FinanceSortDirection'
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
        description: 50 rows per page, fixed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceTransferPageResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '401':
          description: Not signed in
        '403':
          description: Not Director
    post:
      tags:
      - Accounting
      operationId: createFinanceTransfer
      description: «Додати переказ» between two different own accounts of one currency. Date and account rules as for operations,
        for both accounts. No balance check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceTransferInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceTransferResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: An account not found
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/transfers/{id}:
    put:
      tags:
      - Accounting
      operationId: updateFinanceTransfer
      description: Edit an active hand-made transfer; the area stays.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceTransferUpdateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceTransferResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Transfer or account not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/transfers/{id}/void:
    post:
      tags:
      - Accounting
      operationId: voidFinanceTransfer
      description: '«Анулювати» a transfer: it stays in the journal and the log but no longer moves money.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceVersionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceTransferResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/transfers/{id}/history:
    get:
      tags:
      - Accounting
      operationId: getFinanceTransferHistory
      description: Change log of one transfer, newest first.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinanceHistoryEntryResponse'
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/transactions/{id}/review:
    put:
      tags:
      - Accounting
      operationId: reviewFinanceTransaction
      description: '«Перевірити» an operation of «Потребують перевірки»: sets the category and who it is with, nothing else
        (date, account and amount of a bank line stay). A finance counterparty must be confirmed first (400). The result is
        Verified.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceTransactionReviewInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceTransactionResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Operation, category or counterparty not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/transactions/{id}/promote-oneoff:
    post:
      tags:
      - Accounting
      operationId: promoteFinanceOneoff
      description: '«Зробити постійним»: a confirmed finance counterparty is created from the one-off name and the operation
        is linked to it. Other operations with the same name are not changed.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceVersionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceTransactionResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/counterparties:
    get:
      tags:
      - Accounting
      operationId: getFinanceCounterparties
      description: '«Контрагенти», one tab: Financial (financial), Clients and Suppliers (parties, read-only, from «Клієнти»
        and «Постачальники»), Oneoffs (operations with a one-off name). 50 rows per page; counts of every tab with the same
        search. Without includeArchived archived records and cancelled operations are left out.'
      parameters:
      - name: tab
        in: query
        schema:
          $ref: '#/components/schemas/FinanceCounterpartyTab'
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
        description: Name, other names, ЄДРПОУ/ІПН or IBAN
      - name: includeArchived
        in: query
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCounterpartyPageResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '401':
          description: Not signed in
        '403':
          description: Not Director
    post:
      tags:
      - Accounting
      operationId: createFinanceCounterparty
      description: '«Додати фінансового» (verified false: waits for «Підтвердити») or «Зберегти як фінансового контрагента»
        from an operation (verified true). ЄДРПОУ keeps digits, IBAN letters and digits.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceCounterpartyInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCounterpartyResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Default category not found
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/counterparties/choices:
    get:
      tags:
      - Accounting
      operationId: getFinanceCounterpartyChoices
      description: 'Choices of the counterparty field of an operation: active finance counterparties, clients and suppliers
        matching search, at most 15 of each kind in that order.'
      parameters:
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
        description: Name or ЄДРПОУ/ІПН
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinanceCounterpartyChoiceResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/counterparties/{id}:
    put:
      tags:
      - Accounting
      operationId: updateFinanceCounterparty
      description: Edit a finance counterparty. The default category must be of the current books; auto-apply needs a confirmed
        counterparty with a default category.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceCounterpartyUpdateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCounterpartyResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Counterparty or default category not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/counterparties/{id}/verify:
    post:
      tags:
      - Accounting
      operationId: verifyFinanceCounterparty
      description: '«Підтвердити»: its active operations leave «Потребують перевірки» (without a category they stay as NeedsCategory)
        without a new version of each operation.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceVersionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCounterpartyResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Counterparty not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/counterparties/{id}/archive:
    post:
      tags:
      - Accounting
      operationId: archiveFinanceCounterparty
      description: '«Архівувати»: it cannot be chosen for new operations; operations keep the link.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceVersionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCounterpartyResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Counterparty not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/counterparties/{id}/restore:
    post:
      tags:
      - Accounting
      operationId: restoreFinanceCounterparty
      description: «Відновити» an archived finance counterparty.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceVersionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCounterpartyResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Counterparty not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/counterparties/{id}/merge:
    post:
      tags:
      - Accounting
      operationId: mergeFinanceCounterparty
      description: '«Об''єднати»: the counterparty is a duplicate of targetId. Its operations move to the target, its names
        become other names of the target, and it is archived with mergedIntoId. Returns the target.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceCounterpartyMergeInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCounterpartyResponse'
        '400':
          description: Invalid fields; body is a list of validation errors
        '404':
          description: Counterparty not found
        '409':
          description: The version is stale (someone saved first); body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/counterparties/{id}/history:
    get:
      tags:
      - Accounting
      operationId: getFinanceCounterpartyHistory
      description: Change log of one finance counterparty, newest first.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinanceHistoryEntryResponse'
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/transactions/{id}/attachments:
    get:
      tags:
      - Accounting
      operationId: getFinanceAttachments
      description: Files of one income or expense, oldest first; removed files are left out.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinanceAttachmentResponse'
        '404':
          description: No such operation
        '401':
          description: Not signed in
        '403':
          description: Not Director
    post:
      tags:
      - Accounting
      operationId: uploadFinanceAttachment
      description: '«Додати файл»: a PDF, JPEG or PNG from 1 byte to 10 MiB, told by its first bytes, into the private
        storage under finance/<transactionId>/<attachmentId>.<ext>. A voided operation takes no files. Logged as
        AttachmentAdd of the Transaction.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAttachmentResponse'
        '400':
          description: Wrong type, empty or larger than 10 MiB, or the operation is voided; body is a list of validation errors
        '404':
          description: No such operation
        '503':
          description: The file storage is not configured; body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/attachments/{id}:
    delete:
      tags:
      - Accounting
      operationId: deleteFinanceAttachment
      description: '«Видалити»: the file leaves the operation and the storage; the change log keeps its name
        (AttachmentDelete of the Transaction).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: No such file
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/attachments/{id}/content:
    get:
      tags:
      - Accounting
      operationId: getFinanceAttachmentContent
      description: 'The content for an inline view: Content-Disposition inline, Cache-Control private, no-store,
        X-Content-Type-Options nosniff.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: No such file
        '503':
          description: The file storage is not configured; body is an array of messages
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/legacy-import:
    post:
      tags:
      - Accounting
      operationId: importLegacyFinance
      description: '«Імпорт архіву Фінансів» (stage 5): finance.json of the old Calculator export (format brevi-finance-v5),
        as is or gzipped by the browser (told by the gzip signature; unpacked up to 200 MiB). dryRun=true only checks
        and reports. dryRun=false moves the records with their old ids in one transaction and only when the check has
        no errors; otherwise the report comes back with applied=false and nothing is written. A record whose id Brevi
        already has is skipped, so a second run adds only what is missing. Old clients and suppliers used in
        operations are linked to «Клієнти» by KeepinCRM id and to «Постачальники» by KeepinCRM id or a unique name;
        unknown ones become finance counterparties. Bank statement previews and files are not moved.'
      parameters:
      - name: dryRun
        in: query
        required: false
        schema:
          type: boolean
          default: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyFinanceImportReport'
        '400':
          description: No file, not JSON, a broken archive or larger than the limit; body is a list of validation errors
        '409':
          description: Records were added meanwhile; nothing is written, check again
        '413':
          description: The request is larger than 32 MiB
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/statements:
    get:
      tags:
      - Accounting
      operationId: getBankStatements
      description: «Історія виписок» (stage 6) — the last 100 uploaded statements of all accounts, newest first.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankStatementResponse'
        '401':
          description: Not signed in
        '403':
          description: Not Director
    post:
      tags:
      - Accounting
      operationId: uploadBankStatement
      description: '«Завантажити виписку» (stage 6): a statement of one account as the bank gave it — XLSX, XLS or CSV,
        at most 12 MiB and 10 000 rows. It becomes a preview with recognised lines (duplicates, transfers between own
        accounts, counterparties by ЄДРПОУ, IBAN or name, auto categories); nothing reaches the books until book. The
        same file of the same account returns the statement uploaded before with existing=true.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                  format: uuid
                file:
                  type: string
                  format: binary
              required:
              - accountId
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankStatementResponse'
        '400':
          description: No file, a wrong type, no header, ambiguous columns, a statement of another account, an archived
            account or larger than the limits; body is a list of validation errors
        '404':
          description: Account not found
        '413':
          description: The request is larger than 13 MiB
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/statements/{id}:
    get:
      tags:
      - Accounting
      operationId: getBankStatement
      description: A statement with 100 of its lines in file order (optionally of one state), the number of lines in
        each state and what book would add now.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BankLineState'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankStatementDetailsResponse'
        '404':
          description: Statement not found
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/statements/{id}/lines/{lineId}:
    put:
      tags:
      - Accounting
      operationId: updateBankStatementLine
      description: The director's choice for one line of a statement that is not booked — category of the current books
        in the direction of the line (or none), a counterparty or a one-off name (not both), description, note and
        excluded. A transfer line takes only the note and excluded; an error line and an exact duplicate cannot be
        included. The bank data never change.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankStatementLineInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankStatementLineResponse'
        '400':
          description: A broken rule (the statement is booked, a wrong category, both a counterparty and a one-off name)
        '404':
          description: Statement, line, category or counterparty not found
        '401':
          description: Not signed in
        '403':
          description: Not Director
  /api/accounting/statements/{id}/book:
    post:
      tags:
      - Accounting
      operationId: bookBankStatement
      description: '«Провести виписку»: every included line of states Ready, NeedsCategory and NewCounterparty becomes an
        operation (source BankImport) and every Transfer line a transfer, in one save, after the exact duplicates are
        checked again. A line nobody was recognised for creates an unconfirmed finance counterparty (one per ЄДРПОУ,
        IBAN or name). The statement becomes Booked and no longer changes.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceVersionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankStatementResponse'
        '400':
          description: Already booked or nothing to book
        '404':
          description: Statement not found
        '409':
          description: Stale version
        '401':
          description: Not signed in
        '403':
          description: Not Director
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
  schemas:
    FinanceAccountType:
      type: string
      enum:
      - Bank
      - Card
      - Cash
      - Other
    CategoryDirection:
      type: string
      enum:
      - Income
      - Expense
    LedgerScope:
      type: string
      enum:
      - Current
      - LegacyArchive
      description: 'Current: from 2026-10-01; LegacyArchive: «Домашня бухгалтерія» before it.'
    AuditEntity:
      type: string
      enum:
      - Account
      - Category
      - Transaction
      - Transfer
      - Counterparty
    AuditAction:
      type: string
      enum:
      - Create
      - Update
      - Archive
      - Restore
      - Delete
      - CutoverConfirm
      - CutoverReset
      - Void
      - Deactivate
      - Verify
      - Merge
      - Review
      - Promote
      - AttachmentAdd
      - AttachmentDelete
    AccountingSettingsResponse:
      type: object
      properties:
        cutoverDate:
          type: string
          format: date
        timeZone:
          type: string
        today:
          type: string
          format: date
      required:
      - cutoverDate
      - timeZone
      - today
    FinanceAccountResponse:
      type: object
      description: Money is in kopecks; version goes back with the next change.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/FinanceAccountType'
        currency:
          type: string
        iban:
          type: string
        openingMinor:
          type: integer
          format: int64
        openingDate:
          type: string
          format: date
        cutoverBalanceMinor:
          type:
          - integer
          - 'null'
          format: int64
        cutoverConfirmed:
          type: boolean
        cutoverConfirmedAt:
          type:
          - string
          - 'null'
          format: date-time
        cutoverConfirmedBy:
          type:
          - string
          - 'null'
        note:
          type: string
        active:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        balance:
          oneOf:
          - $ref: '#/components/schemas/FinanceAccountBalanceResponse'
          - type: 'null'
          description: Counted on every read; null only inside change log snapshots.
      required:
      - id
      - name
      - type
      - currency
      - iban
      - openingMinor
      - openingDate
      - cutoverBalanceMinor
      - cutoverConfirmed
      - cutoverConfirmedAt
      - cutoverConfirmedBy
      - note
      - active
      - sortOrder
      - version
      - createdAt
      - updatedAt
      - balance
    FinanceAccountBalanceResponse:
      type: object
      properties:
        legacyMinor:
          type: integer
          format: int64
          description: Opening balance plus active «Домашня бухгалтерія» movements
        currentMinor:
          type:
          - integer
          - 'null'
          format: int64
          description: Confirmed balance on 01.10.2026 plus active current movements; null while not confirmed (unknown, not
            zero)
        totalMinor:
          type: integer
          format: int64
          description: Opening balance plus every active movement of both areas; not legacy + current
        hasHistory:
          type: boolean
          description: True once any movement, cancelled ones too, uses the account
      required:
      - legacyMinor
      - currentMinor
      - totalMinor
      - hasHistory
    FinanceAccountInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 140
        type:
          $ref: '#/components/schemas/FinanceAccountType'
        currency:
          type: string
          maxLength: 10
          description: ISO code, UAH by default
        iban:
          type:
          - string
          - 'null'
          maxLength: 128
        openingMinor:
          type: integer
          format: int64
          description: Opening balance in kopecks
        openingDate:
          type: string
          format: date
        note:
          type:
          - string
          - 'null'
          maxLength: 620
        sortOrder:
          type: integer
          format: int32
      required:
      - name
      - type
      - currency
      - openingMinor
      - openingDate
      - sortOrder
    FinanceAccountUpdateInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 140
        type:
          $ref: '#/components/schemas/FinanceAccountType'
        currency:
          type: string
          maxLength: 10
          description: ISO code, UAH by default
        iban:
          type:
          - string
          - 'null'
          maxLength: 128
        openingMinor:
          type: integer
          format: int64
          description: Opening balance in kopecks
        openingDate:
          type: string
          format: date
        note:
          type:
          - string
          - 'null'
          maxLength: 620
        sortOrder:
          type: integer
          format: int32
        version:
          type: integer
          format: int32
      required:
      - name
      - type
      - currency
      - openingMinor
      - openingDate
      - sortOrder
      - version
    FinanceAccountCutoverInput:
      type: object
      properties:
        balanceMinor:
          type:
          - integer
          - 'null'
          format: int64
          description: Required when confirmed
        confirmed:
          type: boolean
        version:
          type: integer
          format: int32
      required:
      - confirmed
      - version
    FinanceVersionInput:
      type: object
      properties:
        version:
          type: integer
          format: int32
      required:
      - version
    FinanceCategoryResponse:
      type: object
      description: parentId is null for a root.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        direction:
          $ref: '#/components/schemas/CategoryDirection'
        scope:
          $ref: '#/components/schemas/LedgerScope'
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        note:
          type: string
        active:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        version:
          type: integer
          format: int32
      required:
      - id
      - name
      - direction
      - scope
      - parentId
      - note
