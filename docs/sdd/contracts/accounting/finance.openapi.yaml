      type: string
      enum:
      - Preview
      - Booked
    BankLineState:
      type: string
      description: Worst first — Error is never booked, Duplicate is already in the books, Transfer goes to another own
        account, NewCounterparty has nobody recognised (or an unconfirmed finance counterparty), NeedsCategory has no
        category.
      enum:
      - Ready
      - NeedsCategory
      - NewCounterparty
      - Transfer
      - Duplicate
      - Error
    BankDuplicate:
      type: string
      description: Exact — the same bank id or fingerprint, never booked; Probable — a similar record, excluded at first
        but may be included.
      enum:
      - None
      - Probable
      - Exact
