openapi: 3.1.0
info:
  title: 'Purchasing: «Рахунки на закупку» register'
  version: 1.3.0
  description: 'Register of purchase invoices read from the Google Sheet «БРЕВІ команда» / «финансы» (PUR-001). Policy
    access:purchase-invoices («Права доступу»): only the Director by default; other roles get 403. The sheet is only read, never written.'
security:
- Bearer: []
paths:
  /api/purchasing/invoices:
    get:
      tags:
      - Purchasing
      operationId: getPurchaseInvoices
      description: One page of cards, one per Telegram message, newest message first (unknown dates last). Search matches
        the message text (case-insensitive) or an exact UID. Filter WithoutSupplier lists cards with no supplier linked;
        NotRecognized lists cards with a link that has no checked facts; NeedsReview also includes cards whose last
        recognition of a file failed.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
          maximum: 10000
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
          default: 50
          minimum: 1
          maximum: 100
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
      - name: filter
        in: query
        schema:
          $ref: '#/components/schemas/PurchaseInvoiceFilter'
      - name: supplierId
        in: query
        description: The supplier card tab «Рахунки на закупку»; only cards linked to this supplier.
        schema:
          type: integer
          minimum: 1
      - name: documentFrom
        in: query
        description: Only cards with a checked document dated on or after this day.
        schema:
          type: string
          format: date
      - name: documentTo
        in: query
        description: Only cards with a checked document dated on or before this day; not earlier than documentFrom.
        schema:
          type: string
          format: date
      - name: vat
        in: query
        description: Only cards with a checked document of this VAT mode.
        schema:
          $ref: '#/components/schemas/PurchaseDocumentVat'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseInvoicePage'
        '400':
          description: Invalid page, page size, search or filter
        '401':
          description: Not signed in
        '403':
          description: Not the Director
  /api/purchasing/invoices/suppliers:
    get:
      tags:
      - Purchasing
      operationId: getPurchaseInvoiceSuppliers
      description: Active Brevi suppliers (Reference) by name, for the supplier link. Offered here because the accountant
        cannot read the Reference supplier list.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseSupplierOption'
        '401':
          description: Not signed in
        '403':
          description: Not the Director
  /api/purchasing/invoices/{messageId}/review:
    put:
      tags:
      - Purchasing
      operationId: reviewPurchaseInvoice
      description: 'Links a supplier (or none) and writes a note (stage 2). version is the reviewVersion the user saw; each
        real change adds 1 and a history entry with the values before and after. Saving the same values changes nothing.
        The sheet sync never touches these fields.'
      parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseInvoiceReviewRequest'
      responses:
        '200':
          description: Saved (or unchanged)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseInvoiceReviewResponse'
        '400':
          description: Note longer than 1000 characters or invalid supplier id
        '401':
          description: Not signed in
        '403':
          description: Not the Director
        '404':
          description: Card not found, or the supplier is unknown or no longer used (an inactive supplier may stay linked)
        '409':
          description: The version is stale (someone saved first) or the sheet sync is running; body is an array of messages
  /api/purchasing/invoices/{messageId}/payments/candidates:
    get:
      tags:
      - Purchasing
      operationId: getPurchasePaymentCandidates
      description: 'Expenses of «Бухгалтерія» for «Прив''язати оплату» (accounting stage 9), at most 20, active, of both
        scopes. Without search — the expenses of the linked supplier, or without a supplier those equal to the invoice
        total; with search — any expense whose description, note or one-off name contains it, or whose amount equals it.
        Already linked ones are left out; those equal to the invoice total come first (sameAmount).'
      parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchasePaymentCandidateResponse'
        '401':
          description: Not signed in
        '403':
          description: No «Рахунки на закупку» right
        '404':
          description: Card not found
  /api/purchasing/invoices/{messageId}/payments:
    post:
      tags:
      - Purchasing
      operationId: linkPurchasePayment
      description: 'Links an active expense of «Бухгалтерія» as a payment of the invoice and adds 1 to reviewVersion. The
        same operation may pay several invoices; nothing is booked in «Бухгалтерія».'
      parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchasePaymentRequest'
      responses:
        '200':
          description: Linked; the payments of the invoice now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseInvoicePaymentsResponse'
        '400':
          description: The operation is not an active expense
        '401':
          description: Not signed in
        '403':
          description: No «Рахунки на закупку» right
        '404':
          description: Card not found
        '409':
          description: The version is stale, the operation is already linked or the sheet sync is running
  /api/purchasing/invoices/{messageId}/payments/unlink:
    post:
      tags:
      - Purchasing
      operationId: unlinkPurchasePayment
      description: Removes an active payment link and adds 1 to reviewVersion; the link stays in the history with who removed
        it and when.
      parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchasePaymentRequest'
      responses:
        '200':
          description: Removed; the payments of the invoice now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseInvoicePaymentsResponse'
        '401':
          description: Not signed in
        '403':
          description: No «Рахунки на закупку» right
        '404':
          description: Card not found
        '409':
          description: The version is stale, the link is already removed or the sheet sync is running
  /api/purchasing/invoices/sync-state:
    get:
      tags:
      - Purchasing
      operationId: getPurchaseInvoicesSyncState
      responses:
        '200':
          description: OK; nulls and zeros before the first sync
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSyncStateResponse'
        '401':
          description: Not signed in
        '403':
          description: Not the Director
  /api/purchasing/invoices/sync:
    post:
      tags:
      - Purchasing
      operationId: syncPurchaseInvoices
      description: '«Оновити зараз»: reads the whole sheet, checks it, then applies it in one transaction. Safe to repeat;
        manual supplier links and notes are never changed. Rows and links missing from the sheet become inactive.'
      responses:
        '200':
          description: Synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSyncResponse'
        '401':
          description: Not signed in
        '403':
          description: Not the Director
        '409':
          description: Another sync is running; body is an array of messages
        '422':
          description: The sheet breaks a register rule (header, duplicate UID, different payment marks in one message, a UID
            moved to another message); nothing changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseErrors'
        '503':
          description: Google Sheets cannot be read (no access, not found, not responding); nothing changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseErrors'
  /api/purchasing/invoices/files/{fileId}/recognize:
    post:
      tags:
      - Purchasing
      operationId: recognizePurchaseFile
      description: '«Розпізнати» / «Розпізнати знову» (stage 3): downloads the Dropbox original (PDF or picture, at most
        20 MB), reads it with the fast model of «Налаштування ШІ», checks the facts in kopecks and retries once with the
        strong model. Valid facts are saved (earlier ones go to history); otherwise the problems are recorded and shown on
        the card. Problems of the answer come back with 200.'
      parameters:
      - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Tried; see result and problems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRecognitionResponse'
        '400':
          description: The link is not a safe Dropbox link
        '401':
          description: Not signed in
        '403':
          description: Not the Director
        '404':
          description: File not found or its message has no active rows
        '409':
          description: The sheet sync is running; body is an array of messages
        '503':
          description: The AI is off, has no key or reached its monthly limit; nothing was sent or recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseErrors'
  /api/purchasing/invoices/recognize-new:
    post:
      tags:
      - Purchasing
      operationId: recognizeNewPurchaseFiles
      description: 'One batch (5 files) of «Розпізнати всі нові»: active safe links never tried before, newest messages
        first. Repeat while remaining is above 0 and stopReason is null. Failed files are not retried here; use
        recognizePurchaseFile.'
      responses:
        '200':
          description: Batch done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRecognitionBatchResponse'
        '401':
          description: Not signed in
        '403':
          description: Not the Director
  /api/purchasing/invoices/files/{fileId}/document:
    put:
      tags:
      - Purchasing
      operationId: savePurchaseDocument
      description: '«Завантажити JSON»: checked facts prepared by hand. sourceUID must be an active row of the file''s
        message and originalFileLink the exact link. The same facts again change nothing; different saved facts need
        replace = true (the old ones go to history).'
      parameters:
      - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseDocumentSaveRequest'
      responses:
        '200':
          description: Saved or unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseDocumentSaveResponse'
        '400':
          description: The facts fail the checks (problems in Ukrainian) or the UID does not belong to the message
        '401':
          description: Not signed in
        '403':
          description: Not the Director
        '404':
          description: File not found
        '409':
          description: Other facts are saved and replace is false, or the sheet sync is running
  /api/purchasing/invoices/files/{fileId}/document-template:
    get:
      tags:
      - Purchasing
      operationId: getPurchaseDocumentTemplate
      description: '«Шаблон JSON»: the saved facts, else the last AI answer, else empty fields, with sourceUID and
        originalFileLink filled in.'
      parameters:
      - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseDocumentFile'
        '401':
          description: Not signed in
        '403':
          description: Not the Director
        '404':
          description: File not found or its message has no active rows
components:
  parameters:
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
  schemas:
    PurchaseInvoiceFilter:
      type: string
      enum:
      - All
      - NeedsReview
      - WithoutSupplier
      - NotRecognized
    PurchaseInvoiceState:
      type: string
      description: NeedsReview when the representative row or the last recognition of a file has problems; Recognized
        when every safe link has checked facts; otherwise AwaitingRecognition. Shown only as problems, never as a badge.
      enum:
      - NeedsReview
      - AwaitingRecognition
      - Recognized
    PurchaseInvoiceLinkResponse:
      type: object
      required:
      - id
      - url
      - safe
      properties:
        id:
          type: string
          description: File id, SHA-256 of messageId:url.
        url:
          type: string
          description: The exact link from the sheet.
        safe:
          type: boolean
          description: True only for an HTTPS dropbox.com link without user or password; show other links as text.
        document:
          description: Checked facts of the original; null until recognised or uploaded.
          oneOf:
          - $ref: '#/components/schemas/PurchaseDocumentResponse'
          - type: 'null'
        recognition:
          description: The last recognition while there are no checked facts; null otherwise.
          oneOf:
          - $ref: '#/components/schemas/PurchaseRecognitionAttemptResponse'
          - type: 'null'
    PurchaseInvoiceResponse:
      type: object
      required:
      - messageId
      - telegramKey
      - sourceUid
      - rowNumber
      - sourceRowCount
      - text
      - statusOriginal
      - markedPaid
      - reviewVersion
      - state
      - issues
      - links
      - payments
      - paymentIssues
      properties:
        messageId:
          type: string
        telegramKey:
          type: string
          description: ChatId:MessageId.
        sourceUid:
          type: string
          description: UID of the representative row (smallest row number).
        rowNumber:
          type: integer
          format: int32
        sourceRowCount:
          type: integer
          format: int32
          description: Active sheet rows of this message.
        chatName:
          type:
          - string
          - 'null'
        fromUser:
          type:
          - string
          - 'null'
          description: Author of the message.
        messageAt:
          type:
          - string
          - 'null'
          description: The DateTime cell as written in the sheet.
        text:
          type: string
        statusOriginal:
          type: string
        markAt:
          type:
          - string
          - 'null'
        markBy:
          type:
          - string
          - 'null'
          description: Who set the payment mark (FromUserStatus).
        markedPaid:
          type: boolean
          description: Status is exactly «СПЛАЧЕНО». A note from the sheet, not a payment.
        supplierId:
          type:
          - integer
          - 'null'
          format: int32
          description: Brevi supplier linked by hand.
        supplierName:
          type:
          - string
          - 'null'
          description: Name of the linked supplier; null when none is linked or the supplier no longer exists.
        reviewNote:
          type:
          - string
          - 'null'
        reviewVersion:
          type: integer
          format: int32
          description: Send it back with the next review.
        reviewedBy:
          type:
          - string
          - 'null'
          description: E-mail of who last changed the supplier link, note or payments.
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
        state:
          $ref: '#/components/schemas/PurchaseInvoiceState'
        issues:
          type: array
          items:
            type: string
          description: Reasons for a manual check, in Ukrainian.
        links:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseInvoiceLinkResponse'
        totalPayableMinor:
          type:
          - integer
          - 'null'
          format: int64
          description: Sum of «До сплати» of the checked documents in kopecks; null without a document.
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseInvoicePaymentResponse'
          description: Expenses of «Бухгалтерія» linked as payments, oldest link first.
        paymentIssues:
          type: array
          items:
            type: string
          description: Payment problems in Ukrainian (voided, not found, not in hryvnias, another amount); they do not change
            state.
    PurchasePaymentRequest:
      type: object
      required:
      - transactionId
      - version
      properties:
        transactionId:
          type: string
          format: uuid
          description: Operation id in «Бухгалтерія».
        version:
          type: integer
          format: int32
          description: The reviewVersion the user saw.
    PurchaseInvoicePaymentResponse:
      type: object
      required:
      - transactionId
      - missing
      - voided
      - linkedBy
      - linkedAt
      properties:
        transactionId:
          type: string
          format: uuid
        date:
          type:
          - string
          - 'null'
          format: date
        amountMinor:
          type:
          - integer
          - 'null'
          format: int64
        currency:
          type:
          - string
          - 'null'
        accountName:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        counterpartyName:
          type:
          - string
          - 'null'
        missing:
          type: boolean
          description: The operation is not found in «Бухгалтерія»; its fields are null.
        voided:
          type: boolean
          description: The operation was voided after linking.
        linkedBy:
          type: string
        linkedAt:
          type: string
          format: date-time
    PurchasePaymentCandidateResponse:
      type: object
      required:
      - transactionId
      - date
      - amountMinor
      - currency
      - accountName
      - description
      - sameAmount
      properties:
        transactionId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
        accountName:
          type: string
        description:
          type: string
        counterpartyName:
          type:
          - string
          - 'null'
        sameAmount:
          type: boolean
          description: Equals the invoice total.
    PurchaseInvoicePaymentsResponse:
      type: object
      required:
      - messageId
      - reviewVersion
      - payments
      - paymentIssues
      properties:
        messageId:
          type: string
        reviewVersion:
          type: integer
          format: int32
        totalPayableMinor:
          type:
          - integer
          - 'null'
          format: int64
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseInvoicePaymentResponse'
        paymentIssues:
          type: array
          items:
            type: string
    PurchaseSupplierOption:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    PurchaseInvoiceReviewRequest:
      type: object
      required:
      - version
      properties:
        supplierId:
          type:
          - integer
          - 'null'
          format: int32
          description: Null removes the link.
        note:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Trimmed; empty removes the note.
        version:
          type: integer
          format: int32
          minimum: 0
    PurchaseInvoiceReviewResponse:
      type: object
      required:
      - messageId
      - reviewVersion
      properties:
        messageId:
          type: string
        supplierId:
          type:
          - integer
          - 'null'
          format: int32
        supplierName:
          type:
          - string
          - 'null'
        reviewNote:
          type:
          - string
          - 'null'
        reviewVersion:
          type: integer
          format: int32
        reviewedBy:
          type:
          - string
          - 'null'
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
    PurchaseInvoicePage:
      type: object
      required:
      - items
      - total
      - page
      - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseInvoiceResponse'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
    PurchaseSyncStateResponse:
      type: object
      required:
      - recordCount
      - fileCount
      properties:
        lastSuccessAt:
          type:
          - string
          - 'null'
          format: date-time
        lastAttemptAt:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type:
          - string
          - 'null'
          description: Reason of the last failed attempt; null after a success.
        recordCount:
          type: integer
          format: int32
          description: Active sheet rows after the last successful sync.
        fileCount:
          type: integer
          format: int32
    PurchaseSyncResponse:
      type: object
      required:
      - recordCount
      - fileCount
      - messagesAdded
      - messagesUpdated
      - rowsAdded
      - rowsUpdated
      - rowsDeactivated
      - filesAdded
      - filesDeactivated
      - syncedAt
      properties:
        recordCount:
          type: integer
          format: int32
        fileCount:
          type: integer
          format: int32
        messagesAdded:
          type: integer
          format: int32
        messagesUpdated:
          type: integer
          format: int32
        rowsAdded:
          type: integer
          format: int32
        rowsUpdated:
          type: integer
          format: int32
        rowsDeactivated:
          type: integer
          format: int32
        filesAdded:
          type: integer
          format: int32
        filesDeactivated:
          type: integer
          format: int32
        syncedAt:
          type: string
          format: date-time
    PurchaseDocumentVat:
      type: string
      description: WithVat only when VAT is clearly printed; otherwise WithoutVat.
      enum:
      - WithVat
      - WithoutVat
    PurchaseDocumentSource:
      type: string
      enum:
      - Ai
      - Manual
    PurchaseRecognitionResult:
      type: string
      description: Skipped means the type cannot be read by AI (Excel, Word); upload JSON by hand.
      enum:
      - Recognized
      - NeedsReview
      - Failed
      - Skipped
    PurchaseDocumentItemResponse:
      type: object
      required:
      - position
      - name
      - quantity
      - price
      - sum
      properties:
        position:
          type: integer
          format: int32
        name:
          type: string
        quantity:
          type: string
          description: Decimal with a dot, up to 4 places.
        unit:
          type:
          - string
          - 'null'
        price:
          type: string
          description: As printed; with VAT when pricesIncludeVat.
        sum:
          type: string
          description: Up to 2 places.
    PurchaseDocumentResponse:
      type: object
      required:
      - documentType
      - documentNumber
      - documentDate
      - supplierName
      - vat
      - pricesIncludeVat
      - totalPayable
      - items
      - source
      - checkedBy
      - checkedAt
      properties:
        documentType:
          type: string
        documentNumber:
          type: string
        documentDate:
          type: string
          format: date
        supplierName:
          type: string
          description: As printed; never links a Brevi supplier by itself.
        vat:
          $ref: '#/components/schemas/PurchaseDocumentVat'
        pricesIncludeVat:
          type: boolean
        vatAmount:
          type:
          - string
          - 'null'
        totalPayable:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseDocumentItemResponse'
        source:
          $ref: '#/components/schemas/PurchaseDocumentSource'
        model:
          type:
          - string
          - 'null'
          description: OpenAI model that read it; null for a manual file.
        checkedBy:
          type: string
        checkedAt:
          type: string
          format: date-time
    PurchaseRecognitionAttemptResponse:
      type: object
      required:
      - result
      - problems
      - costUsd
      - by
      - at
      properties:
        result:
          $ref: '#/components/schemas/PurchaseRecognitionResult'
        problems:
          type: array
          items:
            type: string
        model:
          type:
          - string
          - 'null'
        costUsd:
          type: number
        by:
          type: string
        at:
          type: string
          format: date-time
    PurchaseRecognitionResponse:
      type: object
      required:
      - fileId
      - result
      - problems
      - costUsd
      properties:
        fileId:
          type: string
        result:
          $ref: '#/components/schemas/PurchaseRecognitionResult'
        problems:
          type: array
          items:
            type: string
        model:
          type:
          - string
          - 'null'
        costUsd:
          type: number
    PurchaseRecognitionBatchResponse:
      type: object
      required:
      - recognized
      - needsReview
      - failed
      - skipped
      - remaining
      - costUsd
      properties:
        recognized:
          type: integer
          format: int32
        needsReview:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32
        remaining:
          type: integer
          format: int32
          description: New files still waiting after this batch.
        costUsd:
          type: number
        stopReason:
          type:
          - string
          - 'null'
          description: Why the batch stopped early (AI off, no key, monthly limit, sync running).
    PurchaseDocumentFile:
      type: object
      description: 'The JSON of checked facts. Decimals are strings with a dot. vat: with_vat or without_vat.'
      required:
      - sourceUID
      - originalFileLink
      - documentType
      - documentNumber
      - documentDate
      - supplierName
      - vat
      - pricesIncludeVat
      - items
      - vatAmount
      - totalPayable
      properties:
        sourceUID:
          type: string
        originalFileLink:
          type: string
        documentType:
          type: string
        documentNumber:
          type: string
        documentDate:
          type: string
          description: YYYY-MM-DD
        supplierName:
          type: string
        vat:
          type: string
          enum:
          - with_vat
          - without_vat
        pricesIncludeVat:
          type: boolean
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required:
            - name
            - quantity
            - price
            - sum
            properties:
              name:
                type: string
              quantity:
                type: string
              unit:
                type:
                - string
                - 'null'
              price:
                type: string
              sum:
                type: string
        vatAmount:
          type:
          - string
          - 'null'
        totalPayable:
          type: string
    PurchaseDocumentSaveRequest:
      type: object
      required:
      - document
      - replace
      properties:
        document:
          $ref: '#/components/schemas/PurchaseDocumentFile'
        replace:
          type: boolean
          description: Confirms replacing different saved facts.
    PurchaseDocumentSaveResponse:
      type: object
      required:
      - fileId
      - unchanged
      - replaced
      properties:
        fileId:
          type: string
        unchanged:
          type: boolean
        replaced:
          type: boolean
    PurchaseErrors:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: string
